<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Physical Ping — pTCP v1.2 VISUALIZATION</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(170deg,#0a0f14 0%,#0d1520 40%,#0a1218 100%);color:#8899aa;font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(0,255,170,.1)}50%{box-shadow:0 0 20px rgba(0,255,170,.25)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f14}::-webkit-scrollbar-thumb{background:#1a2a3a;border-radius:2px}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,170,.005) 2px,rgba(0,255,170,.005) 4px);pointer-events:none;z-index:100}
.ctn{max-width:960px;margin:0 auto;padding:20px 16px}
.hdr{margin-bottom:18px;border-bottom:1px solid #1a2530;padding-bottom:14px}
.hdr-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hdr h1{font-size:18px;font-weight:600;color:#00ffaa;letter-spacing:3px;text-shadow:0 0 20px rgba(0,255,170,.3)}
.hdr .ver{font-size:10px;color:#334455;letter-spacing:1px}
.hdr .sub{font-size:10px;color:#00ffaa44;letter-spacing:1.5px;margin-top:2px}
.hdr p{font-size:11px;color:#445566;line-height:1.6;margin-top:6px}
.sec{margin-bottom:14px;padding:12px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2)}
.sec-label{font-size:10px;color:#445566;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-label .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.layer-tabs{display:flex;gap:2px;margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;flex-wrap:wrap}
.layer-tab{flex:1;padding:10px 6px;text-align:center;font-size:10px;letter-spacing:1px;cursor:pointer;border:none;background:rgba(0,0,0,.3);color:#556677;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;position:relative;min-width:50px}
.layer-tab:hover{background:rgba(255,255,255,.02)}
.layer-tab.active{background:rgba(0,0,0,.5);color:#c0d0e0}
.layer-tab .tab-icon{font-size:13px;display:block;margin-bottom:2px}
.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;padding:10px 20px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-ping{background:linear-gradient(180deg,#00ffaa22,#00ffaa11);border:1px solid #00ffaa44;color:#00ffaa}
.btn-ping:disabled{background:#0a2a1a;cursor:wait;opacity:.6}
.btn-sm{padding:6px 12px;font-size:10px;letter-spacing:1px}
.btn-stop{background:linear-gradient(180deg,#ff333322,#ff333311);border:1px solid #ff333344;color:#ff3333;animation:pulse 1s infinite}
.btn-calib{background:transparent;border:1px solid #ffcc0044;color:#ffcc00}
.sel-grp{display:flex;align-items:center;gap:6px}
.sel-grp span{font-size:10px;color:#445566;letter-spacing:1px}
.sel-grp select{background:#0d1520;border:1px solid #1a2530;color:#8899aa;padding:4px 8px;font-size:11px;font-family:inherit;border-radius:2px}
.err{padding:10px 14px;background:rgba(255,50,50,.08);border:1px solid #ff333344;border-radius:2px;font-size:11px;color:#ff6666;margin-bottom:12px}
.nfo{padding:10px 14px;background:rgba(0,255,170,.04);border:1px solid #00ffaa22;border-radius:2px;font-size:11px;color:#00ffaa88;margin-bottom:12px;line-height:1.6}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:1px;background:#1a2530;border:1px solid #1a2530;border-radius:2px;margin-bottom:14px;overflow:hidden}
.st{background:#0d1520;text-align:center;padding:7px 4px}
.st-l{font-size:9px;letter-spacing:1.5px;color:#556677;margin-bottom:2px}
.st-v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.cv-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.2)}
.cv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;padding:8px 10px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.cv{display:block;width:100%}
.log{border:1px solid #1a2530;border-radius:2px;overflow:hidden}
.log-h,.log-r{display:grid;grid-template-columns:56px 46px 60px 62px 56px 56px 1fr;padding:5px 8px;align-items:center}
.log-h{font-size:9px;letter-spacing:1.5px;color:#334455;border-bottom:1px solid #1a2530;background:rgba(0,0,0,.3)}
.log-b{max-height:300px;overflow:auto}
.log-r{font-size:11px;border-bottom:1px solid rgba(26,37,48,.5);color:#8899aa;animation:fadeIn .25s ease}
.log-r:nth-child(even){background:rgba(255,255,255,.008)}
.log-r.to{color:#555}
.empty{text-align:center;padding:44px 20px;color:#334455}
.empty-i{font-size:32px;margin-bottom:10px;opacity:.3}
.empty-t{font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty-d{font-size:10px;color:#223344;max-width:440px;margin:0 auto;line-height:1.8}
.leg{margin-top:14px;padding-top:10px;border-top:1px solid #1a2530;display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#445566;letter-spacing:1px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-d{width:6px;height:6px;border-radius:1px}
.ftr{margin-top:8px;font-size:9px;color:#223344;line-height:1.8}
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.em-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.em-card-h{font-size:9px;letter-spacing:2px;color:#556677;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.em-card-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.em-card-u{font-size:10px;color:#556677;margin-left:3px}
.em-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.em-bar-bg{flex:1;height:4px;background:#0a0f14;border-radius:1px;overflow:hidden}
.em-bar-fill{height:100%;border-radius:1px;transition:width .3s}
.med-coeff{padding:16px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.25);margin-bottom:14px;position:relative;overflow:hidden}
.med-coeff::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,255,170,.03) 0%,transparent 70%);pointer-events:none}
.med-val{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.med-lbl{font-size:8px;letter-spacing:2px;color:#556677;margin-top:2px}
.radar-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);padding:12px}
.radar-wrap canvas{display:block;margin:0 auto}
.sp-tag{display:inline-block;padding:3px 8px;font-size:9px;letter-spacing:1.5px;border-radius:1px;margin:2px}
.src-badge{display:inline-block;padding:1px 5px;font-size:7px;letter-spacing:1.5px;font-weight:600;border-radius:2px;vertical-align:middle;line-height:1.6}
.src-badge.real{background:rgba(0,255,170,.1);border:1px solid rgba(0,255,170,.35);color:#00ffaa}
.src-badge.sim{background:rgba(255,204,0,.08);border:1px solid rgba(255,204,0,.3);color:#ffcc00}
.src-badge.na{background:rgba(102,119,136,.08);border:1px solid rgba(102,119,136,.25);color:#667788}
.src-badge.est{background:rgba(255,136,0,.08);border:1px solid rgba(255,136,0,.3);color:#ff8800}
.reality-bar{display:flex;height:10px;border-radius:1px;overflow:hidden;gap:1px;margin:8px 0}
.reality-bar .rb-seg{transition:width .4s ease}
.src-matrix{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:4px;margin-top:8px}
.src-cell{text-align:center;padding:6px 3px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.src-cell-l{font-size:8px;letter-spacing:1px;color:#556677;margin-bottom:2px}
.src-cell-v{font-size:11px;font-weight:600}
.src-cell-s{font-size:7px;margin-top:2px;letter-spacing:1px}
.ts-legend{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;font-size:8px}
.ts-legend-item{display:flex;align-items:center;gap:3px;cursor:pointer;padding:2px 5px;border:1px solid transparent;border-radius:2px;transition:all .15s}
.ts-legend-item:hover{background:rgba(255,255,255,.03)}
.ts-legend-item.disabled{opacity:.25}
.ts-swatch{width:8px;height:3px;border-radius:1px}
.profile-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:6px;cursor:pointer;transition:all .15s}
.profile-card:hover{border-color:#00ffaa33}
.profile-card.selected{border-color:#00ffaa66;background:rgba(0,255,170,.04)}
.stat-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.stat-label{font-size:8px;letter-spacing:2px;color:#556677;margin-bottom:4px}
.stat-value{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-sub{font-size:9px;color:#445566;margin-top:2px}
.alert-item{padding:8px 10px;border-left:3px solid;margin-bottom:4px;background:rgba(0,0,0,.15);font-size:10px;animation:fadeIn .3s ease}
.w-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.w-row label{font-size:8px;letter-spacing:1px;color:#556677;min-width:50px}
.w-row input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#1a2530;border-radius:2px;outline:none}
.w-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;cursor:pointer;background:#00ffaa}
.w-row .w-val{font-size:10px;min-width:32px;text-align:right;font-variant-numeric:tabular-nums;color:#667788}
.gantt-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #1a253022}
.gantt-label{font-size:8px;letter-spacing:1px;color:#556677;min-width:56px}
.gantt-bar-wrap{flex:1;height:14px;position:relative;background:#0a0f14;border-radius:1px;overflow:hidden}
.gantt-seg{position:absolute;top:0;height:100%;transition:width .3s}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff-bar{display:flex;align-items:center;gap:4px;padding:2px 0}
.diff-bar-label{font-size:8px;color:#556677;min-width:46px;letter-spacing:1px}
.diff-bar-visual{flex:1;height:6px;background:#0a0f14;border-radius:1px;overflow:hidden}
.diff-bar-fill{height:100%;border-radius:1px;transition:width .3s}
.diff-bar-val{font-size:9px;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.net-node{padding:8px 10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;animation:fadeIn .3s ease}
.net-node.self{border-color:#00ffaa33;background:rgba(0,255,170,.04)}
.phase-law-card{padding:14px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2);margin-bottom:8px;position:relative;overflow:hidden}
@media(max-width:600px){
  .log-h,.log-r{grid-template-columns:50px 40px 52px 54px 48px 50px 1fr;font-size:10px;padding:4px 6px}
  .st-v{font-size:14px}.hdr h1{font-size:16px;letter-spacing:2px}
  .em-grid{grid-template-columns:1fr}
  .layer-tab{padding:8px 3px;font-size:7px;letter-spacing:.5px;min-width:38px}
  .compare-grid{grid-template-columns:1fr}
}
</style>
</head>

    var mc=mediation.composite,mcC=mc>.6?'#00ffaa':mc>.3?'#ffcc00':'#ff4444';
    ch.push(h('div',{className:'med-coeff',key:'med'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ffcc00'}}),'MEDIATION COEFFICIENT — μ(x,t) v1.2'),
      h('div',{style:{textAlign:'center',margin:'12px 0'}},h(MedRing,{value:mc}),
        h('div',{style:{position:'relative',marginTop:'-80px',marginBottom:'40px'}},
          h('div',{className:'med-val',style:{color:mcC}},mc.toFixed(4)),
          h('div',{className:'med-lbl'},'COMPOSITE'))),
      h('div',{className:'src-matrix'},
        DIM_KEYS.map(function(k){var v=mediation.dims[k]||0;var src=mediation.sources[k]||'na';
          return h('div',{className:'src-cell',key:k,style:{borderColor:src==='real'?DIM_COLORS[k]+'33':'#1a2530'}},
            h('div',{className:'src-cell-l'},DIM_LABELS[k]),
            h('div',{className:'src-cell-v',style:{color:src==='na'?'#334455':DIM_COLORS[k]}},v.toFixed(3)),
            h('div',{className:'src-cell-s'},srcBadge(src)),
            h('div',{className:'em-bar-row',style:{marginTop:'4px'}},h('div',{className:'em-bar-bg'},h('div',{className:'em-bar-fill',style:{width:(v*100)+'%',background:DIM_COLORS[k]+'66'}}))));}))));
    ch.push(h('div',{className:'sec',key:'med-f'},h('div',{className:'sec-label'},'FORMULA v1.2'),
      h('div',{style:{fontSize:'10px',color:'#667788',lineHeight:'2',fontFamily:'monospace'}},
        'μ(x,t) = Σ wᵢ · dᵢ(x,t) / Σ wᵢ',h('br'),
        'dᵢ ∈ {acoustic, emField, photonic, kinetic, rfDensity, nfcField, thermal, spatial, bleMesh, network, collaborative}',h('br'),
        h('span',{style:{color:'#00ffaa'}},'v1.2: '),h('span',{style:{color:'#445566'}},'インタラクティブ重み調整 + 時系列ストレージ + プロファイル永続化'))));
  }

  /* ═══ v1.2: PROFILES TAB ═══ */
  if(layer==='profiles'){
    var stats=medHist.getStats();
    ch.push(h('div',{className:'sec',key:'prof-hdr'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#00ddff'}}),'SPATIAL PROFILES — v1.2'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'1.6'}},'空間プロファイルの保存・エクスポート・インポート・比較。IndexedDB永続化。')));
    /* Save current profile */
    ch.push(h('div',{className:'ctrl',key:'prof-save'},
      h('button',{className:'btn',onClick:function(){
        if(medHist.history.length<5){setInfo('5+サンプル必要');return;}
        var name=prompt('Profile name:','Profile '+new Date().toLocaleString());
        if(!name)return;
        profileStore.saveProfile(name,medHist.history,stats,{weights:weights,deviceId:DEVICE_ID});
        setInfo('✓ Profile saved: '+name);
      },disabled:medHist.history.length<5,style:{background:'#00ddff15',border:'1px solid #00ddff44',color:'#00ddff'}},'⊕ SAVE CURRENT PROFILE'),
      h('label',{style:{cursor:'pointer',padding:'10px 20px',fontSize:'12px',letterSpacing:'2px',border:'1px solid #ffcc0044',borderRadius:'2px',color:'#ffcc00'}},
        '↑ IMPORT',h('input',{type:'file',accept:'.json',style:{display:'none'},onChange:function(ev){
          var file=ev.target.files[0];if(!file)return;
          var reader=new FileReader();reader.onload=function(e){
            var p=profileStore.importProfile(e.target.result);
            if(p)setInfo('✓ Imported: '+p.name);else setErr('Invalid profile JSON');
          };reader.readAsText(file);
        }}))));
    /* Profile list */
    if(profileStore.profiles.length>0){
      ch.push(h('div',{className:'sec',key:'prof-list'},
        h('div',{className:'sec-label'},'SAVED PROFILES ('+profileStore.profiles.length+')'),
        profileStore.profiles.slice().reverse().map(function(p){
          var isA=compareA&&compareA.id===p.id;var isB=compareB&&compareB.id===p.id;
          return h('div',{className:'profile-card'+(isA||isB?' selected':''),key:p.id},
            h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
              h('div',null,
                h('div',{style:{fontSize:'12px',color:'#c0d0e0',fontWeight:500}},p.name),
                h('div',{style:{fontSize:'9px',color:'#445566',marginTop:'2px'}},p.sampleCount+' samples · '+(p.duration||0).toFixed(0)+'s · '+p.deviceName)),
              h('div',{style:{display:'flex',gap:'4px'}},
                h('button',{className:'btn btn-sm',onClick:function(){setCompareA(p);},style:{background:isA?'#00ffaa22':'transparent',border:'1px solid '+(isA?'#00ffaa66':'#1a2530'),color:isA?'#00ffaa':'#556677',padding:'3px 6px',fontSize:'8px'}},'A'),
                h('button',{className:'btn btn-sm',onClick:function(){setCompareB(p);},style:{background:isB?'#ffcc0022':'transparent',border:'1px solid '+(isB?'#ffcc0066':'#1a2530'),color:isB?'#ffcc00':'#556677',padding:'3px 6px',fontSize:'8px'}},'B'),
                h('button',{className:'btn btn-sm',onClick:function(){profileStore.exportProfile(p);},style:{background:'transparent',border:'1px solid #88aacc33',color:'#88aacc',padding:'3px 6px',fontSize:'8px'}},'⬇'),
                h('button',{className:'btn btn-sm',onClick:function(){profileStore.deleteProfile(p.id);},style:{background:'transparent',border:'1px solid #ff333322',color:'#ff3333',padding:'3px 6px',fontSize:'8px'}},'✕'))));
        })));
    }
    /* Comparison view */
    if(compareA&&compareB){
      ch.push(h('div',{className:'sec',key:'prof-compare'},
        h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#cc66ff'}}),'PROFILE COMPARISON'),
        h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'10px',fontSize:'10px'}},
          h('span',{style:{color:'#00ffaa'}},'A: '+compareA.name),
          h('span',{style:{color:'#556677'}},'vs'),
          h('span',{style:{color:'#ffcc00'}},'B: '+compareB.name)),
        DIM_KEYS.map(function(k){
          var aVal=compareA.stats&&compareA.stats.dimStats&&compareA.stats.dimStats[k]?compareA.stats.dimStats[k].mean:0;
          var bVal=compareB.stats&&compareB.stats.dimStats&&compareB.stats.dimStats[k]?compareB.stats.dimStats[k].mean:0;
          var diff=bVal-aVal;var diffColor=Math.abs(diff)<.05?'#556677':diff>0?'#00ffaa':'#ff4444';
          return h('div',{className:'diff-bar',key:k},
            h('div',{className:'diff-bar-label',style:{color:DIM_COLORS[k]}},DIM_LABELS[k]),
            h('div',{className:'diff-bar-visual'},
              h('div',{className:'diff-bar-fill',style:{width:(aVal*100)+'%',background:'#00ffaa44'}})),
            h('div',{className:'diff-bar-visual'},
              h('div',{className:'diff-bar-fill',style:{width:(bVal*100)+'%',background:'#ffcc0044'}})),
            h('div',{className:'diff-bar-val',style:{color:diffColor}},(diff>0?'+':'')+diff.toFixed(3)));
        }),
        h('div',{style:{marginTop:'8px',padding:'8px',background:'rgba(0,0,0,.15)',border:'1px solid #1a2530',borderRadius:'2px'}},
          h('div',{style:{fontSize:'9px',color:'#556677',letterSpacing:'1px',marginBottom:'4px'}},'COMPOSITE DIFF'),
          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
            h('span',{style:{fontSize:'14px',color:'#00ffaa',fontWeight:600}},compareA.stats?compareA.stats.mean.toFixed(4):'?'),
            h('span',{style:{fontSize:'11px',color:'#556677'}},'→'),
            h('span',{style:{fontSize:'14px',color:'#ffcc00',fontWeight:600}},compareB.stats?compareB.stats.mean.toFixed(4):'?'),
            h('span',{style:{fontSize:'12px',color:compareB.stats&&compareA.stats?(compareB.stats.mean>compareA.stats.mean?'#00ffaa':'#ff4444'):'#556677'}},compareA.stats&&compareB.stats?'Δ'+(compareB.stats.mean-compareA.stats.mean>0?'+':'')+(compareB.stats.mean-compareA.stats.mean).toFixed(4):'')))));
    }
    if(!profileStore.profiles.length)ch.push(h('div',{className:'empty',key:'prof-emp'},h('div',{className:'empty-i'},'◉'),h('div',{className:'empty-t'},'NO PROFILES'),h('div',{className:'empty-d'},'計測データを蓄積してから「SAVE CURRENT PROFILE」で保存。プロファイル間の比較も可能。')));
  }

  /* FOOTER */
  ch.push(h('div',{className:'leg',key:'leg'},[{l:'NEAR',c:'#00ffaa'},{l:'ROOM',c:'#00ddff'},{l:'HALL',c:'#ffcc00'},{l:'OPEN',c:'#ff8800'}].map(function(x){return h('span',{className:'leg-i',key:x.l},h('span',{className:'leg-d',style:{background:x.c}}),x.l);}),
    h('span',{style:{borderLeft:'1px solid #1a2530',paddingLeft:'8px'},key:'src'},
      h('span',{style:{color:'#00ffaa'}},'● REAL '),h('span',{style:{color:'#ff8800'}},'▲ EST '),
      h('span',{style:{color:'#ffcc00'}},'◆ SIM '),h('span',{style:{color:'#334455'}},'○ N/A'))));
  ch.push(h('div',{className:'ftr',key:'ft'},'pTCP v1.2 VISUALIZATION | Heatmap + Time Series + Profiles + Interactive Radar + Phase-Law Timeline + Stats Dashboard'));
  return h('div',null,ch);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
