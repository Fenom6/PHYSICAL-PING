<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(170deg,#0a0f14 0%,#0d1520 40%,#0a1218 100%);color:#8899aa;font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f14}::-webkit-scrollbar-thumb{background:#1a2a3a;border-radius:2px}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,170,.005) 2px,rgba(0,255,170,.005) 4px);pointer-events:none;z-index:100}
.ctn{max-width:900px;margin:0 auto;padding:20px 16px}
.hdr{margin-bottom:18px;border-bottom:1px solid #1a2530;padding-bottom:14px}
.hdr-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hdr h1{font-size:18px;font-weight:600;color:#00ffaa;letter-spacing:3px;text-shadow:0 0 20px rgba(0,255,170,.3)}
.hdr .ver{font-size:10px;color:#334455;letter-spacing:1px}
.hdr .sub{font-size:10px;color:#00ffaa44;letter-spacing:1.5px;margin-top:2px}
.hdr p{font-size:11px;color:#445566;line-height:1.6;margin-top:6px}
.sec{margin-bottom:14px;padding:12px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2)}
.sec-label{font-size:10px;color:#445566;letter-spacing:2px;margin-bottom:8px}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;min-width:44px}
.lv-bg{flex:1;height:8px;background:#0a0f14;border-radius:1px;overflow:hidden}
.lv-bar{height:100%;border-radius:1px;transition:width .06s linear;min-width:1px}
.lv-val{font-size:11px;min-width:68px;text-align:right;font-variant-numeric:tabular-nums}
.lv-stat{font-size:10px;letter-spacing:1px;margin-top:6px}
.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;padding:10px 20px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .15s;-webkit-tap-highlight-color:transparent}

.nfo{padding:10px 14px;background:rgba(0,255,170,.04);border:1px solid #00ffaa22;border-radius:2px;font-size:11px;color:#00ffaa88;margin-bottom:12px;line-height:1.6}
.dbg{padding:10px 14px;background:rgba(255,204,0,.03);border:1px solid #ffcc0022;border-radius:2px;font-size:10px;color:#ffcc0088;margin-bottom:12px;line-height:1.7;font-variant-numeric:tabular-nums;white-space:pre-wrap;word-break:break-all}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:1px;background:#1a2530;border:1px solid #1a2530;border-radius:2px;margin-bottom:14px;overflow:hidden}
.st{background:#0d1520;text-align:center;padding:7px 4px}

.st-u{font-size:10px;color:#556677;margin-left:2px}
.cv-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.2)}
.cv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;padding:8px 10px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.cv-lbl span:last-child{color:#334455}

.log-b{max-height:300px;overflow:auto}
.log-r{font-size:11px;border-bottom:1px solid rgba(26,37,48,.5);color:#8899aa;animation:fadeIn .25s ease}
.log-r:nth-child(even){background:rgba(255,255,255,.008)}
.log-r.to{color:#555}
.empty{text-align:center;padding:44px 20px;color:#334455}
.empty-i{font-size:32px;margin-bottom:10px;opacity:.3}
.empty-t{font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty-d{font-size:10px;color:#223344;max-width:380px;margin:0 auto;line-height:1.8}
.leg{margin-top:14px;padding-top:10px;border-top:1px solid #1a2530;display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#445566;letter-spacing:1px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-d{width:6px;height:6px;border-radius:1px}
.ftr{margin-top:8px;font-size:9px;color:#223344;line-height:1.8}
@media(max-width:600px){
  .log-h,.log-r{grid-template-columns:50px 40px 52px 50px 50px 1fr;font-size:10px;padding:4px 6px}
  .st-v{font-size:16px}.hdr h1{font-size:16px;letter-spacing:2px}
}
</style>
</head>
<body>
<div class="scan"></div>
<div class="ctn" id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var h=React.createElement,useState=React.useState,useRef=React.useRef,useCallback=React.useCallback,useEffect=React.useEffect;

/* ═══ CONFIG ═══ */
var CFG={
  sr:44100,
  f1:1500, f2:3500,      // wider chirp sweep
  chirpDur:0.025,         // 25ms chirp
  listenMs:400,           // total record time
  bufSize:256,
  directWindow:15,        // first 15ms = expect direct sound
  gapAfterDirect:3,       // skip 3ms after direct peak before looking for echoes
  echoThreshRatio:0.15,   // echo peak must be >= 15% of direct peak energy
  histMax:64,
};

/* ═══ CHIRP ═══ */
function makeChirp(sr,f1,f2,dur){
  var N=Math.floor(sr*dur),b=new Float32Array(N);
  for(var i=0;i<N;i++){var t=i/sr;
    b[i]=Math.sin(2*Math.PI*(f1*t+(f2-f1)*t*t/(2*dur)))*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}
  return b;
}

/* ═══ ENVELOPE (RMS per window) ═══ */
function computeEnvelope(signal,sr,windowMs){
  var winSmp=Math.floor(sr*windowMs/1000);
  if(winSmp<1)winSmp=1;
  var n=Math.floor(signal.length/winSmp);
  var env=new Float32Array(n);
  for(var i=0;i<n;i++){
    var sum=0,off=i*winSmp;
    for(var j=0;j<winSmp;j++){var v=signal[off+j];sum+=v*v;}
    env[i]=Math.sqrt(sum/winSmp);
  }
  return{env:env,winSmp:winSmp};
}

/* ═══ PEAK DETECTION ═══
   Strategy: 
   1. Compute energy envelope (1ms windows)
   2. Find strongest peak in first directWindow ms = DIRECT sound
   3. After direct peak + gap, find next strongest peak = ECHO
   4. RTT = echo_time - direct_time
*/
function detectPeaks(signal,sr){
  var res=computeEnvelope(signal,sr,1); // 1ms resolution
  var env=res.env, winSmp=res.winSmp;
  var directEnd=Math.min(CFG.directWindow, env.length);

  // Find direct peak
  var dPeak=0, dIdx=-1;
  for(var i=0;i<directEnd;i++){
    if(env[i]>dPeak){dPeak=env[i];dIdx=i;}
  }

  if(dPeak<0.001){
    // No direct sound detected at all - speaker not working or volume too low
    return{direct:null,echo:null,env:env,debug:'NO DIRECT SOUND DETECTED (peak='+dPeak.toFixed(6)+')'};
  }

  // Search for echo after direct peak + gap
  var searchStart=dIdx+CFG.gapAfterDirect;
  if(searchStart>=env.length){
    return{direct:{idx:dIdx,val:dPeak},echo:null,env:env,
      debug:'DIRECT@'+dIdx+'ms peak='+dPeak.toFixed(4)+' | search window too short'};
  }

  var echoThresh=dPeak*CFG.echoThreshRatio;
  var ePeak=0, eIdx=-1;

  // Find strongest peak after the gap
  for(var i=searchStart;i<env.length;i++){
    if(env[i]>ePeak){ePeak=env[i];eIdx=i;}
  }

  var echoFound=ePeak>=echoThresh && eIdx>0;

  var dbg='DIRECT@'+dIdx+'ms peak='+dPeak.toFixed(4);
  dbg+=' | ECHO_SEARCH from '+(searchStart)+'ms thresh='+echoThresh.toFixed(4);
  dbg+=' | ECHO '+(echoFound?'@'+eIdx+'ms peak='+ePeak.toFixed(4):'NOT FOUND (best='+ePeak.toFixed(4)+' @'+eIdx+'ms)');

  return{
    direct:{idx:dIdx,val:dPeak},
    echo:echoFound?{idx:eIdx,val:ePeak}:null,
    rtt:echoFound?(eIdx-dIdx):null,
    env:env,
    debug:dbg,
  };
}

/* ═══ UTILS ═══ */
function genId(){return Math.floor(Math.random()*0xFFFF).toString(16).padStart(4,'0').toUpperCase();}
function fMs(v){return v==null?'---':v<1?'<1ms':Math.round(v)+'ms';}
function fTime(d){return d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function clsfy(ms){if(ms==null)return{l:'TIMEOUT',c:'#ff3333'};if(ms<5)return{l:'NEAR',c:'#00ffaa'};if(ms<20)return{l:'ROOM',c:'#00ddff'};if(ms<50)return{l:'HALL',c:'#ffcc00'};if(ms<150)return{l:'OPEN',c:'#ff8800'};return{l:'DISTANT',c:'#ff4444'};}
function eDist(ms){return ms==null?null:((ms/1000)*343)/2;}
function flatBufs(b){var t=0;for(var i=0;i<b.length;i++)t+=b[i].length;var f=new Float32Array(t);var o=0;for(var i=0;i<b.length;i++){f.set(b[i],o);o+=b[i].length;}return f;}

/* ═══ ENVELOPE CANVAS ═══ */
function EnvCanvas(props){
  var env=props.env, direct=props.direct, echo=props.echo;
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current;if(!cv||!env||!env.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr, H=100*dpr;
    cv.width=W;cv.height=H;cv.style.height='100px';
    ctx.clearRect(0,0,W,H);

    var maxE=0;for(var i=0;i<env.length;i++)if(env[i]>maxE)maxE=env[i];
    maxE=Math.max(maxE,0.001)*1.1;
    var xS=W/env.length, yS=H/maxE;

    // Direct window background
    var dwX=Math.min(CFG.directWindow,env.length)*xS;
    ctx.fillStyle='rgba(0,255,170,0.03)';
    ctx.fillRect(0,0,dwX,H);

    // Envelope bars
    for(var i=0;i<env.length;i++){
      var x=i*xS, bH=env[i]*yS;
      var inDirect=i<CFG.directWindow;
      ctx.fillStyle=inDirect?'#00ffaa33':'#00ddff22';
      ctx.fillRect(x,H-bH,Math.max(1,xS-0.5),bH);
    }

    // Echo threshold line (if direct found)
    if(direct){
      var thH=direct.val*CFG.echoThreshRatio*yS;
      ctx.strokeStyle='#ff880055';ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(0,H-thH);ctx.lineTo(W,H-thH);ctx.stroke();
      ctx.setLineDash([]);

      // Direct marker
      var dx=direct.idx*xS;
      ctx.strokeStyle='#00ffaacc';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(dx,0);ctx.lineTo(dx,H);ctx.stroke();
      ctx.fillStyle='#00ffaa';ctx.font=(10*dpr)+'px IBM Plex Mono,monospace';
      ctx.fillText('D:'+direct.idx+'ms',dx+4*dpr,14*dpr);
    }

    // Echo marker
    if(echo){
      var ex=echo.idx*xS;
      ctx.strokeStyle='#ffcc00cc';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(ex,0);ctx.lineTo(ex,H);ctx.stroke();
      ctx.fillStyle='#ffcc00';ctx.font=(10*dpr)+'px IBM Plex Mono,monospace';
      ctx.fillText('E:'+echo.idx+'ms',ex+4*dpr,28*dpr);

      // RTT arrow
      if(direct){
        var y0=H*0.15;
        ctx.strokeStyle='#ffffff44';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(direct.idx*xS,y0);ctx.lineTo(ex,y0);ctx.stroke();
        ctx.fillStyle='#ffffff66';ctx.font=(11*dpr)+'px IBM Plex Mono,monospace';
        var rtt=echo.idx-direct.idx;
        ctx.fillText('RTT='+rtt+'ms',((direct.idx+echo.idx)/2)*xS-20*dpr,y0-4*dpr);
      }
    }

    // Time axis
    ctx.fillStyle='#33445544';ctx.font=(9*dpr)+'px IBM Plex Mono,monospace';
    for(var t=0;t<env.length;t+=50){ctx.fillText(t+'ms',t*xS,H-3*dpr);}
  },[env,direct,echo]);
  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'100px'}});
}

/* ═══ RAW WAVEFORM CANVAS ═══ */
function WaveCanvas(props){
  var samples=props.samples;var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current;if(!cv||!samples||!samples.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr,H=46*dpr;cv.width=W;cv.height=H;cv.style.height='46px';
    ctx.clearRect(0,0,W,H);
    var step=Math.max(1,Math.floor(samples.length/(W/dpr)));
    var mV=0;for(var i=0;i<samples.length;i+=step){var a=Math.abs(samples[i]);if(a>mV)mV=a;}
    mV=Math.max(mV,.01)*1.1;var yM=H/2,yS=(H/2)/mV;
    ctx.strokeStyle='#00ffaa22';ctx.lineWidth=1;ctx.beginPath();
    for(var i=0;i<samples.length;i+=step){var x=(i/samples.length)*W,y=yM-samples[i]*yS;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    ctx.stroke();
  },[samples]);
  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'46px'}});
}

/* ═══════════ APP ═══════════ */
function App(){
  var _s=useState('idle'),status=_s[0],setStatus=_s[1];
  var _h=useState([]),history=_h[0],setHistory=_h[1];
  var _c=useState(false),cont=_c[0],setCont=_c[1];
  var _i=useState(2000),intv=_i[0],setIntv=_i[1];
  var _n=useState(0),count=_n[0],setCount=_n[1];
  var _e=useState(null),err=_e[0],setErr=_e[1];
  var _inf=useState(null),info=_inf[0],setInfo=_inf[1];
  var _ll=useState(0),liveLevel=_ll[0],setLiveLevel=_ll[1];
  var _lp=useState(null),lastPeaks=_lp[0],setLastPeaks=_lp[1];
  var _lw=useState(null),lastWave=_lw[0],setLastWave=_lw[1];
  var _db=useState(null),debug=_db[0],setDebug=_db[1];

  var acRef=useRef(null),contRef=useRef(false),timerRef=useRef(null),cntRef=useRef(0),chirpRef=useRef(null);
  var rec=useRef({recording:false,rawBuf:[]});
  useEffect(function(){contRef.current=cont;},[cont]);
  useEffect(function(){chirpRef.current=makeChirp(CFG.sr,CFG.f1,CFG.f2,CFG.chirpDur);},[]);

  var initAudio=useCallback(function(){
    return new Promise(function(resolve){
      if(acRef.current&&acRef.current.state!=='closed'){
        if(acRef.current.state==='suspended')acRef.current.resume().then(function(){resolve(true);});
        else resolve(true);return;}
      var ctx;
      try{ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:CFG.sr});}
      catch(ex){setErr('AudioContext: '+ex.message);resolve(false);return;}
      (ctx.state==='suspended'?ctx.resume():Promise.resolve()).then(function(){
        return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      }).then(function(stream){
        acRef.current=ctx;
        var src=ctx.createMediaStreamSource(stream);
        // NO bandpass filter - capture full bandwidth for envelope detection
        var proc=ctx.createScriptProcessor(CFG.bufSize,1,1);
        proc.onaudioprocess=function(ev){
          var inp=ev.inputBuffer.getChannelData(0);
          var sum=0;for(var i=0;i<inp.length;i++)sum+=inp[i]*inp[i];
          setLiveLevel(Math.sqrt(sum/inp.length));
          if(rec.current.recording){var cp=new Float32Array(inp.length);cp.set(inp);rec.current.rawBuf.push(cp);}
        };
        src.connect(proc);proc.connect(ctx.destination);
        setErr(null);resolve(true);
      }).catch(function(ex){setErr('\u30DE\u30A4\u30AF\u30A2\u30AF\u30BB\u30B9\u304C\u5FC5\u8981: '+(ex.message||ex));resolve(false);});
    });
  },[]);

  var playChirp=useCallback(function(){
    var ctx=acRef.current,ch=chirpRef.current;if(!ctx||!ch)return;
    var ab=ctx.createBuffer(1,ch.length,CFG.sr);ab.getChannelData(0).set(ch);
    var s=ctx.createBufferSource();s.buffer=ab;
    var g=ctx.createGain();g.gain.value=1.0;
    s.connect(g);g.connect(ctx.destination);s.start();
  },[]);

  var execPing=useCallback(function(){
    return initAudio().then(function(ok){
      if(!ok)return null;
      setStatus('pinging');
      rec.current.recording=true;rec.current.rawBuf=[];
      playChirp();
      return new Promise(function(r){setTimeout(r,CFG.listenMs);}).then(function(){
        rec.current.recording=false;
        var signal=flatBufs(rec.current.rawBuf);

        // Peak detection (envelope-based)
        var result=detectPeaks(signal,CFG.sr);
        var rtt=result.rtt;
        var id=genId();
        var entry={id:id,time:new Date(),rtt:rtt,seq:cntRef.current++,
          directPeak:result.direct?result.direct.val:0,
          echoPeak:result.echo?result.echo.val:0};
        setCount(cntRef.current);
        setHistory(function(p){return[entry].concat(p).slice(0,CFG.histMax);});
        setLastPeaks(result);
        setLastWave(signal);
        setDebug(result.debug);
        setStatus('idle');
        return entry;
      });
    });
  },[initAudio,playChirp]);

  var startCont=useCallback(function(){setCont(true);contRef.current=true;
    var run=function(){if(!contRef.current)return;execPing().then(function(){if(contRef.current)timerRef.current=setTimeout(run,intv);});};run();
  },[execPing,intv]);
  var stopCont=useCallback(function(){setCont(false);contRef.current=false;if(timerRef.current)clearTimeout(timerRef.current);},[]);
  var clear=useCallback(function(){setHistory([]);setCount(0);cntRef.current=0;setLastPeaks(null);setLastWave(null);setDebug(null);},[]);

  var ok=history.filter(function(x){return x.rtt!=null;});
  var avg=ok.length?ok.reduce(function(s,x){return s+x.rtt;},0)/ok.length:null;
  var mn=ok.length?Math.min.apply(null,ok.map(function(x){return x.rtt;})):null;
  var mx=ok.length?Math.max.apply(null,ok.map(function(x){return x.rtt;})):null;
  var loss=history.length?((history.length-ok.length)/history.length*100):0;
  var jit=ok.length>1?ok.slice(0,-1).reduce(function(s,x,i){return s+Math.abs(x.rtt-ok[i+1].rtt);},0)/(ok.length-1):null;

  var ch=[];

  ch.push(h('div',{className:'hdr',key:'hd'},
    h('div',{className:'hdr-row'},h('h1',null,'PHYSICAL PING'),h('span',{className:'ver'},'pTCP v0.4')),
    h('div',{className:'sub'},'ENVELOPE PEAK DETECTION \u00B7 DIRECT/ECHO DIFFERENTIAL'),
    h('p',null,'\u30C1\u30E3\u30FC\u30D7\u4FE1\u53F7\u3092\u767A\u5C04\u3057\u3001\u30A8\u30CD\u30EB\u30AE\u30FC\u5305\u7D61\u7DDA\u304B\u3089\u300C\u76F4\u9054\u97F3\u30D4\u30FC\u30AF\u300D\u3068\u300C\u53CD\u5C04\u97F3\u30D4\u30FC\u30AF\u300D\u3092\u691C\u51FA\u3002\u305D\u306E\u6642\u9593\u5DEE\u304CRTT\u3002\u30B9\u30D4\u30FC\u30AB\u30FC\u6B6A\u307F\u306B\u4F9D\u5B58\u3057\u306A\u3044\u76F8\u5BFE\u8A08\u6E2C\u65B9\u5F0F\u3002')));

  ch.push(h('div',{className:'sec',key:'lv'},
    h('div',{className:'lv-row'},h('span',{className:'lv-lbl'},'MIC'),
      h('div',{className:'lv-bg'},h('div',{className:'lv-bar',style:{width:Math.min(100,liveLevel*3000)+'%',background:liveLevel>0.001?'linear-gradient(90deg,#00ffaa44,#00ffaa88)':'#ff333322'}})),
      h('span',{className:'lv-val',style:{color:liveLevel>0.001?'#00ffaa':'#ff3333'}},(liveLevel*1000).toFixed(1)+' mRMS')),
    h('div',{className:'lv-stat',style:{color:liveLevel>0.001?'#00ffaa55':'#ff333366'}},
      liveLevel>0.001?'\u25CF MIC ACTIVE':'\u25CB NO SIGNAL \u2014 \u30DE\u30A4\u30AF\u6A29\u9650\u3092\u78BA\u8A8D')));

  var ctrls=[];
  if(!cont){
    ctrls.push(h('button',{className:'btn btn-ping',onClick:execPing,disabled:status!=='idle',key:'pb'},
      status==='pinging'?'\u25CF DETECTING...':'\u25B6 PING'));
    ctrls.push(h('button',{className:'btn btn-cont',onClick:startCont,disabled:status!=='idle',key:'cb'},'\u25C9 CONTINUOUS'));
  }else{ctrls.push(h('button',{className:'btn btn-stop',onClick:stopCont,key:'sb'},'\u25A0 STOP'));}
  ctrls.push(h('div',{className:'iv-ctrl',key:'iv'},h('span',null,'INT'),
    h('select',{value:intv,onChange:function(ev){setIntv(+ev.target.value);}},
      [1000,1500,2000,3000,5000].map(function(v){return h('option',{value:v,key:v},v+'ms');}))));
  if(history.length>0)ctrls.push(h('button',{className:'btn btn-sm btn-clear',onClick:clear,key:'cl'},'CLEAR'));
  ch.push(h('div',{className:'ctrl',key:'ctrl'},ctrls));

  if(err)ch.push(h('div',{className:'err',key:'err'},'\u26A0 '+err));
  if(info)ch.push(h('div',{className:'nfo',key:'nfo'},info));

  // Debug panel - always show for diagnostics
  if(debug)ch.push(h('div',{className:'dbg',key:'dbg'},'DIAG: '+debug));

  if(history.length>0){ch.push(h('div',{className:'sts',key:'st'},
    [{l:'SENT',v:count,u:'',c:'#c0d0e0'},
     {l:'AVG',v:avg!=null?Math.round(avg):'---',u:avg!=null?'ms':'',c:'#00ffaa'},
     {l:'MIN',v:mn!=null?Math.round(mn):'---',u:mn!=null?'ms':'',c:'#00ddff'},
     {l:'MAX',v:mx!=null?Math.round(mx):'---',u:mx!=null?'ms':'',c:'#ffcc00'},
     {l:'JITTER',v:jit!=null?jit.toFixed(1):'---',u:jit!=null?'ms':'',c:'#ff8800'},
     {l:'LOSS',v:loss.toFixed(0),u:'%',c:loss>30?'#ff3333':'#667788'},
    ].map(function(s,i){return h('div',{className:'st',key:i},h('div',{className:'st-l'},s.l),h('div',{className:'st-v',style:{color:s.c}},s.v,s.u?h('span',{className:'st-u'},s.u):null));})));}

  // Envelope visualization
  if(lastPeaks&&lastPeaks.env&&lastPeaks.env.length>0){
    ch.push(h('div',{className:'cv-wrap',key:'env'},
      h('div',{className:'cv-lbl'},
        h('span',null,'ENERGY ENVELOPE (1ms resolution)'),
        h('span',null,lastPeaks.env.length+'ms')),
      h(EnvCanvas,{env:lastPeaks.env,direct:lastPeaks.direct,echo:lastPeaks.echo})));}

  // Raw waveform
  if(lastWave&&lastWave.length>0){
    ch.push(h('div',{className:'cv-wrap',key:'rw'},
      h('div',{className:'cv-lbl'},h('span',null,'RAW WAVEFORM'),h('span',null,lastWave.length+' smp')),
      h(WaveCanvas,{samples:lastWave})));}

  // Timeline
  if(history.length>1){ch.push(h('div',{className:'sec',key:'tl'},
    h('div',{className:'sec-label'},'RTT TIMELINE'),
    h('div',{className:'tl-bars'},history.slice().reverse().slice(-48).map(function(x,i){
      var c=clsfy(x.rtt),bH=x.rtt!=null?Math.max(3,Math.min(40,(x.rtt/200)*40)):40;
      return h('div',{className:'tl-b',key:i,style:{height:bH+'px',
        background:x.rtt==null?'repeating-linear-gradient(45deg,#ff333333,#ff333333 2px,transparent 2px,transparent 4px)':c.c,
        opacity:x.rtt==null?0.5:0.6}});}))));}

  // Log
  if(history.length>0){ch.push(h('div',{className:'log',key:'log'},
    h('div',{className:'log-h'},h('span',null,'TIME'),h('span',null,'SEQ'),h('span',null,'RTT'),h('span',null,'CLASS'),h('span',null,'DIST'),h('span',null,'D/E RATIO')),
    h('div',{className:'log-b'},history.map(function(x){var c=clsfy(x.rtt),d=eDist(x.rtt);
      var ratio=x.directPeak>0&&x.echoPeak>0?(x.echoPeak/x.directPeak*100).toFixed(0)+'%':'---';
      return h('div',{className:'log-r'+(x.rtt==null?' to':''),key:x.seq+'-'+x.id},
        h('span',{style:{color:'#556677'}},fTime(x.time)),h('span',{style:{color:'#445566'}},'0x'+x.id),
        h('span',{style:{color:c.c,fontWeight:600}},fMs(x.rtt)),
        h('span',{style:{color:c.c,fontSize:'9px',letterSpacing:'1px'}},c.l),
        h('span',null,d!=null?d.toFixed(2)+'m':'---'),
        h('span',{style:{fontSize:'10px',color:'#667788'}},ratio));}))));}

  if(history.length===0&&!err){ch.push(h('div',{className:'empty',key:'emp'},
    h('div',{className:'empty-i'},'\u25CE'),h('div',{className:'empty-t'},'PHYSICAL PING v0.4 READY'),
    h('div',{className:'empty-d'},'\u76F4\u9054\u97F3/\u53CD\u5C04\u97F3\u306E\u30A8\u30CD\u30EB\u30AE\u30FC\u5DEE\u5206\u691C\u51FA\u65B9\u5F0F\u3002',
      h('br'),'PING \u30DC\u30BF\u30F3\u3092\u62BC\u3059\u3060\u3051\u3067\u8A08\u6E2C\u958B\u59CB\u3002\u30AD\u30E3\u30EA\u30D6\u30EC\u30FC\u30B7\u30E7\u30F3\u4E0D\u8981\u3002')));}

  ch.push(h('div',{className:'leg',key:'leg'},
    [{l:'NEAR',c:'#00ffaa',r:'<5ms'},{l:'ROOM',c:'#00ddff',r:'5-20ms'},{l:'HALL',c:'#ffcc00',r:'20-50ms'},{l:'OPEN',c:'#ff8800',r:'50-150ms'},{l:'DISTANT',c:'#ff4444',r:'>150ms'}].map(function(x){
      return h('span',{className:'leg-i',key:x.l},h('span',{className:'leg-d',style:{background:x.c}}),x.l+' '+x.r);})));

  ch.push(h('div',{className:'ftr',key:'ft'},
    'CHIRP:'+CFG.f1+'\u2192'+CFG.f2+'Hz '+CFG.chirpDur*1000+'ms | DETECT: envelope(1ms RMS) \u2192 direct peak(0-'+CFG.directWindow+'ms) \u2192 echo search(+'+CFG.gapAfterDirect+'ms~) \u2192 thresh=direct\u00D7'+CFG.echoThreshRatio+' | pTCP v0.4'));

  return h('div',null,ch);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
