<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Physical Ping — pTCP v0.9 IPC</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(170deg,#0a0f14 0%,#0d1520 40%,#0a1218 100%);color:#8899aa;font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px}

@keyframes scanLine{0%{top:-2px}100%{top:100%}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(0,255,170,.1)}50%{box-shadow:0 0 20px rgba(0,255,170,.25)}}
@keyframes rfSweep{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes nfcRipple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.4);opacity:0}}
@keyframes pointRotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f14}::-webkit-scrollbar-thumb{background:#1a2a3a;border-radius:2px}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,170,.005) 2px,rgba(0,255,170,.005) 4px);pointer-events:none;z-index:100}
.ctn{max-width:960px;margin:0 auto;padding:20px 16px}
.hdr{margin-bottom:18px;border-bottom:1px solid #1a2530;padding-bottom:14px}
.hdr-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hdr h1{font-size:18px;font-weight:600;color:#00ffaa;letter-spacing:3px;text-shadow:0 0 20px rgba(0,255,170,.3)}
.hdr .ver{font-size:10px;color:#334455;letter-spacing:1px}
.hdr .sub{font-size:10px;color:#00ffaa44;letter-spacing:1.5px;margin-top:2px}
.hdr p{font-size:11px;color:#445566;line-height:1.6;margin-top:6px}
.sec{margin-bottom:14px;padding:12px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2)}

.layer-tab .tab-icon{font-size:14px;display:block;margin-bottom:3px}

.lv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;min-width:44px}
.lv-bg{flex:1;height:8px;background:#0a0f14;border-radius:1px;overflow:hidden}
.lv-bar{height:100%;border-radius:1px;transition:width .06s linear;min-width:1px}

.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

.btn:active{transform:scale(.97)}
.btn-ping{background:linear-gradient(180deg,#00ffaa22,#00ffaa11);border:1px solid #00ffaa44;color:#00ffaa}

.btn-stop{background:linear-gradient(180deg,#ff333322,#ff333311);border:1px solid #ff333344;color:#ff3333;animation:pulse 1s infinite}
.btn-sm{padding:6px 12px;font-size:10px;letter-spacing:1px}
.btn-clear{background:transparent;border:1px solid #1a2530;color:#445566;margin-left:auto}
.btn-calib{background:transparent;border:1px solid #ffcc0044;color:#ffcc00}

.sel-grp{display:flex;align-items:center;gap:6px}
.sel-grp span{font-size:10px;color:#445566;letter-spacing:1px}
.sel-grp select{background:#0d1520;border:1px solid #1a2530;color:#8899aa;padding:4px 8px;font-size:11px;font-family:inherit;border-radius:2px}
.sig-info{font-size:10px;color:#556677;padding:6px 10px;background:rgba(0,0,0,.15);border:1px solid #1a2530;border-radius:2px;flex:1;min-width:200px;line-height:1.6}
.err{padding:10px 14px;background:rgba(255,50,50,.08);border:1px solid #ff333344;border-radius:2px;font-size:11px;color:#ff6666;margin-bottom:12px}

.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:1px;background:#1a2530;border:1px solid #1a2530;border-radius:2px;margin-bottom:14px;overflow:hidden}
.st{background:#0d1520;text-align:center;padding:7px 4px}
.st-l{font-size:9px;letter-spacing:1.5px;color:#556677;margin-bottom:2px}
.st-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.st-u{font-size:10px;color:#556677;margin-left:2px}
.cv-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.2)}
.cv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;padding:8px 10px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.cv-lbl span:last-child{color:#334455}
.cv{display:block;width:100%}
.tl-bars{display:flex;align-items:flex-end;gap:2px;height:40px}
.tl-b{flex:1;border-radius:1px 1px 0 0;transition:height .3s ease;min-width:2px}
.log{border:1px solid #1a2530;border-radius:2px;overflow:hidden}
.log-h,.log-r{display:grid;grid-template-columns:56px 46px 60px 62px 56px 56px 1fr;padding:5px 8px;align-items:center}
.log-h{font-size:9px;letter-spacing:1.5px;color:#334455;border-bottom:1px solid #1a2530;background:rgba(0,0,0,.3)}
.log-b{max-height:300px;overflow:auto}
.log-r{font-size:11px;border-bottom:1px solid rgba(26,37,48,.5);color:#8899aa;animation:fadeIn .25s ease}
.log-r:nth-child(even){background:rgba(255,255,255,.008)}
.log-r.to{color:#555}
.empty{text-align:center;padding:44px 20px;color:#334455}
.empty-i{font-size:32px;margin-bottom:10px;opacity:.3}
.empty-t{font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty-d{font-size:10px;color:#223344;max-width:440px;margin:0 auto;line-height:1.8}
.leg{margin-top:14px;padding-top:10px;border-top:1px solid #1a2530;display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#445566;letter-spacing:1px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-d{width:6px;height:6px;border-radius:1px}
.ftr{margin-top:8px;font-size:9px;color:#223344;line-height:1.8}
.conf-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.conf-bg{flex:1;height:6px;background:#0a0f14;border-radius:1px;overflow:hidden}
.conf-bar{height:100%;border-radius:1px;transition:width .3s}
.conf-lbl{font-size:11px;min-width:50px;text-align:right;font-variant-numeric:tabular-nums}
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.em-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.em-card-h{font-size:9px;letter-spacing:2px;color:#556677;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.em-card-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.em-card-u{font-size:10px;color:#556677;margin-left:3px}
.em-card-sub{font-size:9px;color:#334455;margin-top:3px}
.em-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.em-bar-bg{flex:1;height:4px;background:#0a0f14;border-radius:1px;overflow:hidden}
.em-bar-fill{height:100%;border-radius:1px;transition:width .3s}
.med-coeff{padding:16px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.25);margin-bottom:14px;position:relative;overflow:hidden}
.med-coeff::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,255,170,.03) 0%,transparent 70%);pointer-events:none}
.med-ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.med-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.med-val{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.med-lbl{font-size:8px;letter-spacing:2px;color:#556677;margin-top:2px}
.med-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:6px;margin-top:10px}
.med-dim{text-align:center;padding:6px}
.med-dim-l{font-size:9px;letter-spacing:1px;color:#556677;margin-bottom:2px}
.med-dim-v{font-size:14px;font-weight:500}
.radar-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);padding:12px}
.radar-wrap canvas{display:block;margin:0 auto}
.sp-tag{display:inline-block;padding:3px 8px;font-size:9px;letter-spacing:1.5px;border-radius:1px;margin:2px}
.rf-spectrum-wrap{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);margin-bottom:14px}
.rf-spectrum-wrap canvas{display:block;width:100%}
.rf-waterfall-wrap{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:#000;margin-bottom:14px}
.rf-waterfall-wrap canvas{display:block;width:100%}
.rf-band-tag{display:inline-block;padding:2px 6px;font-size:8px;letter-spacing:1px;border-radius:1px;margin:1px;cursor:pointer;transition:all .15s}
.rf-band-tag:hover{opacity:.8}
.rf-band-tag.active{box-shadow:0 0 8px currentColor}
.nfc-pulse{width:80px;height:80px;border-radius:50%;margin:16px auto;position:relative;display:flex;align-items:center;justify-content:center}
.nfc-pulse::before,.nfc-pulse::after{content:'';position:absolute;border-radius:50%;border:1px solid currentColor;animation:nfcRipple 2s ease-out infinite}
.nfc-pulse::before{width:120%;height:120%;opacity:.4}
.nfc-pulse::after{width:160%;height:160%;opacity:.2;animation-delay:.5s}
.thermal-gradient{height:12px;border-radius:1px;background:linear-gradient(90deg,#0044ff,#00ccff,#00ff88,#ffcc00,#ff4400,#ff0000);position:relative}
.thermal-marker{position:absolute;top:-4px;width:2px;height:20px;background:#fff;transition:left .5s}
/* v0.9 Spatial */
.spatial-3d-wrap{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:#000;margin-bottom:14px;position:relative}
.spatial-3d-wrap canvas{display:block;width:100%}
.plane-card{padding:8px 10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;animation:fadeIn .25s ease}
.ble-dev{padding:8px 10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:4px;animation:fadeIn .25s ease}
.ble-rssi-bar{height:3px;border-radius:1px;transition:width .5s}
@media(max-width:600px){
  .log-h,.log-r{grid-template-columns:50px 40px 52px 54px 48px 50px 1fr;font-size:10px;padding:4px 6px}
  .st-v{font-size:16px}.hdr h1{font-size:16px;letter-spacing:2px}
  .em-grid{grid-template-columns:1fr}
  .layer-tab{padding:8px 4px;font-size:8px;letter-spacing:1px}
}
</style>

<script>

var SIGNALS={
  chirp_mid:{id:'chirp_mid',name:'CHIRP MID',desc:'1.5→2.5kHz / 20ms — 標準チャープ。室内用途に最適。',type:'chirp',f1:1500,f2:2500,dur:0.020,color:'#00ffaa'},

  chirp_high:{id:'chirp_high',name:'CHIRP HIGH',desc:'3→6kHz / 15ms — 高周波。指向性が強く小物体も検出。',type:'chirp',f1:3000,f2:6000,dur:0.015,color:'#00ddff'},
  chirp_wide:{id:'chirp_wide',name:'CHIRP WIDE',desc:'800→4kHz / 25ms — 広帯域。最大情報量。素材判別。',type:'chirp',f1:800,f2:4000,dur:0.025,color:'#ffcc00'},
  pulse_2k:{id:'pulse_2k',name:'PULSE 2kHz',desc:'2kHz単一 / 15ms — 基準計測用。',type:'tone',freq:2000,dur:0.015,color:'#cc66ff'},
  click:{id:'click',name:'CLICK BURST',desc:'符号化バースト / 10ms — 最高時間分解能。',type:'click',dur:0.010,color:'#ff4466'}
};
var SIG_ORDER=['chirp_mid','chirp_low','chirp_high','chirp_wide','pulse_2k','click'];
function genSignal(sig,sr){var N=Math.floor(sr*sig.dur),b=new Float32Array(N);if(sig.type==='chirp'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*(sig.f1*t+(sig.f2-sig.f1)*t*t/(2*sig.dur)))*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}else if(sig.type==='tone'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*sig.freq*t)*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}else if(sig.type==='click'){var fc=2500;for(var i=0;i<N;i++){var t=i/sr;var env=Math.exp(-Math.pow((i-N/2)/(N/5),2));b[i]=Math.sin(2*Math.PI*fc*t*(1+0.5*t/sig.dur))*env;}}return b;}

function calcTh(cn){return Math.max(CFG.minConf,Math.min(cn*2.5,CFG.maxThresh));}
function genId(){return Math.floor(Math.random()*0xFFFF).toString(16).padStart(4,'0').toUpperCase();}

function cls(ms){if(ms==null)return{l:'TIMEOUT',c:'#ff3333'};if(ms<5)return{l:'NEAR',c:'#00ffaa'};if(ms<20)return{l:'ROOM',c:'#00ddff'};if(ms<50)return{l:'HALL',c:'#ffcc00'};if(ms<150)return{l:'OPEN',c:'#ff8800'};return{l:'DISTANT',c:'#ff4444'};}

/* ═══════════════════════════════════════════════════════════ */
/*  SENSOR HOOKS (Mag, Light, Motion, Geo)                    */

    var totalArea=simPlanes.reduce(function(s,p){return s+p.area;},0);

    /* Generate simulated point cloud */
    var points=[];
    var numPoints=800+Math.floor(Math.random()*600);
    for(var i=0;i<numPoints;i++){
      var px=(Math.random()-0.5)*roomW;
      var py=Math.random()*roomH;
      var pz=-Math.random()*roomD;
      var depth=Math.sqrt(px*px+py*py+pz*pz);
      /* Cluster points near surfaces */
      if(Math.random()>0.3){
        var nearPlane=simPlanes[Math.floor(Math.random()*simPlanes.length)];
        var np=nearPlane.position;
        if(nearPlane.orientation==='horizontal-up'||nearPlane.orientation==='horizontal-down'){
          py=np.y+(Math.random()-0.5)*0.1;
          px=np.x+(Math.random()-0.5)*(nearPlane.w||1);
          pz=np.z+(Math.random()-0.5)*(nearPlane.d||1);
        }else{
          px=np.x+(Math.random()-0.5)*0.1;
          py=np.y+(Math.random()-0.5)*(nearPlane.d||1);
          pz=np.z+(Math.random()-0.5)*(nearPlane.w||1);
        }
        depth=Math.sqrt(px*px+py*py+pz*pz);
      }
      points.push({x:px,y:py,z:pz,d:depth});
    }

    setState(function(s){return Object.assign({},s,{
      planes:simPlanes,pointCloud:points,planeCount:simPlanes.length,
      totalArea:totalArea,meshVertices:numPoints,meshTriangles:Math.floor(numPoints*0.8),
      frameRate:30
    });});

    /* Simulate ongoing updates */
    simTimerRef.current=setInterval(function(){
      /* Slightly perturb point cloud */
      setState(function(s){
        var newPoints=s.pointCloud.map(function(p){
          return{x:p.x+(Math.random()-0.5)*0.02,y:p.y+(Math.random()-0.5)*0.01,
            z:p.z+(Math.random()-0.5)*0.02,d:p.d};
        });
        /* Occasionally add a new surface */
        var newPlanes=s.planes.slice();
        if(Math.random()>0.9&&newPlanes.length<15){
          var nw=0.3+Math.random()*0.5;
          var nd=0.3+Math.random()*0.5;
          newPlanes.push({
            id:'detected_'+Date.now(),orientation:Math.random()>0.5?'horizontal-up':'vertical',
            label:'NEW_SURFACE',
            position:{x:(Math.random()-0.5)*3,y:Math.random()*2,z:-Math.random()*3},
            area:nw*nd,vertexCount:Math.floor(3+Math.random()*5),color:'#ff880088',w:nw,d:nd
          });
        }
        var totalArea=newPlanes.reduce(function(ss,p){return ss+p.area;},0);
        var snap={time:new Date(),planeCount:newPlanes.length,pointCount:newPoints.length,totalArea:totalArea};
        return Object.assign({},s,{
          pointCloud:newPoints,planes:newPlanes,planeCount:newPlanes.length,
          totalArea:totalArea,
          history:[snap].concat(s.history).slice(0,32)
        });
      });
    },2000);
  },[]);

  /* ── Stop ── */
  var stop=useCallback(function(){
    if(sessionRef.current){try{sessionRef.current.end();}catch(e){}}
    sessionRef.current=null;
    if(simTimerRef.current){clearInterval(simTimerRef.current);simTimerRef.current=null;}
    if(fpsTimerRef.current){clearInterval(fpsTimerRef.current);fpsTimerRef.current=null;}
    setState(function(s){return Object.assign({},s,{active:false,source:'none',trackingState:'none'});});
  },[]);

  /* ── Place Anchor (simulation) ── */
  var placeAnchor=useCallback(function(){
    setState(function(s){
      var a={id:'anchor_'+genId(),time:new Date(),
        position:{x:(Math.random()-0.5)*3,y:Math.random()*0.5,z:-Math.random()*3}};
      return Object.assign({},s,{anchors:s.anchors.concat([a]).slice(-16)});
    });
  },[]);

  useEffect(function(){return function(){
    if(sessionRef.current)try{sessionRef.current.end();}catch(e){}
    if(simTimerRef.current)clearInterval(simTimerRef.current);
    if(fpsTimerRef.current)clearInterval(fpsTimerRef.current);
  };},[]);

  return{state:state,startXR:startXR,startSimulation:startSimulation,stop:stop,placeAnchor:placeAnchor};
}

/*  v0.9: BLE MESH — Web Bluetooth + Simulation               */
/* ═══════════════════════════════════════════════════════════ */

var BLE_SUPPORTED=typeof navigator!=='undefined'&&navigator.bluetooth!=null;

/* Common BLE service UUIDs for identification */
var BLE_SERVICES={
  'heart_rate':'Heart Rate','battery_service':'Battery','device_information':'Device Info',
  'environmental_sensing':'Environmental','generic_access':'Generic Access'
};

function useBLEMesh(){
  var _s=useState({
    available:BLE_SUPPORTED,
    scanning:false,
    source:BLE_SUPPORTED?'bluetooth':'simulation',
    error:null,
    devices:[],
    meshLinks:[],
    totalDevices:0,
    avgRSSI:-80,
    meshDensity:0
  });
  var state=_s[0],setState=_s[1];
  var simTimerRef=useRef(null);

  /* Scan for BLE devices */
  var startScan=useCallback(function(){
    if(BLE_SUPPORTED){
      /* Web Bluetooth API — requires user gesture and can only discover one device at a time.
         For mesh discovery, we'd need Web Bluetooth Scanning API (experimental).
         Fall back to sequential device requests + simulation augmentation. */
      setState(function(s){return Object.assign({},s,{scanning:true,error:null});});

      /* Try experimental Bluetooth.requestLEScan if available */
      if(navigator.bluetooth.requestLEScan){
        navigator.bluetooth.requestLEScan({acceptAllAdvertisements:true}).then(function(scan){
          navigator.bluetooth.addEventListener('advertisementreceived',function(ev){
            var dev={
              id:ev.device.id||genId(),
              name:ev.device.name||'Unknown',
              rssi:ev.rssi||-80,
              txPower:ev.txPower||null,
              time:new Date(),
              services:ev.uuids||[],
              source:'ble_scan'
            };
            setState(function(s){
              var existing=s.devices.findIndex(function(d){return d.id===dev.id;});
              var newDevs=s.devices.slice();
              if(existing>=0){newDevs[existing]=dev;}else{newDevs.push(dev);}
              newDevs=newDevs.slice(-20);
              return Object.assign({},s,{devices:newDevs,totalDevices:newDevs.length});
            });
          });
        }).catch(function(err){
          setState(function(s){return Object.assign({},s,{error:'BLE Scan: '+err.message});});
          startSimBLE();
        });
      }else{
        /* Fall back to simulation with occasional real device discovery */
        startSimBLE();
      }
    }else{
      startSimBLE();
    }
  },[]);

  var startSimBLE=useCallback(function(){
    setState(function(s){return Object.assign({},s,{scanning:true,source:'simulation'});});

    /* Generate initial simulated BLE devices */
    var simNames=['iPhone-Pro','Galaxy-S24','AirPods-L','Mi Band 8','Tile Mate','ESP32-Sensor',
      'BLE-Beacon-01','Smart Lock','Philips Hue','Arduino-BLE','RPi-Pico-W','BLE-Thermo',
      'SmartWatch','BLE-Tag-02','Desk Lamp','Air Purifier'];
    var initialDevs=[];
    var devCount=4+Math.floor(Math.random()*8);
    for(var i=0;i<devCount;i++){
      var nameIdx=Math.floor(Math.random()*simNames.length);
      initialDevs.push({
        id:'sim_'+i+'_'+genId(),name:simNames[nameIdx],
        rssi:-45-Math.floor(Math.random()*50),
        txPower:-12-Math.floor(Math.random()*20),
        time:new Date(),services:[],source:'simulation',
        distance:null/* will compute */
      });
    }
    /* Estimate distance from RSSI: d = 10^((txPower - rssi) / (10*n)) where n~2 */
    initialDevs.forEach(function(d){
      var txP=d.txPower||-20;
      d.distance=Math.pow(10,(txP-d.rssi)/(10*2));
    });

    /* Generate mesh links (simulated connections between nearby devices) */
    var links=[];
    for(var i=0;i<initialDevs.length;i++){
      for(var j=i+1;j<initialDevs.length;j++){
        if(Math.random()>0.6){
          links.push({from:initialDevs[i].id,to:initialDevs[j].id,strength:Math.random()});
        }
      }
    }

    var avgR=initialDevs.reduce(function(s,d){return s+d.rssi;},0)/initialDevs.length;
    setState(function(s){return Object.assign({},s,{
      devices:initialDevs,meshLinks:links,totalDevices:initialDevs.length,
      avgRSSI:Math.round(avgR),meshDensity:links.length/(initialDevs.length*(initialDevs.length-1)/2)
    });});

    /* Simulate ongoing discovery */
    simTimerRef.current=setInterval(function(){
      setState(function(s){
        var devs=s.devices.map(function(d){
          return Object.assign({},d,{
            rssi:d.rssi+Math.floor(Math.random()*6-3),
            time:new Date()
          });
        });
        /* Recompute distances */
        devs.forEach(function(d){
          var txP=d.txPower||-20;
          d.distance=Math.pow(10,(txP-d.rssi)/(10*2));
        });
        /* Occasionally discover new device */
        if(Math.random()>.88&&devs.length<16){
          devs.push({
            id:'sim_new_'+genId(),name:'BLE-'+genId(),
            rssi:-55-Math.floor(Math.random()*35),txPower:-15,
            time:new Date(),services:[],source:'simulation',
            distance:null
          });
          var last=devs[devs.length-1];
          last.distance=Math.pow(10,(-15-last.rssi)/20);
        }
        /* Occasionally lose a device */
        if(Math.random()>.92&&devs.length>3){
          devs.splice(Math.floor(Math.random()*devs.length),1);
        }
        var avgR=devs.length?devs.reduce(function(ss,d){return ss+d.rssi;},0)/devs.length:-80;
        var links=[];
        for(var i=0;i<devs.length;i++)for(var j=i+1;j<devs.length;j++)
          if(Math.abs(devs[i].rssi-devs[j].rssi)<20&&Math.random()>.4)
            links.push({from:devs[i].id,to:devs[j].id,strength:Math.random()});
        var maxLinks=devs.length*(devs.length-1)/2;
        return Object.assign({},s,{
          devices:devs,meshLinks:links,totalDevices:devs.length,
          avgRSSI:Math.round(avgR),meshDensity:maxLinks>0?links.length/maxLinks:0
        });
      });
    },3000);
  },[]);

  var stopScan=useCallback(function(){
    if(simTimerRef.current){clearInterval(simTimerRef.current);simTimerRef.current=null;}
    setState(function(s){return Object.assign({},s,{scanning:false});});
  },[]);

  useEffect(function(){return function(){if(simTimerRef.current)clearInterval(simTimerRef.current);};},[]);

  return{state:state,startScan:startScan,stopScan:stopScan};
}

/*  MEDIATION COEFFICIENT v0.9 — 9 dimensions                 */
/* ═══════════════════════════════════════════════════════════ */
function calcMediation(acoustic,mag,light,motion,rfData,nfcData,thermalData,spatialData,bleData){
  var dims={};
  if(acoustic&&acoustic.rtt!=null){dims.acoustic=Math.min(1,acoustic.cf||0);}else{dims.acoustic=0;}
  if(mag.available){dims.emField=mag.source==='magnetometer'?Math.min(1,mag.mag/100):Math.min(1,mag.mag/90);}else{dims.emField=0.5;}
  if(light.available&&light.lux!=null){dims.photonic=Math.min(1,light.lux/1000);}else{dims.photonic=0.5;}
  if(motion.available){dims.kinetic=Math.max(0,1-Math.abs(motion.mag-9.81)/5);}else{dims.kinetic=0.5;}
  if(rfData&&rfData.spectrum){dims.rfDensity=rfDensity(rfData.spectrum,-70);}else{dims.rfDensity=0;}
  if(nfcData){dims.nfcField=nfcData.state.fieldStrength||0;}else{dims.nfcField=0;}
  if(thermalData&&thermalData.data.available){var temp=thermalData.data.estimatedTemp||22;dims.thermal=Math.max(0,Math.min(1,1-(temp-20)/40));}else{dims.thermal=0.5;}
  /* v0.9: Spatial coverage */
  if(spatialData&&spatialData.state.active){
    var planeScore=Math.min(1,spatialData.state.planeCount/10);
    var areaScore=Math.min(1,spatialData.state.totalArea/50);
    var pointScore=Math.min(1,spatialData.state.pointCloud.length/500);
    dims.spatial=(planeScore*0.4+areaScore*0.3+pointScore*0.3);
  }else{dims.spatial=0;}
  /* v0.9: BLE Mesh density */
  if(bleData&&bleData.state.scanning){
    var devScore=Math.min(1,bleData.state.totalDevices/10);
    var meshScore=bleData.state.meshDensity;
    dims.bleMesh=(devScore*0.6+meshScore*0.4);
  }else{dims.bleMesh=0;}

  var weights={acoustic:0.20,emField:0.10,photonic:0.08,kinetic:0.10,rfDensity:0.12,nfcField:0.08,thermal:0.07,spatial:0.15,bleMesh:0.10};
  var total=0,wSum=0;for(var k in dims){if(weights[k]!=null){total+=dims[k]*weights[k];wSum+=weights[k];}}
  return{composite:wSum>0?total/wSum:0,dims:dims};
}

/*  SPACE PROFILE v0.9                                        */
/* ═══════════════════════════════════════════════════════════ */
function classifySpace(med,acousticHist){
  var tags=[],d=med.dims;
  if(acousticHist&&acousticHist.length>2){var avgR=0,cnt=0;for(var i=0;i<acousticHist.length;i++){if(acousticHist[i].rtt!=null){avgR+=acousticHist[i].rtt;cnt++;}}if(cnt>0){avgR/=cnt;if(avgR<5)tags.push({l:'ENCLOSED',c:'#00ffaa'});else if(avgR<20)tags.push({l:'INDOOR',c:'#00ddff'});else if(avgR<50)tags.push({l:'OPEN-INDOOR',c:'#ffcc00'});else tags.push({l:'OUTDOOR',c:'#ff8800'});}}
  if(d.emField>.7)tags.push({l:'HIGH-EM',c:'#ff4466'});else if(d.emField>.3)tags.push({l:'MOD-EM',c:'#cc66ff'});else tags.push({l:'LOW-EM',c:'#00ffaa'});
  if(d.photonic>.8)tags.push({l:'BRIGHT',c:'#ffcc00'});else if(d.photonic>.3)tags.push({l:'LIT',c:'#8899aa'});else tags.push({l:'DIM',c:'#556677'});
  if(d.kinetic>.8)tags.push({l:'STABLE',c:'#00ffaa'});else if(d.kinetic>.4)tags.push({l:'MOVING',c:'#ffcc00'});else tags.push({l:'UNSTABLE',c:'#ff3333'});
  if(d.rfDensity>.4)tags.push({l:'RF-DENSE',c:'#ff4466'});else if(d.rfDensity>.1)tags.push({l:'RF-PRESENT',c:'#ff8800'});else tags.push({l:'RF-QUIET',c:'#556677'});
  if(d.nfcField>.5)tags.push({l:'NFC-ACTIVE',c:'#cc66ff'});
  if(d.thermal>.7)tags.push({l:'COOL-ENV',c:'#00ddff'});else if(d.thermal<.3)tags.push({l:'WARM-ENV',c:'#ff8800'});
  /* v0.9 */
  if(d.spatial>.6)tags.push({l:'MAPPED',c:'#22ee88'});else if(d.spatial>.2)tags.push({l:'PARTIAL-MAP',c:'#88aa66'});
  if(d.bleMesh>.5)tags.push({l:'BLE-RICH',c:'#4488ff'});else if(d.bleMesh>.1)tags.push({l:'BLE-SPARSE',c:'#667788'});
  if(med.composite>.7)tags.push({l:'HIGH-CONNECT',c:'#00ffaa'});else if(med.composite>.4)tags.push({l:'MED-CONNECT',c:'#ffcc00'});else tags.push({l:'LOW-CONNECT',c:'#ff4444'});
  return tags;
}

/* ═══ v0.9: Point Cloud Canvas (3D isometric projection) ═══ */
function PointCloudCanvas(p){
  var points=p.points||[];var planes=p.planes||[];var anchors=p.anchors||[];
  var ref=useRef(null);var angleRef=useRef(0);var animRef=useRef(null);

  useEffect(function(){
    var cv=ref.current;if(!cv)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr,H=200*dpr;cv.width=W;cv.height=H;cv.style.height='200px';

    var draw=function(){
      ctx.clearRect(0,0,W,H);
      angleRef.current+=0.003;
      var angle=angleRef.current;
      var cos=Math.cos(angle),sin=Math.sin(angle);
      var scale=W/8;
      var cx=W/2,cy=H*0.65;

      /* Project 3D→2D with rotation */
      var proj=function(x,y,z){
        var rx=x*cos-z*sin;
        var rz=x*sin+z*cos;
        var sx=cx+rx*scale;
        var sy=cy-y*scale*0.8+rz*scale*0.3;
        return{x:sx,y:sy,depth:rz};
      };

      /* Draw planes as outlines */
      planes.forEach(function(pl){
        var pp=pl.position;var pw=(pl.w||1)/2;var pd=(pl.d||1)/2;
        var corners;
        if(pl.orientation==='horizontal-up'||pl.orientation==='horizontal-down'){
          corners=[[pp.x-pw,pp.y,pp.z-pd],[pp.x+pw,pp.y,pp.z-pd],[pp.x+pw,pp.y,pp.z+pd],[pp.x-pw,pp.y,pp.z+pd]];
        }else{
          corners=[[pp.x-pw,pp.y-pd,pp.z],[pp.x+pw,pp.y-pd,pp.z],[pp.x+pw,pp.y+pd,pp.z],[pp.x-pw,pp.y+pd,pp.z]];
        }
        var projected=corners.map(function(c){return proj(c[0],c[1],c[2]);});
        ctx.beginPath();
        projected.forEach(function(pt,i){i===0?ctx.moveTo(pt.x,pt.y):ctx.lineTo(pt.x,pt.y);});
        ctx.closePath();
        ctx.fillStyle=(pl.color||'#00ffaa')+'12';ctx.fill();
        ctx.strokeStyle=(pl.color||'#00ffaa')+'44';ctx.lineWidth=1;ctx.stroke();
      });

      /* Draw points */
      if(points.length>0){
        var sortedPts=points.map(function(pt){var pp=proj(pt.x,pt.y,pt.z);return{sx:pp.x,sy:pp.y,d:pt.d,depth:pp.depth};});
        sortedPts.sort(function(a,b){return a.depth-b.depth;});
        for(var i=0;i<sortedPts.length;i++){
          var pt=sortedPts[i];
          if(pt.sx<0||pt.sx>W||pt.sy<0||pt.sy>H)continue;
          var norm=Math.min(1,pt.d/5);
          var r=Math.floor(norm*255);var g=Math.floor((1-norm)*255);var b=Math.floor(128+norm*60);
          var alpha=0.3+norm*0.4;
          var size=Math.max(1,(1-norm)*3)*dpr;
          ctx.fillStyle='rgba('+r+','+g+','+b+','+alpha+')';
          ctx.fillRect(pt.sx-size/2,pt.sy-size/2,size,size);
        }
      }

      /* Draw anchors */
      anchors.forEach(function(a){
        var pp=proj(a.position.x,a.position.y,a.position.z);
        ctx.beginPath();ctx.arc(pp.x,pp.y,4*dpr,0,Math.PI*2);
        ctx.fillStyle='#ff4466';ctx.fill();
        ctx.strokeStyle='#ff446688';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(pp.x,pp.y,8*dpr,0,Math.PI*2);ctx.stroke();
      });

      /* Labels */
      ctx.fillStyle='#33445566';ctx.font=(9*dpr)+'px IBM Plex Mono';
      ctx.fillText('POINT CLOUD: '+points.length+' pts | PLANES: '+planes.length+' | ANCHORS: '+anchors.length,4*dpr,12*dpr);

      animRef.current=requestAnimationFrame(draw);
    };
    draw();
    return function(){if(animRef.current)cancelAnimationFrame(animRef.current);};

  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'200px'}});

/* ═══ v0.9: BLE Mesh Topology Canvas ═══ */
function BLEMeshCanvas(p){
  var devices=p.devices||[];var links=p.links||[];
  var ref=useRef(null);

  useEffect(function(){
    var cv=ref.current;if(!cv||!devices.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr,H=180*dpr;cv.width=W;cv.height=H;cv.style.height='180px';
    ctx.clearRect(0,0,W,H);
    var cx=W/2,cy=H/2,maxR=Math.min(W,H)/2-30*dpr;

    /* Position devices in a circle, sorted by RSSI (strongest center) */
    var sorted=devices.slice().sort(function(a,b){return b.rssi-a.rssi;});
    var positions={};
    sorted.forEach(function(d,i){
      var angle=(Math.PI*2/sorted.length)*i-Math.PI/2;
      var rssiNorm=Math.min(1,(-d.rssi-30)/60);/* 0=strong, 1=weak */
      var r=maxR*0.2+maxR*0.8*rssiNorm;
      positions[d.id]={x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r};
    });

    /* Draw links */
    links.forEach(function(link){
      var from=positions[link.from],to=positions[link.to];
      if(from&&to){
        ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);
        ctx.strokeStyle='rgba(68,136,255,'+(link.strength*0.3)+')';ctx.lineWidth=1;ctx.stroke();
      }
    });

    /* Draw devices */
    sorted.forEach(function(d){
      var pos=positions[d.id];if(!pos)return;
      var rssiNorm=Math.min(1,Math.max(0,(-d.rssi-30)/60));
      var nodeR=(4+6*(1-rssiNorm))*dpr;

      /* Glow */
      var grad=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,nodeR*3);
      grad.addColorStop(0,'rgba(68,136,255,0.15)');grad.addColorStop(1,'rgba(68,136,255,0)');
      ctx.fillStyle=grad;ctx.fillRect(pos.x-nodeR*3,pos.y-nodeR*3,nodeR*6,nodeR*6);

      /* Node */
      ctx.beginPath();ctx.arc(pos.x,pos.y,nodeR,0,Math.PI*2);
      var color=d.rssi>-50?'#00ffaa':d.rssi>-70?'#4488ff':d.rssi>-85?'#ffcc00':'#ff4444';
      ctx.fillStyle=color;ctx.fill();

      /* Label */
      ctx.fillStyle='#667788';ctx.font=(8*dpr)+'px IBM Plex Mono';ctx.textAlign='center';
      var name=d.name.length>10?d.name.substring(0,10)+'…':d.name;
      ctx.fillText(name,pos.x,pos.y+nodeR+10*dpr);
      ctx.fillStyle='#44556688';ctx.fillText(d.rssi+'dBm',pos.x,pos.y+nodeR+20*dpr);
    });

    /* Center label */
    ctx.fillStyle='#22334444';ctx.font=(9*dpr)+'px IBM Plex Mono';ctx.textAlign='center';
    ctx.fillText('YOU',cx,cy+4*dpr);
    ctx.beginPath();ctx.arc(cx,cy,6*dpr,0,Math.PI*2);ctx.strokeStyle='#33445544';ctx.lineWidth=1;ctx.stroke();
  },[devices,links]);

  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'180px'}});
}

      '▸ Spatial Anchors: Persistent reference points for tracking coordinate stability',h('br'),
      '▸ Compatible: Chrome 79+ (Android w/ ARCore), Safari (iOS w/ AR QuickLook partial)'));
  }

  /* ═══════════════════════════════════════════ */
  /*  v0.9: BLE MESH LAYER                      */
  /* ═══════════════════════════════════════════ */
  if(layer==='ble'){
    var bl=ble.state;

    ch.push(h('div',{className:'sec',key:'ble-hdr'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#4488ff'}}),'BLE MESH NETWORK'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'1.8',marginBottom:'8px'}},
        'Web Bluetooth API / BLE Scanning APIでBLEデバイスをスキャン。RSSI距離推定＋メッシュトポロジー可視化。',h('br'),
        'Web Bluetooth非対応環境ではシミュレーションモードで動作。')));

    ch.push(h('div',{key:'ble-platform',style:{padding:'6px 10px',marginBottom:'10px',fontSize:'9px',letterSpacing:'1px',color:'#445566',background:'rgba(0,0,0,.15)',border:'1px solid #1a2530',borderRadius:'2px'}},
      'Web Bluetooth: '+(BLE_SUPPORTED?'✔ Available':'✘ Not Available')+
      ' | Source: '+(bl.source||'none')+
      ' | Scanning: '+(bl.scanning?'✔':'✘')));

    ch.push(h('div',{className:'ctrl',key:'ble-ctrl'},
      !bl.scanning?
        h('button',{className:'btn',onClick:ble.startScan,
          style:{background:'linear-gradient(180deg,#4488ff22,#4488ff11)',border:'1px solid #4488ff44',color:'#4488ff'}},
          '▶ START BLE SCAN'):
        h('button',{className:'btn btn-stop',onClick:ble.stopScan},'■ STOP')
    ));

    if(bl.error)ch.push(h('div',{className:'err',key:'ble-err'},'⚠ '+bl.error));

    if(bl.scanning||bl.devices.length>0){
      /* Stats */
      ch.push(h('div',{className:'sts',key:'ble-sts'},
        [{l:'DEVICES',v:bl.totalDevices,c:'#4488ff'},
         {l:'AVG RSSI',v:bl.avgRSSI+'dBm',c:bl.avgRSSI>-60?'#00ffaa':bl.avgRSSI>-80?'#ffcc00':'#ff4444'},
         {l:'LINKS',v:bl.meshLinks.length,c:'#cc66ff'},
         {l:'DENSITY',v:(bl.meshDensity*100).toFixed(0)+'%',c:bl.meshDensity>.5?'#00ffaa':'#667788'}
        ].map(function(s,i){return h('div',{className:'st',key:i},h('div',{className:'st-l'},s.l),h('div',{className:'st-v',style:{color:s.c}},s.v));})));

      /* Mesh Topology */
      if(bl.devices.length>0){
        ch.push(h('div',{className:'spatial-3d-wrap',key:'ble-mesh'},
          h('div',{className:'cv-lbl',style:{background:'rgba(0,0,0,.5)'}},
            h('span',null,'MESH TOPOLOGY'),h('span',null,bl.totalDevices+' devices / '+bl.meshLinks.length+' links')),
          h(BLEMeshCanvas,{devices:bl.devices,links:bl.meshLinks})));
      }

      /* Device list */
      if(bl.devices.length>0){
        var sorted=bl.devices.slice().sort(function(a,b){return b.rssi-a.rssi;});
        ch.push(h('div',{className:'sec',key:'ble-devs'},
          h('div',{className:'sec-label'},'DISCOVERED DEVICES'),
          sorted.slice(0,12).map(function(d,i){
            var rssiColor=d.rssi>-50?'#00ffaa':d.rssi>-70?'#4488ff':d.rssi>-85?'#ffcc00':'#ff4444';
            var rssiPct=Math.max(0,Math.min(100,(d.rssi+100)/60*100));
            return h('div',{className:'ble-dev',key:d.id},
              h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'4px'}},
                h('span',{style:{fontSize:'11px',color:'#c0d0e0'}},d.name),
                h('span',{style:{fontSize:'11px',color:rssiColor,fontWeight:600}},d.rssi+' dBm')),
              h('div',{style:{background:'#0a0f14',borderRadius:'1px',marginBottom:'3px'}},
                h('div',{className:'ble-rssi-bar',style:{width:rssiPct+'%',background:rssiColor}})),
              h('div',{style:{display:'flex',gap:'10px',fontSize:'9px',color:'#445566'}},
                h('span',null,'dist: '+(d.distance!=null?d.distance.toFixed(1)+'m':'---')),
                h('span',null,'src: '+d.source),
                h('span',null,fT(d.time))));
          })));
      }
    }

    if(!bl.scanning&&bl.devices.length===0){
      ch.push(h('div',{className:'empty',key:'ble-emp'},
        h('div',{className:'empty-i'},'◌'),
        h('div',{className:'empty-t'},'BLE MESH NETWORK'),
        h('div',{className:'empty-d'},
          'BLEスキャンを開始してデバイスを検出。RSSI距離推定とメッシュトポロジーをリアルタイム可視化します。',h('br'),
          'Web Bluetooth Scanning API対応: Chrome (Android) / 他環境はシミュレーション。')));
    }

    ch.push(h('div',{className:'nfo',key:'ble-nfo'},
      '▸ Web Bluetooth: requestLEScan() for passive BLE advertisement monitoring',h('br'),
      '▸ RSSI Distance Model: d = 10^((txPower - RSSI) / (10×n)), n=2 (path loss exponent)',h('br'),
      '▸ Mesh Links: RSSI proximity-based virtual mesh topology (not actual BLE Mesh protocol)',h('br'),
      '▸ Compatible: Chrome 56+ (Android), limited on iOS/Desktop'));
  }

  /* ═══ MEDIATION (9D) ═══ */
  if(layer==='mediation'){
    var mc=mediation.composite,mcC=mc>.6?'#00ffaa':mc>.3?'#ffcc00':'#ff4444';
    ch.push(h('div',{className:'med-coeff',key:'med'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ffcc00'}}),'MEDIATION COEFFICIENT — μ(x,t) v0.9'),
      h('div',{style:{textAlign:'center',margin:'12px 0'}},h(MedRing,{value:mc,dims:mediation.dims}),
        h('div',{className:'med-center',style:{position:'relative',marginTop:'-80px',marginBottom:'40px'}},h('div',{className:'med-val',style:{color:mcC}},mc.toFixed(3)),h('div',{className:'med-lbl'},'COMPOSITE'))),
      h('div',{className:'med-dims'},
        [{k:'acoustic',l:'ACOUSTIC',c:'#00ffaa',d:'音響反射率'},
         {k:'emField',l:'EM FIELD',c:'#cc66ff',d:'電磁場密度'},
         {k:'photonic',l:'PHOTONIC',c:'#ffcc00',d:'光環境'},
         {k:'kinetic',l:'KINETIC',c:'#00ddff',d:'運動安定性'},
         {k:'rfDensity',l:'RF DENSITY',c:'#ff4466',d:'RF帯域占有率'},
         {k:'nfcField',l:'NFC FIELD',c:'#9966ff',d:'NFC近接場'},
         {k:'thermal',l:'THERMAL',c:'#ff8800',d:'熱環境安定性'},
         {k:'spatial',l:'SPATIAL',c:'#22ee88',d:'空間マッピング'},
         {k:'bleMesh',l:'BLE MESH',c:'#4488ff',d:'BLEメッシュ密度'}
        ].map(function(dd){var v=mediation.dims[dd.k]||0;return h('div',{className:'med-dim',key:dd.k},h('div',{className:'med-dim-l'},dd.l),h('div',{className:'med-dim-v',style:{color:dd.c}},v.toFixed(3)),h('div',{style:{fontSize:'8px',color:'#334455',marginTop:'2px'}},dd.d),h('div',{className:'em-bar-row',style:{marginTop:'4px'}},h('div',{className:'em-bar-bg'},h('div',{className:'em-bar-fill',style:{width:(v*100)+'%',background:dd.c+'88'}}))));}))
    ));
    ch.push(h('div',{className:'sec',key:'med-f'},h('div',{className:'sec-label'},'FORMULA v0.9'),
      h('div',{style:{fontSize:'11px',color:'#667788',lineHeight:'2',fontFamily:'monospace'}},
        'μ(x,t) = Σ wᵢ · dᵢ(x,t)',h('br'),
        'dᵢ ∈ {acoustic, emField, photonic, kinetic, rfDensity, nfcField, thermal, spatial, bleMesh}',h('br'),
        'w = [0.20, 0.10, 0.08, 0.10, 0.12, 0.08, 0.07, 0.15, 0.10]',h('br'),h('br'),
        h('span',{style:{color:'#445566'}},'v0.9では9次元に拡張。Spatial Mapping（空間形状）とBLE Mesh（近接デバイス密度）を追加。'))));
    ch.push(h('div',{className:'radar-wrap',key:'radar'},h('div',{className:'sec-label',style:{marginBottom:'8px'}},'9-DIMENSIONAL RADAR'),h(RadarCanvas,{dims:mediation.dims})));
  }

  /* ═══ PROFILE ═══ */
  if(layer==='profile'){
    ch.push(h('div',{className:'sec',key:'sp'},h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#00ddff'}}),'SPACE PROFILE v0.9'),h('div',{style:{margin:'10px 0'}},spaceTags.map(function(t,i){return h('span',{key:i,className:'sp-tag',style:{background:t.c+'15',border:'1px solid '+t.c+'44',color:t.c}},t.l);})),h('div',{style:{fontSize:'10px',color:'#445566',marginTop:'10px',lineHeight:'1.8'}},'全9センサーレイヤーの統合分類。各タブでセンサーを有効化するとプロファイルが詳細化。')));

    ch.push(h('div',{className:'sec',key:'ipc'},h('div',{className:'sec-label'},'IPC PROTOCOL STACK — pTCP v0.9'),
      h('div',{style:{fontSize:'10px',lineHeight:'2.2',color:'#556677'}},
        ['L6: SPACE PROFILE — 空間分類・行動推奨・環境適応',
         'L5: MEDIATION — μ(x,t) 9次元情報物理結合係数',
         'L4: SENSOR FUSION — 音響+EM+光+慣性+RF+NFC+熱+空間+BLE 統合',
         'L3: ACOUSTIC SONAR — チャープ・相互相関',
         'L3: EM FIELD — 磁力計・環境光・加速度',
         'L3: RF SPECTRUM — WebUSB SDR・周波数解析',
         'L3: NFC FIELD — 近接場検出・タグ読取',
         'L3: THERMAL — CPU負荷・バッテリー・推定温度',
         'L3: SPATIAL — WebXR 平面検出・深度・ポイントクラウド',
         'L3: BLE MESH — Web Bluetooth・RSSI距離推定・メッシュ',
         'L2: DEVICE HARDWARE — マイク・スピーカー・センサー・USB・NFC・AR',
         'L1: PHYSICAL MEDIUM — 音波・電磁波・光・慣性力・近接場・空間形状'
        ].map(function(line,i){
          var colors=['#00ddff','#ffcc00','#cc66ff','#00ffaa','#cc66ff','#ff4466','#9966ff','#ff8800','#22ee88','#4488ff','#556677','#334455'];
          return h('div',{key:i,style:{padding:'4px 10px',borderLeft:'3px solid '+colors[i],marginBottom:'2px',background:colors[i]+'08'}},h('span',{style:{color:colors[i]}},line));
        }))));

    ch.push(h('div',{className:'sec',key:'roadmap'},h('div',{className:'sec-label'},'DEVELOPMENT ROADMAP'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'2'}},
        h('span',{style:{color:'#556677'}},'v0.6'),' — Acoustic Sonar + Magnetometer + AmbientLight + Accelerometer',h('br'),
        h('span',{style:{color:'#556677'}},'v0.8'),' — RF Spectrum (WebUSB SDR) + NFC + Thermal + 7D Mediation',h('br'),
        h('span',{style:{color:'#22ee88'}},'v0.9 [CURRENT]'),' — WebXR Spatial Mapping + Point Cloud + BLE Mesh + 9D Mediation',h('br'),
        h('span',{style:{color:'#ff8800'}},'v1.0 [NEXT]'),' — Full Phase-Law Architecture: pTCP/IP for physical space protocol',h('br'),
        h('span',{style:{color:'#ff4466'}},'v1.0'),' — Multi-device sync, P2P spatial anchoring, Collaborative mapping')));
  }

  /* ── FOOTER ── */
  ch.push(h('div',{className:'leg',key:'leg'},[{l:'NEAR',c:'#00ffaa',r:'<5ms'},{l:'ROOM',c:'#00ddff',r:'5-20ms'},{l:'HALL',c:'#ffcc00',r:'20-50ms'},{l:'OPEN',c:'#ff8800',r:'50-150ms'},{l:'DISTANT',c:'#ff4444',r:'>150ms'}].map(function(x){return h('span',{className:'leg-i',key:x.l},h('span',{className:'leg-d',style:{background:x.c}}),x.l+' '+x.r);})));
  ch.push(h('div',{className:'ftr',key:'ft'},'pTCP v0.9 IPC | Spatial Mapping + BLE Mesh + 9D Mediation | Phase-Law Architecture'));

  return h('div',null,ch);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
