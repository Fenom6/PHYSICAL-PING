<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Physical Ping — pTCP v0.7 IPC</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(170deg,#0a0f14 0%,#0d1520 40%,#0a1218 100%);color:#8899aa;font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scanLine{0%{top:-2px}100%{top:100%}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(0,255,170,.1)}50%{box-shadow:0 0 20px rgba(0,255,170,.25)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f14}::-webkit-scrollbar-thumb{background:#1a2a3a;border-radius:2px}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,170,.005) 2px,rgba(0,255,170,.005) 4px);pointer-events:none;z-index:100}
.ctn{max-width:960px;margin:0 auto;padding:20px 16px}
.hdr{margin-bottom:18px;border-bottom:1px solid #1a2530;padding-bottom:14px}
.hdr-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hdr h1{font-size:18px;font-weight:600;color:#00ffaa;letter-spacing:3px;text-shadow:0 0 20px rgba(0,255,170,.3)}
.hdr .ver{font-size:10px;color:#334455;letter-spacing:1px}
.hdr .sub{font-size:10px;color:#00ffaa44;letter-spacing:1.5px;margin-top:2px}
.hdr p{font-size:11px;color:#445566;line-height:1.6;margin-top:6px}
.sec{margin-bottom:14px;padding:12px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2)}
.sec-label{font-size:10px;color:#445566;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-label .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.layer-tabs{display:flex;gap:2px;margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;flex-wrap:wrap}
.layer-tab{flex:1;padding:10px 8px;text-align:center;font-size:10px;letter-spacing:1.5px;cursor:pointer;border:none;background:rgba(0,0,0,.3);color:#556677;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;position:relative;min-width:60px}
.layer-tab:hover{background:rgba(255,255,255,.02)}
.layer-tab.active{background:rgba(0,0,0,.5);color:#c0d0e0}
.layer-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.layer-tab .tab-icon{font-size:14px;display:block;margin-bottom:3px}
.layer-tab .tab-badge{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;animation:blink 1.5s infinite}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;min-width:44px}
.lv-bg{flex:1;height:8px;background:#0a0f14;border-radius:1px;overflow:hidden}
.lv-bar{height:100%;border-radius:1px;transition:width .06s linear;min-width:1px}
.lv-val{font-size:11px;min-width:68px;text-align:right;font-variant-numeric:tabular-nums}
.lv-stat{font-size:10px;letter-spacing:1px;margin-top:6px}
.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;padding:10px 20px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-ping{background:linear-gradient(180deg,#00ffaa22,#00ffaa11);border:1px solid #00ffaa44;color:#00ffaa}
.btn-ping:disabled{background:#0a2a1a;cursor:wait;opacity:.6}
.btn-cont{background:transparent;border:1px solid #334455;color:#667788;padding:10px 16px;font-size:11px;letter-spacing:1px}
.btn-stop{background:linear-gradient(180deg,#ff333322,#ff333311);border:1px solid #ff333344;color:#ff3333;animation:pulse 1s infinite}
.btn-sm{padding:6px 12px;font-size:10px;letter-spacing:1px}
.btn-clear{background:transparent;border:1px solid #1a2530;color:#445566;margin-left:auto}
.btn-calib{background:transparent;border:1px solid #ffcc0044;color:#ffcc00}
.sel-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:stretch}
.sel-grp{display:flex;align-items:center;gap:6px}
.sel-grp span{font-size:10px;color:#445566;letter-spacing:1px}
.sel-grp select{background:#0d1520;border:1px solid #1a2530;color:#8899aa;padding:4px 8px;font-size:11px;font-family:inherit;border-radius:2px}
.sig-info{font-size:10px;color:#556677;padding:6px 10px;background:rgba(0,0,0,.15);border:1px solid #1a2530;border-radius:2px;flex:1;min-width:200px;line-height:1.6}
.sig-info b{color:#8899aa;font-weight:500}
.err{padding:10px 14px;background:rgba(255,50,50,.08);border:1px solid #ff333344;border-radius:2px;font-size:11px;color:#ff6666;margin-bottom:12px}
.nfo{padding:10px 14px;background:rgba(0,255,170,.04);border:1px solid #00ffaa22;border-radius:2px;font-size:11px;color:#00ffaa88;margin-bottom:12px;line-height:1.6}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:1px;background:#1a2530;border:1px solid #1a2530;border-radius:2px;margin-bottom:14px;overflow:hidden}
.st{background:#0d1520;text-align:center;padding:7px 4px}
.st-l{font-size:9px;letter-spacing:1.5px;color:#556677;margin-bottom:2px}
.st-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.st-u{font-size:10px;color:#556677;margin-left:2px}
.cv-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.2)}
.cv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;padding:8px 10px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.cv-lbl span:last-child{color:#334455}
.cv{display:block;width:100%}
.tl-bars{display:flex;align-items:flex-end;gap:2px;height:40px}
.tl-b{flex:1;border-radius:1px 1px 0 0;transition:height .3s ease;min-width:2px}
.log{border:1px solid #1a2530;border-radius:2px;overflow:hidden}
.log-h,.log-r{display:grid;grid-template-columns:56px 46px 60px 62px 56px 56px 1fr;padding:5px 8px;align-items:center}
.log-h{font-size:9px;letter-spacing:1.5px;color:#334455;border-bottom:1px solid #1a2530;background:rgba(0,0,0,.3)}
.log-b{max-height:300px;overflow:auto}
.log-r{font-size:11px;border-bottom:1px solid rgba(26,37,48,.5);color:#8899aa;animation:fadeIn .25s ease}
.log-r:nth-child(even){background:rgba(255,255,255,.008)}
.log-r.to{color:#555}
.empty{text-align:center;padding:44px 20px;color:#334455}
.empty-i{font-size:32px;margin-bottom:10px;opacity:.3}
.empty-t{font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty-d{font-size:10px;color:#223344;max-width:440px;margin:0 auto;line-height:1.8}
.leg{margin-top:14px;padding-top:10px;border-top:1px solid #1a2530;display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#445566;letter-spacing:1px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-d{width:6px;height:6px;border-radius:1px}
.ftr{margin-top:8px;font-size:9px;color:#223344;line-height:1.8}
.conf-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.conf-bg{flex:1;height:6px;background:#0a0f14;border-radius:1px;overflow:hidden}
.conf-bar{height:100%;border-radius:1px;transition:width .3s}
.conf-lbl{font-size:11px;min-width:50px;text-align:right;font-variant-numeric:tabular-nums}

/* ── IPC Layer: EM/Sensor ── */
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.em-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.em-card-h{font-size:9px;letter-spacing:2px;color:#556677;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.em-card-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.em-card-u{font-size:10px;color:#556677;margin-left:3px}
.em-card-sub{font-size:9px;color:#334455;margin-top:3px}
.em-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.em-bar-bg{flex:1;height:4px;background:#0a0f14;border-radius:1px;overflow:hidden}
.em-bar-fill{height:100%;border-radius:1px;transition:width .3s}

/* Mediation Coefficient */
.med-coeff{padding:16px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.25);margin-bottom:14px;position:relative;overflow:hidden}
.med-coeff::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,255,170,.03) 0%,transparent 70%);pointer-events:none}
.med-ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.med-ring canvas{display:block}
.med-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.med-val{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.med-lbl{font-size:8px;letter-spacing:2px;color:#556677;margin-top:2px}
.med-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:10px}
.med-dim{text-align:center;padding:6px}
.med-dim-l{font-size:9px;letter-spacing:1px;color:#556677;margin-bottom:2px}
.med-dim-v{font-size:14px;font-weight:500}

/* Radar canvas */
.radar-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);padding:12px}
.radar-wrap canvas{display:block;margin:0 auto}

/* Space Profile */
.sp-tag{display:inline-block;padding:3px 8px;font-size:9px;letter-spacing:1.5px;border-radius:1px;margin:2px}

/* ── v0.7: BLE / WiFi / Baro / Sync ── */
.ble-device{padding:8px 10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:6px;animation:fadeIn .3s ease}
.ble-device-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ble-name{font-size:11px;color:#00ddff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.ble-rssi{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.ble-meta{font-size:9px;color:#445566;margin-top:3px}
.rssi-bar{height:3px;background:#0a0f14;border-radius:1px;margin-top:4px;overflow:hidden}
.rssi-fill{height:100%;border-radius:1px;transition:width .5s}

.wifi-map{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);margin-bottom:14px}
.wifi-map canvas{display:block;width:100%}

.sync-peer{padding:8px 10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sync-code{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:4px;padding:8px 16px;background:#0a0f14;border:1px solid #1a2530;border-radius:2px;text-align:center;color:#00ffaa;user-select:all;margin:8px 0}
.sync-input{background:#0a0f14;border:1px solid #1a2530;color:#8899aa;padding:8px 12px;font-size:12px;font-family:'IBM Plex Mono',monospace;border-radius:2px;width:100%;letter-spacing:2px;text-align:center}
.sync-input:focus{outline:none;border-color:#00ffaa44}

.baro-trend{display:flex;align-items:flex-end;gap:1px;height:60px;margin-top:8px}
.baro-bar{flex:1;border-radius:1px 1px 0 0;transition:height .3s;min-width:3px}

@media(max-width:600px){
  .log-h,.log-r{grid-template-columns:50px 40px 52px 54px 48px 50px 1fr;font-size:10px;padding:4px 6px}
  .st-v{font-size:16px}.hdr h1{font-size:16px;letter-spacing:2px}
  .em-grid{grid-template-columns:1fr}
  .layer-tab{padding:8px 4px;font-size:9px;letter-spacing:1px}
}
</style>

<body>
<div class="scan"></div>
<div class="ctn" id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var h=React.createElement,useState=React.useState,useRef=React.useRef,useCallback=React.useCallback,useEffect=React.useEffect,useMemo=React.useMemo;

/* ═══════════════════════════════════════════════════════════ */
/*  SIGNAL PRESETS                                            */
/* ═══════════════════════════════════════════════════════════ */
var SIGNALS={
  chirp_mid:{id:'chirp_mid',name:'CHIRP MID',desc:'1.5→2.5kHz / 20ms — 標準チャープ。室内用途に最適。',type:'chirp',f1:1500,f2:2500,dur:0.020,color:'#00ffaa'},
  chirp_low:{id:'chirp_low',name:'CHIRP LOW',desc:'500→1.5kHz / 30ms — 低周波。壁や障害物を貫通しやすく、建物全体の探索に。',type:'chirp',f1:500,f2:1500,dur:0.030,color:'#ff8800'},
  chirp_high:{id:'chirp_high',name:'CHIRP HIGH',desc:'3→6kHz / 15ms — 高周波。指向性が強く小さな物体も検出。',type:'chirp',f1:3000,f2:6000,dur:0.015,color:'#00ddff'},
  chirp_wide:{id:'chirp_wide',name:'CHIRP WIDE',desc:'800→4kHz / 25ms — 広帯域スイープ。最大の情報量。素材判別にも。',type:'chirp',f1:800,f2:4000,dur:0.025,color:'#ffcc00'},
  pulse_2k:{id:'pulse_2k',name:'PULSE 2kHz',desc:'2kHz単一トーン / 15ms — シンプルなパルス。基準計測用。',type:'tone',freq:2000,dur:0.015,color:'#cc66ff'},
  click:{id:'click',name:'CLICK BURST',desc:'符号化バースト / 10ms — 短いが特徴的なパターン。高時間分解能。',type:'click',dur:0.010,color:'#ff4466'}
};
var SIG_ORDER=['chirp_mid','chirp_low','chirp_high','chirp_wide','pulse_2k','click'];

/* ═══ SIGNAL GENERATION ═══ */
function genSignal(sig,sr){
  var N=Math.floor(sr*sig.dur),b=new Float32Array(N);
  if(sig.type==='chirp'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*(sig.f1*t+(sig.f2-sig.f1)*t*t/(2*sig.dur)))*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}
  else if(sig.type==='tone'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*sig.freq*t)*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}
  else if(sig.type==='click'){var fc=2500;for(var i=0;i<N;i++){var t=i/sr;var env=Math.exp(-Math.pow((i-N/2)/(N/5),2));b[i]=Math.sin(2*Math.PI*fc*t*(1+0.5*t/sig.dur))*env;}}
  return b;
}

/* ═══ CONFIG ═══ */
var CFG={sr:44100,listenMs:500,bufSize:256,blanking:8,maxThresh:0.45,minConf:0.04,histMax:64};

function xcorr(sig,ref,sr,blankMs){
  var rL=ref.length,sL=sig.length,bS=Math.floor(sr*blankMs/1000),mL=sL-rL;
  if(mL<=bS)return{corr:new Float32Array(0),peakLag:-1,peakVal:0,bS:bS};
  var rE=0;for(var i=0;i<rL;i++)rE+=ref[i]*ref[i];rE=Math.sqrt(rE);
  var cL=mL-bS,corr=new Float32Array(cL),pV=0,pI=0;
  for(var lag=bS;lag<mL;lag++){
    var sum=0,sE=0;for(var j=0;j<rL;j++){sum+=sig[lag+j]*ref[j];sE+=sig[lag+j]*sig[lag+j];}
    sE=Math.sqrt(sE);var ncc=(rE>0&&sE>0)?sum/(rE*sE):0;
    var idx=lag-bS;corr[idx]=ncc;if(ncc>pV){pV=ncc;pI=idx;}}
  return{corr:corr,peakLag:pI+bS,peakVal:pV,bS:bS};
}

function lagMs(l){return(l/CFG.sr)*1000;}
function calcTh(cn){return Math.max(CFG.minConf,Math.min(cn*2.5,CFG.maxThresh));}
function genId(){return Math.floor(Math.random()*0xFFFF).toString(16).padStart(4,'0').toUpperCase();}
function fMs(v){return v==null?'---':v<1?'<1ms':Math.round(v)+'ms';}
function fT(d){return d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function cls(ms){if(ms==null)return{l:'TIMEOUT',c:'#ff3333'};if(ms<5)return{l:'NEAR',c:'#00ffaa'};if(ms<20)return{l:'ROOM',c:'#00ddff'};if(ms<50)return{l:'HALL',c:'#ffcc00'};if(ms<150)return{l:'OPEN',c:'#ff8800'};return{l:'DISTANT',c:'#ff4444'};}
function eD(ms){return ms==null?null:((ms/1000)*343)/2;}
function cC(c){return c>=.5?'#00ffaa':c>=.3?'#00ddff':c>=.15?'#ffcc00':'#ff4444';}
function flat(b){var t=0;for(var i=0;i<b.length;i++)t+=b[i].length;var f=new Float32Array(t);var o=0;for(var i=0;i<b.length;i++){f.set(b[i],o);o+=b[i].length;}return f;}
function rmsV(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/a.length);}

/* ═══════════════════════════════════════════════════════════ */
/*  EM / SENSOR LAYER — iOS Safari Permission Aware           */
/* ═══════════════════════════════════════════════════════════ */
var IS_IOS=(function(){
  var ua=navigator.userAgent||'';
  return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
})();
var NEEDS_ORIENT_PERM=IS_IOS&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
var NEEDS_MOTION_PERM=IS_IOS&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';

var _sensorPermState={orient:'unknown',motion:'unknown',listeners:[]};
function notifyPerm(){_sensorPermState.listeners.forEach(function(fn){fn({orient:_sensorPermState.orient,motion:_sensorPermState.motion});});}

function useSensorPermissions(){
  var _s=useState({orient:_sensorPermState.orient,motion:_sensorPermState.motion});
  var perms=_s[0],setPerms=_s[1];
  useEffect(function(){
    var fn=function(v){setPerms({orient:v.orient,motion:v.motion});};
    _sensorPermState.listeners.push(fn);
    if(!NEEDS_ORIENT_PERM&&_sensorPermState.orient==='unknown'){_sensorPermState.orient='granted';notifyPerm();}
    if(!NEEDS_MOTION_PERM&&_sensorPermState.motion==='unknown'){_sensorPermState.motion='granted';notifyPerm();}
    return function(){_sensorPermState.listeners=_sensorPermState.listeners.filter(function(f){return f!==fn;});};
  },[]);
  var requestAll=useCallback(function(){
    var p1=NEEDS_ORIENT_PERM?DeviceOrientationEvent.requestPermission().then(function(r){
      _sensorPermState.orient=r;}).catch(function(){_sensorPermState.orient='denied';}):Promise.resolve();
    var p2=NEEDS_MOTION_PERM?DeviceMotionEvent.requestPermission().then(function(r){
      _sensorPermState.motion=r;}).catch(function(){_sensorPermState.motion='denied';}):Promise.resolve();
    return Promise.all([p1,p2]).then(function(){notifyPerm();});
  },[]);
  var needsRequest=perms.orient!=='granted'||perms.motion!=='granted';
  return{perms:perms,requestAll:requestAll,needsRequest:NEEDS_ORIENT_PERM||NEEDS_MOTION_PERM?needsRequest:false,isIOS:IS_IOS};
}

/* ── Magnetometer ── */
function useMagnetometer(){
  var _s=useState({x:0,y:0,z:0,mag:0,available:false,heading:null,source:'none'});
  var data=_s[0],setData=_s[1];
  var ref=useRef(null);
  var perms=useSensorPermissions();
  useEffect(function(){
    if(ref.current){ref.current();ref.current=null;}
    if(window.Magnetometer){
      try{
        var sensor=new Magnetometer({frequency:10});
        sensor.addEventListener('reading',function(){
          var m=Math.sqrt(sensor.x*sensor.x+sensor.y*sensor.y+sensor.z*sensor.z);
          setData({x:sensor.x,y:sensor.y,z:sensor.z,mag:m,available:true,heading:null,source:'magnetometer'});
        });
        sensor.addEventListener('error',function(){tryOrientation();});
        sensor.start();
        ref.current=function(){try{sensor.stop();}catch(e){}};
        return function(){if(ref.current)ref.current();};
      }catch(e){tryOrientation();}
    }else{tryOrientation();}
    function tryOrientation(){
      if(NEEDS_ORIENT_PERM&&_sensorPermState.orient!=='granted'){
        setData(function(d){return Object.assign({},d,{available:false,source:'awaiting_permission'});});return;}
      var handler=function(ev){
        var heading=ev.alpha!=null?ev.alpha:null;

    }

}

/* ── Ambient Light ── */
function useAmbientLight(){
  var _s=useState({lux:null,available:false,source:'none'});
  var data=_s[0],setData=_s[1];
  var ref=useRef({stream:null,video:null,canvas:null,timer:null});
  useEffect(function(){
    if(window.AmbientLightSensor){
      try{
        var sensor=new AmbientLightSensor({frequency:5});
        sensor.addEventListener('reading',function(){setData({lux:sensor.illuminance,available:true,source:'sensor'});});
        sensor.addEventListener('error',function(){startCameraFallback();});
        sensor.start();
        return function(){try{sensor.stop();}catch(e){}};
      }catch(e){startCameraFallback();}
    }else{startCameraFallback();}
    function startCameraFallback(){
      navigator.mediaDevices.getUserMedia({
        video:{facingMode:'environment',width:{ideal:32},height:{ideal:32}},audio:false
      }).then(function(stream){
        ref.current.stream=stream;
        var video=document.createElement('video');
        video.srcObject=stream;video.setAttribute('playsinline','');video.muted=true;video.play();
        ref.current.video=video;
        var canvas=document.createElement('canvas');canvas.width=16;canvas.height=16;
        ref.current.canvas=canvas;
        var ctx=canvas.getContext('2d',{willReadFrequently:true});
        ref.current.timer=setInterval(function(){
          if(video.readyState>=2){
            ctx.drawImage(video,0,0,16,16);
            var imgData=ctx.getImageData(0,0,16,16).data;
            var totalBright=0,count=0;
            for(var i=0;i<imgData.length;i+=4){totalBright+=0.299*imgData[i]+0.587*imgData[i+1]+0.114*imgData[i+2];count++;}

/*  v0.7 NEW: BAROMETER (Generic Sensor API)                  */
/* ═══════════════════════════════════════════════════════════ */
function useBarometer(){
  var _s=useState({pressure:null,available:false,source:'none',trend:[],altitude:null});
  var data=_s[0],setData=_s[1];
  var trendRef=useRef([]);

  useEffect(function(){
    // Try Generic Sensor API: Barometer (requires Chrome flag or HTTPS)
    if(window.Barometer){
      try{
        var sensor=new Barometer({frequency:1});
        sensor.addEventListener('reading',function(){
          var p=sensor.pressure; // hPa
          trendRef.current=trendRef.current.concat([{t:Date.now(),p:p}]).slice(-60);
          // Hypsometric formula: altitude ≈ 44330 * (1 - (P/P0)^(1/5.255))
          var alt=44330*(1-Math.pow(p/1013.25,1/5.255));
          setData({pressure:p,available:true,source:'barometer',trend:trendRef.current.slice(),altitude:alt});
        });
        sensor.addEventListener('error',function(e){
          tryAbsoluteOrientation();
        });
        sensor.start();
        return function(){try{sensor.stop();}catch(e){}};
      }catch(e){tryAbsoluteOrientation();}
    }else{tryAbsoluteOrientation();}

    function tryAbsoluteOrientation(){
      // Try AbsoluteOrientationSensor or PressureSensor as fallback names
      if(window.PressureSensor){
        try{
          var sensor2=new PressureSensor({frequency:1});
          sensor2.addEventListener('reading',function(){
            var p=sensor2.pressure;
            trendRef.current=trendRef.current.concat([{t:Date.now(),p:p}]).slice(-60);
            var alt=44330*(1-Math.pow(p/1013.25,1/5.255));
            setData({pressure:p,available:true,source:'pressure_sensor',trend:trendRef.current.slice(),altitude:alt});
          });
          sensor2.start();
          return;
        }catch(e){}
      }
      // No barometer available — leave as unavailable
      setData(function(d){return Object.assign({},d,{available:false,source:'unavailable'});});
    }
  },[]);
  return data;
}

function useNetworkInfo(){
  var _s=useState({available:false,type:'unknown',effectiveType:'unknown',downlink:null,rtt:null,saveData:false,history:[]});

    function update(){
      var snap={
        type:conn.type||'unknown',

        downlink:conn.downlink!=null?conn.downlink:null,
        rtt:conn.rtt!=null?conn.rtt:null,

          setData(function(d){return Object.assign({},d,{available:true,scanning:false,devices:devList,source:'web_bluetooth'});});

    }

        setData(function(d){return Object.assign({},d,{available:true,scanning:true,devices:devList,source:'ble_scan'});});
      });
    }).catch(function(err){

    });
  },[]);

  var stopAdvScan=useCallback(function(){

/*  v0.7 NEW: MULTI-DEVICE SYNC (BroadcastChannel + Beacon)   */
/* ═══════════════════════════════════════════════════════════ */
var SYNC_CHANNEL_NAME='ptcp-sync-v07';

function useMultiSync(){
  var _s=useState({
    nodeId:genId()+'-'+genId(),
    peers:{},
    peerCount:0,
    lastSync:null,
    bcAvailable:typeof BroadcastChannel!=='undefined',
    syncMode:'local', // 'local' (BroadcastChannel) or 'acoustic'
    beaconActive:false,
    beaconListening:false,
    messages:[]
  });
  var state=_s[0],setState=_s[1];
  var bcRef=useRef(null);
  var peersRef=useRef({});
  var nodeIdRef=useRef(state.nodeId);

  // BroadcastChannel for same-origin tab sync
  useEffect(function(){
    if(typeof BroadcastChannel==='undefined')return;
    var bc=new BroadcastChannel(SYNC_CHANNEL_NAME);
    bcRef.current=bc;

    bc.onmessage=function(ev){
      var msg=ev.data;
      if(!msg||!msg.nodeId||msg.nodeId===nodeIdRef.current)return;

      // Update peer info
      peersRef.current[msg.nodeId]={
        nodeId:msg.nodeId,
        lastSeen:new Date(),
        data:msg.payload||{},
        type:msg.type
      };

      // Clean stale peers (>10s)
      var now=Date.now();
      var peers=peersRef.current;
      for(var k in peers){if(now-peers[k].lastSeen.getTime()>10000)delete peers[k];}

      var peerList=Object.assign({},peersRef.current);
      var msgEntry={time:new Date(),from:msg.nodeId,type:msg.type,data:msg.payload};

      setState(function(s){
        var msgs=s.messages.concat([msgEntry]).slice(-50);
        return Object.assign({},s,{peers:peerList,peerCount:Object.keys(peerList).length,lastSync:new Date(),messages:msgs});
      });
    };

    // Announce presence
    function announce(){
      bc.postMessage({type:'heartbeat',nodeId:nodeIdRef.current,payload:{ts:Date.now()}});
    }
    announce();
    var hbTimer=setInterval(announce,3000);

    return function(){
      bc.postMessage({type:'disconnect',nodeId:nodeIdRef.current,payload:{}});
      clearInterval(hbTimer);
      bc.close();
    };
  },[]);

  // Broadcast sensor data
  var broadcastData=useCallback(function(payload){
    if(bcRef.current){
      bcRef.current.postMessage({type:'sensor_data',nodeId:nodeIdRef.current,payload:payload});
    }
  },[]);

  // Broadcast ping result
  var broadcastPing=useCallback(function(pingResult){
    if(bcRef.current){
      bcRef.current.postMessage({type:'ping_result',nodeId:nodeIdRef.current,payload:pingResult});
    }
  },[]);

  // Send arbitrary message
  var sendMessage=useCallback(function(type,payload){
    if(bcRef.current){
      bcRef.current.postMessage({type:type,nodeId:nodeIdRef.current,payload:payload||{}});
    }
  },[]);

  return{state:state,broadcastData:broadcastData,broadcastPing:broadcastPing,sendMessage:sendMessage};
}

/* ═══════════════════════════════════════════════════════════ */
/*  MEDIATION COEFFICIENT CALCULATOR (v0.7 expanded)          */
/* ═══════════════════════════════════════════════════════════ */
function calcMediation(acoustic,mag,light,motion,baro,netInfo,bleDevices){
  var dims={};

  // Acoustic Responsiveness
  if(acoustic&&acoustic.rtt!=null){dims.acoustic=Math.min(1,acoustic.cf||0);}
  else{dims.acoustic=0;}

  // EM Field Density
  if(mag.available){
    if(mag.source==='magnetometer'){dims.emField=Math.min(1,mag.mag/100);}
    else{dims.emField=Math.min(1,mag.mag/90);}
  }else{dims.emField=0.5;}

  // Photonic Environment
  if(light.available&&light.lux!=null){dims.photonic=Math.min(1,light.lux/1000);}
  else{dims.photonic=0.5;}

  // Kinetic Stability
  if(motion.available){
    var devFromGravity=Math.abs(motion.mag-9.81);
    dims.kinetic=Math.max(0,1-devFromGravity/5);
  }else{dims.kinetic=0.5;}

  // v0.7: Barometric (atmospheric stability)
  if(baro&&baro.available){
    // Normal sea-level: ~1013.25 hPa. Deviation indicates weather/altitude
    var pDev=Math.abs(baro.pressure-1013.25);
    dims.barometric=Math.max(0,1-pDev/50); // within 50 hPa of normal = high
  }else{dims.barometric=0.5;}

  // v0.7: Network Connectivity
  if(netInfo&&netInfo.available){
    var netScore=0;
    if(netInfo.effectiveType==='4g')netScore=0.9;
    else if(netInfo.effectiveType==='3g')netScore=0.6;
    else if(netInfo.effectiveType==='2g')netScore=0.3;
    else if(netInfo.effectiveType==='slow-2g')netScore=0.1;
    else netScore=0.5;
    // Adjust by RTT
    if(netInfo.rtt!=null){netScore=netScore*Math.max(0,1-netInfo.rtt/2000);}
    dims.network=Math.min(1,netScore);
  }else{dims.network=0.5;}

  // v0.7: BLE Proximity density
  if(bleDevices&&bleDevices.length>0){
    // More devices nearby = higher connectivity
    dims.bleProximity=Math.min(1,bleDevices.length/10);
  }else{dims.bleProximity=0;}

  // Composite: expanded weights for v0.7
  var weights={acoustic:0.25,emField:0.15,photonic:0.10,kinetic:0.15,barometric:0.10,network:0.15,bleProximity:0.10};
  var total=0,wSum=0;
  for(var k in dims){if(weights[k]){total+=dims[k]*weights[k];wSum+=weights[k];}}
  var composite=wSum>0?total/wSum:0;

  return{composite:composite,dims:dims};
}

/* ═══════════════════════════════════════════════════════════ */
/*  SPACE PROFILE CLASSIFIER (v0.7 expanded)                   */
/* ═══════════════════════════════════════════════════════════ */
function classifySpace(med,acousticHist){
  var tags=[];
  var d=med.dims;

  if(acousticHist&&acousticHist.length>2){
    var avgRtt=0,cnt=0;
    for(var i=0;i<acousticHist.length;i++){if(acousticHist[i].rtt!=null){avgRtt+=acousticHist[i].rtt;cnt++;}}
    if(cnt>0){
      avgRtt/=cnt;
      if(avgRtt<5)tags.push({l:'ENCLOSED',c:'#00ffaa'});
      else if(avgRtt<20)tags.push({l:'INDOOR',c:'#00ddff'});
      else if(avgRtt<50)tags.push({l:'OPEN-INDOOR',c:'#ffcc00'});
      else tags.push({l:'OUTDOOR',c:'#ff8800'});
    }
  }

  if(d.emField>0.7)tags.push({l:'HIGH-EM',c:'#ff4466'});
  else if(d.emField>0.3)tags.push({l:'MODERATE-EM',c:'#cc66ff'});
  else tags.push({l:'LOW-EM',c:'#00ffaa'});

  if(d.photonic>0.8)tags.push({l:'BRIGHT',c:'#ffcc00'});
  else if(d.photonic>0.3)tags.push({l:'LIT',c:'#8899aa'});
  else tags.push({l:'DIM',c:'#556677'});

  if(d.kinetic>0.8)tags.push({l:'STABLE',c:'#00ffaa'});
  else if(d.kinetic>0.4)tags.push({l:'MOVING',c:'#ffcc00'});
  else tags.push({l:'UNSTABLE',c:'#ff3333'});

  // v0.7 new tags
  if(d.barometric>0.8)tags.push({l:'BARO-STABLE',c:'#88aacc'});
  else if(d.barometric>0.4)tags.push({l:'BARO-VARY',c:'#cc8844'});
  else tags.push({l:'ALTITUDE',c:'#ff8800'});

  if(d.network>0.7)tags.push({l:'CONNECTED',c:'#00ffaa'});
  else if(d.network>0.3)tags.push({l:'PARTIAL-NET',c:'#ffcc00'});
  else tags.push({l:'OFFLINE',c:'#ff4444'});

  if(d.bleProximity>0.5)tags.push({l:'BLE-DENSE',c:'#00ddff'});
  else if(d.bleProximity>0.1)tags.push({l:'BLE-SPARSE',c:'#556677'});

  if(med.composite>0.7)tags.push({l:'HIGH-CONNECT',c:'#00ffaa'});
  else if(med.composite>0.4)tags.push({l:'MED-CONNECT',c:'#ffcc00'});
  else tags.push({l:'LOW-CONNECT',c:'#ff4444'});

  return tags;
}

        ctx.beginPath();ctx.moveTo(px,0);ctx.lineTo(px,H);ctx.stroke();
        ctx.fillStyle=det?cC(cf):'#ff3333';ctx.beginPath();ctx.arc(px,py,4*dpr,0,Math.PI*2);ctx.fill();
        ctx.font=(11*dpr)+'px IBM Plex Mono,monospace';
        ctx.fillText(lagMs(pL).toFixed(1)+'ms ('+cf.toFixed(3)+')',px+6*dpr,14*dpr);}}
    ctx.fillStyle='#33445544';ctx.font=(9*dpr)+'px IBM Plex Mono,monospace';
    var tMs=(corr.length/CFG.sr)*1000;
    for(var t=25;t<tMs;t+=50){ctx.fillText(t+'ms',(t/tMs)*W,H-4*dpr);}
  },[corr,pL,bS,cf,th,sigColor]);
  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'100px'}});
}

/* ═══ Mediation Ring Canvas (v0.7 — 7 dimensions) ═══ */
function MedRing(p){
  var val=p.value||0,dims=p.dims||{};
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current;if(!cv)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var S=120*dpr;cv.width=S;cv.height=S;cv.style.width='120px';cv.style.height='120px';
    ctx.clearRect(0,0,S,S);
    var cx=S/2,cy=S/2,r=S/2-8*dpr;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='#1a2530';ctx.lineWidth=6*dpr;ctx.stroke();
    var startAngle=-Math.PI/2;
    var endAngle=startAngle+Math.PI*2*val;
    var grad=ctx.createLinearGradient(0,0,S,S);
    if(val>0.6){grad.addColorStop(0,'#00ffaa');grad.addColorStop(1,'#00ddff');}
    else if(val>0.3){grad.addColorStop(0,'#ffcc00');grad.addColorStop(1,'#ff8800');}
    else{grad.addColorStop(0,'#ff4444');grad.addColorStop(1,'#ff3333');}
    ctx.beginPath();ctx.arc(cx,cy,r,startAngle,endAngle);
    ctx.strokeStyle=grad;ctx.lineWidth=6*dpr;ctx.lineCap='round';ctx.stroke();
    var dimKeys=['acoustic','emField','photonic','kinetic','barometric','network','bleProximity'];
    var dimColors=['#00ffaa','#cc66ff','#ffcc00','#00ddff','#88aacc','#ff8800','#00ddff'];
    for(var i=0;i<dimKeys.length;i++){
      var angle=startAngle+(Math.PI*2/dimKeys.length)*i;
      var dv=dims[dimKeys[i]]||0;
      var ir=r-12*dpr,or=r-4*dpr;
      var tickR=ir+dv*(or-ir);
      ctx.beginPath();
      ctx.arc(cx+Math.cos(angle)*tickR,cy+Math.sin(angle)*tickR,2.5*dpr,0,Math.PI*2);
      ctx.fillStyle=dimColors[i];ctx.fill();
    }
  },[val,dims]);
  return h('canvas',{ref:ref,style:{width:'120px',height:'120px'}});
}

/* ═══ Radar Chart (v0.7 — 7 axes) ═══ */
function RadarCanvas(p){
  var dims=p.dims||{};
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current;if(!cv)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var S=240*dpr;cv.width=S;cv.height=S;cv.style.width='240px';cv.style.height='240px';
    ctx.clearRect(0,0,S,S);
    var cx=S/2,cy=S/2,maxR=S/2-24*dpr;
    var keys=['acoustic','emField','photonic','kinetic','barometric','network','bleProximity'];
    var labels=['ACOUSTIC','EM FIELD','PHOTONIC','KINETIC','BARO','NETWORK','BLE'];
    var colors=['#00ffaa','#cc66ff','#ffcc00','#00ddff','#88aacc','#ff8800','#00ddff'];
    var n=keys.length;
    for(var ring=1;ring<=4;ring++){
      var rr=maxR*(ring/4);
      ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);
      ctx.strokeStyle='#1a253055';ctx.lineWidth=1;ctx.stroke();
    }
    for(var i=0;i<n;i++){
      var angle=-Math.PI/2+(Math.PI*2/n)*i;
      var ex=cx+Math.cos(angle)*maxR,ey=cy+Math.sin(angle)*maxR;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(ex,ey);
      ctx.strokeStyle='#1a253088';ctx.lineWidth=1;ctx.stroke();
      var lx=cx+Math.cos(angle)*(maxR+14*dpr);
      var ly=cy+Math.sin(angle)*(maxR+14*dpr);
      ctx.fillStyle=colors[i];ctx.font='bold '+(7*dpr)+'px IBM Plex Mono,monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(labels[i],lx,ly);
    }
    ctx.beginPath();
    for(var i=0;i<n;i++){
      var angle=-Math.PI/2+(Math.PI*2/n)*i;
      var v=Math.min(1,dims[keys[i]]||0);
      var px=cx+Math.cos(angle)*maxR*v;
      var py=cy+Math.sin(angle)*maxR*v;
      i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(0,255,170,.08)';ctx.fill();
    ctx.strokeStyle='#00ffaa88';ctx.lineWidth=2;ctx.stroke();
    for(var i=0;i<n;i++){
      var angle=-Math.PI/2+(Math.PI*2/n)*i;
      var v=Math.min(1,dims[keys[i]]||0);
      var px=cx+Math.cos(angle)*maxR*v;
      var py=cy+Math.sin(angle)*maxR*v;
      ctx.beginPath();ctx.arc(px,py,3*dpr,0,Math.PI*2);
      ctx.fillStyle=colors[i];ctx.fill();
    }
  },[dims]);
  return h('canvas',{ref:ref,style:{width:'240px',height:'240px'}});
}

/* ═══ Network RTT Sparkline ═══ */
function NetSparkline(p){
  var history=p.history||[];
  var ref=useRef(null);
  useEffect(function(){
    var cv=ref.current;if(!cv||!history.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr,H=40*dpr;cv.width=W;cv.height=H;cv.style.height='40px';
    ctx.clearRect(0,0,W,H);
    var vals=history.map(function(h){return h.rtt||0;});
    var mx=Math.max.apply(null,vals)||100;
    ctx.strokeStyle='#ff880066';ctx.lineWidth=1.5;ctx.beginPath();
    for(var i=0;i<vals.length;i++){
      var x=(i/(vals.length-1||1))*W;
      var y=H-(vals[i]/mx)*H*0.9;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
    // Fill under
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();
    ctx.fillStyle='rgba(255,136,0,.05)';ctx.fill();
  },[history]);
  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'40px'}});
}

    sync.broadcastData({mediation:mediation.composite,dims:mediation.dims,baro:snap.baro,net:snap.net,bleCount:snap.bleCount});
  },[mag,light,motion,mediation,baro,netInfo,ble.data.devices,sync.broadcastData]);

  useEffect(function(){
    var iv=setInterval(scanEM,2000);
    return function(){clearInterval(iv);};
  },[scanEM]);

  // Audio
  var initAudio=useCallback(function(){
    return new Promise(function(ok){
      if(acRef.current&&acRef.current.state!=='closed'){
        if(acRef.current.state==='suspended')acRef.current.resume().then(function(){ok(true);});
        else ok(true);return;}
      var ctx;try{ctx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:CFG.sr});}
      catch(ex){setErr('AudioContext: '+ex.message);ok(false);return;}
      (ctx.state==='suspended'?ctx.resume():Promise.resolve()).then(function(){
        return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      }).then(function(stream){
        acRef.current=ctx;var src=ctx.createMediaStreamSource(stream);
        var proc=ctx.createScriptProcessor(CFG.bufSize,1,1);
        proc.onaudioprocess=function(ev){
          var inp=ev.inputBuffer.getChannelData(0);var sum=0;
          for(var i=0;i<inp.length;i++)sum+=inp[i]*inp[i];
          setLvl(Math.sqrt(sum/inp.length));
          if(rec.current.on){var cp=new Float32Array(inp.length);cp.set(inp);rec.current.buf.push(cp);}};
        src.connect(proc);proc.connect(ctx.destination);setErr(null);ok(true);
      }).catch(function(ex){setErr('マイクアクセスが必要: '+(ex.message||ex));ok(false);});
    });
  },[]);

  var playSignal=useCallback(function(){
    var ctx=acRef.current,buf=sigBufRef.current;if(!ctx||!buf)return;

    var s=ctx.createBufferSource();s.buffer=ab;var g=ctx.createGain();g.gain.value=1.0;
    s.connect(g);g.connect(ctx.destination);s.start();
  },[]);

  var calibrate=useCallback(function(){
    return initAudio().then(function(ok){if(!ok)return;
      setStatus('calibrating');setInfo('環境ノイズ計測中... 2秒');
      rec.current.on=true;rec.current.buf=[];
      return new Promise(function(r){setTimeout(r,2000);});
    }).then(function(){

      setStatus('idle');

      return a;

          h('div',{style:{fontSize:'9px',color:'#223344',marginTop:'4px'}},'SCAN DEVICE をタップして検出開始'))
      ):h('div',{style:{color:'#ff666688',fontSize:'11px',padding:'10px'}},
        '⚠ Web Bluetooth is not supported in this browser.',h('br'),
        'Chrome / Edge on Android, ChromeOS, or macOS required.')
    ));

    ch.push(h('div',{className:'nfo',key:'rf-note'},
      '▸ BLE SCAN: requestDevice() (picker) + requestLEScan() (experimental passive scan)',h('br'),
      '▸ WIFI: Network Information API — effectiveType, downlink, RTT (RSSI not exposed)',h('br'),
      '▸ ROADMAP: WebUSB WiFi adapter for direct RSSI, Web NFC for field detection'));
  }

  /* ═══════════════════════════════════════════ */
  /*  MEDIATION COEFFICIENT LAYER (v0.7)        */
  /* ═══════════════════════════════════════════ */
  if(layer==='mediation'){
    var mc=mediation.composite;
    var mcColor=mc>0.6?'#00ffaa':mc>0.3?'#ffcc00':'#ff4444';

    ch.push(h('div',{className:'med-coeff',key:'med'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ffcc00'}}),'MEDIATION COEFFICIENT — μ(x,t) v0.7'),
      h('div',{style:{textAlign:'center',margin:'12px 0'}},
        h(MedRing,{value:mc,dims:mediation.dims}),
        h('div',{className:'med-center',style:{position:'relative',marginTop:'-80px',marginBottom:'40px'}},
          h('div',{className:'med-val',style:{color:mcColor}},mc.toFixed(3)),
          h('div',{className:'med-lbl'},'COMPOSITE'))
      ),
      h('div',{className:'med-dims'},
        [{k:'acoustic',l:'ACOUSTIC',c:'#00ffaa',desc:'音響反射率'},
         {k:'emField',l:'EM FIELD',c:'#cc66ff',desc:'電磁場密度'},
         {k:'photonic',l:'PHOTONIC',c:'#ffcc00',desc:'光環境'},
         {k:'kinetic',l:'KINETIC',c:'#00ddff',desc:'運動安定性'},
         {k:'barometric',l:'BARO',c:'#88aacc',desc:'気圧安定性'},
         {k:'network',l:'NETWORK',c:'#ff8800',desc:'ネット接続性'},
         {k:'bleProximity',l:'BLE',c:'#00ddff',desc:'近接デバイス密度'}
        ].map(function(d){
          var v=mediation.dims[d.k]||0;
          return h('div',{className:'med-dim',key:d.k},
            h('div',{className:'med-dim-l'},d.l),
            h('div',{className:'med-dim-v',style:{color:d.c}},v.toFixed(3)),
            h('div',{style:{fontSize:'8px',color:'#334455',marginTop:'2px'}},d.desc),
            h('div',{className:'em-bar-row',style:{marginTop:'4px'}},
              h('div',{className:'em-bar-bg'},h('div',{className:'em-bar-fill',style:{width:(v*100)+'%',background:d.c+'88'}}))));
        }))
    ));

    ch.push(h('div',{className:'sec',key:'med-formula'},
      h('div',{className:'sec-label'},'FORMULA v0.7'),
      h('div',{style:{fontSize:'11px',color:'#667788',lineHeight:'2',fontFamily:'monospace'}},
        'μ(x,t) = Σ wᵢ · dᵢ(x,t)',h('br'),
        'dᵢ ∈ {acoustic, emField, photonic, kinetic, barometric, network, bleProximity}',h('br'),
        'w = [0.25, 0.15, 0.10, 0.15, 0.10, 0.15, 0.10]',h('br'),h('br'),
        h('span',{style:{color:'#445566'}},'v0.7で3次元（気圧・ネットワーク・BLE近接）を追加。'),h('br'),
        h('span',{style:{color:'#445566'}},'7次元空間情報接続性指標として拡張。'))
    ));

    ch.push(h('div',{className:'radar-wrap',key:'radar'},
      h('div',{className:'sec-label',style:{marginBottom:'8px'}},'7-DIMENSIONAL RADAR'),
      h(RadarCanvas,{dims:mediation.dims})));
  }

  /* ═══════════════════════════════════════════ */
  /*  v0.7: SYNC LAYER                          */
  /* ═══════════════════════════════════════════ */
  if(layer==='sync'){
    var ss=sync.state;

    ch.push(h('div',{className:'sec',key:'sync-hdr'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ff8800'}}),'MULTI-DEVICE SYNC'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'1.8',marginBottom:'8px'}},
        'BroadcastChannel APIによる同一オリジン内のタブ間リアルタイム同期。',h('br'),
        '同じURLで複数のブラウザタブ/ウィンドウを開くとデータが自動共有されます。')));

    // Node info
    ch.push(h('div',{className:'sec',key:'sync-node'},
      h('div',{className:'sec-label'},'THIS NODE'),
      h('div',{style:{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}},
        h('div',{className:'sync-code'},ss.nodeId),
        h('div',{style:{fontSize:'10px',color:'#556677'}},
          'BroadcastChannel: '+(ss.bcAvailable?h('span',{style:{color:'#00ffaa'}},'✔ AVAILABLE'):h('span',{style:{color:'#ff3333'}},'✘ N/A')),
          h('br'),'Mode: '+ss.syncMode.toUpperCase())
      )));

    // Peers
    ch.push(h('div',{className:'sec',key:'sync-peers'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:ss.peerCount>0?'#00ffaa':'#556677'}}),'CONNECTED PEERS: '+ss.peerCount),
      ss.peerCount>0?h('div',null,
        Object.values(ss.peers).map(function(peer){
          var age=Math.floor((Date.now()-peer.lastSeen.getTime())/1000);
          var peerMed=peer.data&&peer.data.mediation!=null?peer.data.mediation:null;
          return h('div',{className:'sync-peer',key:peer.nodeId},
            h('div',null,
              h('div',{style:{fontSize:'11px',color:'#ff8800',fontWeight:500,letterSpacing:'1px'}},peer.nodeId),
              h('div',{style:{fontSize:'9px',color:'#445566',marginTop:'2px'}},
                'Last: '+age+'s ago | Type: '+(peer.type||'---'))),
            h('div',{style:{textAlign:'right'}},
              peerMed!=null?h('div',{style:{fontSize:'14px',fontWeight:600,color:peerMed>0.6?'#00ffaa':peerMed>0.3?'#ffcc00':'#ff4444'}},
                'μ '+peerMed.toFixed(3)):null,
              peer.data&&peer.data.dims?h('div',{style:{fontSize:'9px',color:'#445566'}},
                Object.keys(peer.data.dims).map(function(k){return k.substr(0,3)+':'+peer.data.dims[k].toFixed(2);}).join(' ')):null)
          );
        })
      ):h('div',{style:{textAlign:'center',padding:'24px',color:'#334455'}},
        h('div',{style:{fontSize:'24px',opacity:.3,marginBottom:'6px'}},'⟐'),
        h('div',{style:{fontSize:'10px',letterSpacing:'2px'}},'NO PEERS DETECTED'),
        h('div',{style:{fontSize:'9px',color:'#223344',marginTop:'6px',lineHeight:'1.8'}},
          '同じURLで別のタブ/ウィンドウを開いてください。',h('br'),
          'BroadcastChannelで自動的に接続されます。'))
    ));

    // Sync messages log
    if(ss.messages.length>0){
      ch.push(h('div',{className:'sec',key:'sync-log'},
        h('div',{className:'sec-label'},'SYNC MESSAGE LOG'),
        h('div',{style:{maxHeight:'200px',overflow:'auto'}},
          ss.messages.slice(-20).reverse().map(function(msg,i){
            var typeColor=msg.type==='heartbeat'?'#445566':msg.type==='sensor_data'?'#cc66ff':msg.type==='ping_result'?'#00ffaa':'#ff8800';
            return h('div',{key:i,style:{
              padding:'4px 8px',fontSize:'10px',borderBottom:'1px solid #1a253044',
              color:'#667788',display:'flex',gap:'10px',animation:'fadeIn .25s ease'
            }},
              h('span',{style:{color:'#556677',minWidth:'52px'}},fT(msg.time)),
              h('span',{style:{color:'#ff880088',minWidth:'80px',overflow:'hidden',textOverflow:'ellipsis'}},msg.from.substr(0,9)),
              h('span',{style:{color:typeColor,minWidth:'60px',fontSize:'9px',letterSpacing:'1px'}},msg.type.toUpperCase()),
              h('span',{style:{color:'#445566',fontSize:'9px'}},
                msg.type==='ping_result'&&msg.data?'RTT:'+fMs(msg.data.rtt)+' CF:'+(msg.data.cf!=null?msg.data.cf.toFixed(3):'---'):
                msg.type==='sensor_data'&&msg.data&&msg.data.mediation!=null?'μ:'+msg.data.mediation.toFixed(3):'')
            );
          })
        )));
    }

    // Sync instructions
    ch.push(h('div',{className:'nfo',key:'sync-note'},
      '▸ SAME-ORIGIN SYNC: BroadcastChannel API — タブ間のリアルタイムメッセージング',h('br'),
      '▸ 自動ハートビート (3秒間隔) + センサーデータ共有 (2秒間隔)',h('br'),
      '▸ ピアのPing結果とMediation Coefficientがリアルタイムで同期',h('br'),
      '▸ ROADMAP: WebRTC DataChannel (cross-origin) + 音響同期ビーコン'));

    // How to test
    ch.push(h('div',{className:'sec',key:'sync-howto'},
      h('div',{className:'sec-label'},'HOW TO TEST MULTI-DEVICE SYNC'),
      h('div',{style:{fontSize:'10px',color:'#556677',lineHeight:'2'}},
        '1. このページを2つ以上のタブで開く',h('br'),
        '2. 各タブが自動的にピアとして検出される',h('br'),
        '3. SONARタブでPINGを実行すると結果が全タブに共有',h('br'),
        '4. MEDIATIONの値がリアルタイムでクロスタブ同期',h('br'),h('br'),
        h('span',{style:{color:'#ff880088'}},'NOTE: '),
        '異なるデバイス間の同期にはWebRTC DataChannel（将来実装）またはWebSocket中継サーバーが必要です。',h('br'),
        '現在は同一ブラウザのタブ間同期のみ対応しています。')
    ));
  }

  /* ═══════════════════════════════════════════ */
  /*  PROFILE LAYER (v0.7)                      */
  /* ═══════════════════════════════════════════ */
  if(layer==='profile'){
    ch.push(h('div',{className:'sec',key:'sp'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#00ddff'}}),'SPACE PROFILE v0.7'),
      h('div',{style:{margin:'10px 0'}},
        spaceTags.map(function(t,i){
          return h('span',{key:i,className:'sp-tag',style:{background:t.c+'15',border:'1px solid '+t.c+'44',color:t.c}},t.l);
        })),
      h('div',{style:{fontSize:'10px',color:'#445566',marginTop:'10px',lineHeight:'1.8'}},
        '空間プロファイルは7次元センサーレイヤーの統合分類。',h('br'),
        'v0.7: 気圧・ネットワーク・BLE近接タグが追加。')
    ));

    // IPC Protocol Stack v0.7
    ch.push(h('div',{className:'sec',key:'ipc-stack'},
      h('div',{className:'sec-label'},'IPC PROTOCOL STACK — pTCP v0.7'),
      h('div',{style:{fontSize:'10px',lineHeight:'2.2',color:'#556677'}},
        ['L5: MULTI-DEVICE SYNC — BroadcastChannel / WebRTC (future)',
         'L4: SPACE PROFILE — 空間分類・行動推奨',
         'L3: MEDIATION — μ(x,t) 7次元情報物理結合係数',
         'L2: SENSOR FUSION — 音響+EM+光+慣性+気圧+WiFi+BLE 統合',
         'L1: ACOUSTIC SONAR — チャープ・相互相関',
         'L1: EM FIELD — 磁力計・環境光・加速度',
         'L1: RF/BLE — Web Bluetooth + Network Information',
         'L1: BAROMETER — 気圧・高度推定',
         'L0: DEVICE HARDWARE — マイク・スピーカー・センサー・無線'
        ].map(function(line,i){
          var colors=['#ff8800','#00ddff','#ffcc00','#cc66ff','#00ffaa','#cc66ff','#00ddff','#88aacc','#556677'];
          return h('div',{key:i,style:{
            padding:'4px 10px',borderLeft:'3px solid '+colors[i],
            marginBottom:'2px',background:colors[i]+'08'
          }},h('span',{style:{color:colors[i]}},line));
        })
      )
    ));

    // Roadmap v0.7
    ch.push(h('div',{className:'sec',key:'roadmap'},
      h('div',{className:'sec-label'},'DEVELOPMENT ROADMAP'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'2'}},
        h('span',{style:{color:'#00ffaa'}},'v0.6'),' — Acoustic Sonar + Mag + AmbientLight + Accel + Mediation',h('br'),
        h('span',{style:{color:'#00ffaa',fontWeight:600}},'v0.7 [CURRENT]'),
        ' — WiFi mapping + BLE Proximity + Barometer + Multi-device sync + 7D Mediation',h('br'),
        h('span',{style:{color:'#cc66ff'}},'v0.8 [NEXT]'),
        ' — WebRTC cross-device sync, RF Spectrum (WebUSB SDR), NFC field detection',h('br'),
        h('span',{style:{color:'#00ddff'}},'v0.9'),
        ' — Spatial mapping (WebXR/ARKit), Point cloud, SLAM integration',h('br'),
        h('span',{style:{color:'#ff8800'}},'v1.0'),
        ' — Full Phase-Law Architecture: pTCP/IP for physical space protocol'
      )
    ));
  }

  /* ── FOOTER ── */
  ch.push(h('div',{className:'leg',key:'leg'},
    [{l:'NEAR',c:'#00ffaa',r:'<5ms'},{l:'ROOM',c:'#00ddff',r:'5-20ms'},{l:'HALL',c:'#ffcc00',r:'20-50ms'},{l:'OPEN',c:'#ff8800',r:'50-150ms'},{l:'DISTANT',c:'#ff4444',r:'>150ms'}].map(function(x){
      return h('span',{className:'leg-i',key:x.l},h('span',{className:'leg-d',style:{background:x.c}}),x.l+' '+x.r);})));

  ch.push(h('div',{className:'ftr',key:'ft'},
    'pTCP v0.7 IPC | Information Physical Connector | 7-dim sensing + BLE + WiFi + Baro + Multi-sync | Phase-Law Architecture'));

  return h('div',null,ch);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
