<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Physical Ping — pTCP v0.8 IPC</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:auto;-webkit-overflow-scrolling:touch}
body{background:linear-gradient(170deg,#0a0f14 0%,#0d1520 40%,#0a1218 100%);color:#8899aa;font-family:'IBM Plex Mono','Courier New',monospace;font-size:13px}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes scanLine{0%{top:-2px}100%{top:100%}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(0,255,170,.1)}50%{box-shadow:0 0 20px rgba(0,255,170,.25)}}
@keyframes rfSweep{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0f14}::-webkit-scrollbar-thumb{background:#1a2a3a;border-radius:2px}
.scan{position:fixed;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,170,.005) 2px,rgba(0,255,170,.005) 4px);pointer-events:none;z-index:100}
.ctn{max-width:960px;margin:0 auto;padding:20px 16px}
.hdr{margin-bottom:18px;border-bottom:1px solid #1a2530;padding-bottom:14px}
.hdr-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.hdr h1{font-size:18px;font-weight:600;color:#00ffaa;letter-spacing:3px;text-shadow:0 0 20px rgba(0,255,170,.3)}
.hdr .ver{font-size:10px;color:#334455;letter-spacing:1px}
.hdr .sub{font-size:10px;color:#00ffaa44;letter-spacing:1.5px;margin-top:2px}
.hdr p{font-size:11px;color:#445566;line-height:1.6;margin-top:6px}
.sec{margin-bottom:14px;padding:12px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.2)}
.sec-label{font-size:10px;color:#445566;letter-spacing:2px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sec-label .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.layer-tabs{display:flex;gap:2px;margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;flex-wrap:wrap}
.layer-tab{flex:1;padding:10px 8px;text-align:center;font-size:10px;letter-spacing:1.5px;cursor:pointer;border:none;background:rgba(0,0,0,.3);color:#556677;font-family:inherit;transition:all .2s;-webkit-tap-highlight-color:transparent;position:relative;min-width:60px}
.layer-tab:hover{background:rgba(255,255,255,.02)}
.layer-tab.active{background:rgba(0,0,0,.5);color:#c0d0e0}
.layer-tab.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px}
.layer-tab .tab-icon{font-size:14px;display:block;margin-bottom:3px}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;min-width:44px}
.lv-bg{flex:1;height:8px;background:#0a0f14;border-radius:1px;overflow:hidden}
.lv-bar{height:100%;border-radius:1px;transition:width .06s linear;min-width:1px}
.lv-val{font-size:11px;min-width:68px;text-align:right;font-variant-numeric:tabular-nums}
.lv-stat{font-size:10px;letter-spacing:1px;margin-top:6px}
.ctrl{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{border:none;padding:10px 20px;font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:2px;cursor:pointer;border-radius:2px;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-ping{background:linear-gradient(180deg,#00ffaa22,#00ffaa11);border:1px solid #00ffaa44;color:#00ffaa}
.btn-ping:disabled{background:#0a2a1a;cursor:wait;opacity:.6}
.btn-cont{background:transparent;border:1px solid #334455;color:#667788;padding:10px 16px;font-size:11px;letter-spacing:1px}
.btn-stop{background:linear-gradient(180deg,#ff333322,#ff333311);border:1px solid #ff333344;color:#ff3333;animation:pulse 1s infinite}
.btn-sm{padding:6px 12px;font-size:10px;letter-spacing:1px}
.btn-clear{background:transparent;border:1px solid #1a2530;color:#445566;margin-left:auto}
.btn-calib{background:transparent;border:1px solid #ffcc0044;color:#ffcc00}
.sel-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:stretch}
.sel-grp{display:flex;align-items:center;gap:6px}
.sel-grp span{font-size:10px;color:#445566;letter-spacing:1px}
.sel-grp select{background:#0d1520;border:1px solid #1a2530;color:#8899aa;padding:4px 8px;font-size:11px;font-family:inherit;border-radius:2px}
.sig-info{font-size:10px;color:#556677;padding:6px 10px;background:rgba(0,0,0,.15);border:1px solid #1a2530;border-radius:2px;flex:1;min-width:200px;line-height:1.6}
.sig-info b{color:#8899aa;font-weight:500}
.err{padding:10px 14px;background:rgba(255,50,50,.08);border:1px solid #ff333344;border-radius:2px;font-size:11px;color:#ff6666;margin-bottom:12px}
.nfo{padding:10px 14px;background:rgba(0,255,170,.04);border:1px solid #00ffaa22;border-radius:2px;font-size:11px;color:#00ffaa88;margin-bottom:12px;line-height:1.6}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(85px,1fr));gap:1px;background:#1a2530;border:1px solid #1a2530;border-radius:2px;margin-bottom:14px;overflow:hidden}
.st{background:#0d1520;text-align:center;padding:7px 4px}
.st-l{font-size:9px;letter-spacing:1.5px;color:#556677;margin-bottom:2px}
.st-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.st-u{font-size:10px;color:#556677;margin-left:2px}
.cv-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.2)}
.cv-lbl{font-size:10px;color:#445566;letter-spacing:1.5px;padding:8px 10px 4px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px}
.cv-lbl span:last-child{color:#334455}
.cv{display:block;width:100%}
.tl-bars{display:flex;align-items:flex-end;gap:2px;height:40px}
.tl-b{flex:1;border-radius:1px 1px 0 0;transition:height .3s ease;min-width:2px}
.log{border:1px solid #1a2530;border-radius:2px;overflow:hidden}
.log-h,.log-r{display:grid;grid-template-columns:56px 46px 60px 62px 56px 56px 1fr;padding:5px 8px;align-items:center}
.log-h{font-size:9px;letter-spacing:1.5px;color:#334455;border-bottom:1px solid #1a2530;background:rgba(0,0,0,.3)}
.log-b{max-height:300px;overflow:auto}
.log-r{font-size:11px;border-bottom:1px solid rgba(26,37,48,.5);color:#8899aa;animation:fadeIn .25s ease}
.log-r:nth-child(even){background:rgba(255,255,255,.008)}
.log-r.to{color:#555}
.empty{text-align:center;padding:44px 20px;color:#334455}
.empty-i{font-size:32px;margin-bottom:10px;opacity:.3}
.empty-t{font-size:11px;letter-spacing:2px;margin-bottom:8px}
.empty-d{font-size:10px;color:#223344;max-width:440px;margin:0 auto;line-height:1.8}
.leg{margin-top:14px;padding-top:10px;border-top:1px solid #1a2530;display:flex;flex-wrap:wrap;gap:10px;font-size:9px;color:#445566;letter-spacing:1px}
.leg-i{display:flex;align-items:center;gap:4px}
.leg-d{width:6px;height:6px;border-radius:1px}
.ftr{margin-top:8px;font-size:9px;color:#223344;line-height:1.8}
.conf-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.conf-bg{flex:1;height:6px;background:#0a0f14;border-radius:1px;overflow:hidden}
.conf-bar{height:100%;border-radius:1px;transition:width .3s}
.conf-lbl{font-size:11px;min-width:50px;text-align:right;font-variant-numeric:tabular-nums}

/* ── IPC Layer: EM/Sensor ── */
.em-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.em-card{padding:10px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.15)}
.em-card-h{font-size:9px;letter-spacing:2px;color:#556677;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.em-card-v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.em-card-u{font-size:10px;color:#556677;margin-left:3px}
.em-card-sub{font-size:9px;color:#334455;margin-top:3px}
.em-bar-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.em-bar-bg{flex:1;height:4px;background:#0a0f14;border-radius:1px;overflow:hidden}
.em-bar-fill{height:100%;border-radius:1px;transition:width .3s}

/* Mediation Coefficient */
.med-coeff{padding:16px;border:1px solid #1a2530;border-radius:2px;background:rgba(0,0,0,.25);margin-bottom:14px;position:relative;overflow:hidden}
.med-coeff::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(0,255,170,.03) 0%,transparent 70%);pointer-events:none}
.med-ring{width:120px;height:120px;margin:0 auto 12px;position:relative}
.med-ring canvas{display:block}
.med-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.med-val{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.med-lbl{font-size:8px;letter-spacing:2px;color:#556677;margin-top:2px}
.med-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-top:10px}
.med-dim{text-align:center;padding:6px}
.med-dim-l{font-size:9px;letter-spacing:1px;color:#556677;margin-bottom:2px}
.med-dim-v{font-size:14px;font-weight:500}

/* Radar canvas */
.radar-wrap{margin-bottom:14px;border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);padding:12px}
.radar-wrap canvas{display:block;margin:0 auto}

/* Space Profile */
.sp-tag{display:inline-block;padding:3px 8px;font-size:9px;letter-spacing:1.5px;border-radius:1px;margin:2px}

/* ── v0.8: RF Spectrum ── */
.rf-spectrum-wrap{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:rgba(0,0,0,.25);margin-bottom:14px;position:relative}
.rf-spectrum-wrap canvas{display:block;width:100%}
.rf-waterfall-wrap{border:1px solid #1a2530;border-radius:2px;overflow:hidden;background:#000;margin-bottom:14px}
.rf-waterfall-wrap canvas{display:block;width:100%}
.rf-band-tag{display:inline-block;padding:2px 6px;font-size:8px;letter-spacing:1px;border-radius:1px;margin:1px;cursor:pointer;transition:all .15s}
.rf-band-tag:hover{opacity:.8}
.rf-band-tag.active{box-shadow:0 0 8px currentColor}

/* ── v0.8: NFC ── */
.nfc-pulse{width:80px;height:80px;border-radius:50%;margin:16px auto;position:relative;display:flex;align-items:center;justify-content:center}
.nfc-pulse::before,.nfc-pulse::after{content:'';position:absolute;border-radius:50%;border:1px solid currentColor;animation:nfcRipple 2s ease-out infinite}
.nfc-pulse::before{width:120%;height:120%;opacity:.4}
.nfc-pulse::after{width:160%;height:160%;opacity:.2;animation-delay:.5s}
@keyframes nfcRipple{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.4);opacity:0}}

/* ── v0.8: Thermal ── */
.thermal-gradient{height:12px;border-radius:1px;background:linear-gradient(90deg,#0044ff,#00ccff,#00ff88,#ffcc00,#ff4400,#ff0000);position:relative}
.thermal-marker{position:absolute;top:-4px;width:2px;height:20px;background:#fff;transition:left .5s}

@media(max-width:600px){
  .log-h,.log-r{grid-template-columns:50px 40px 52px 54px 48px 50px 1fr;font-size:10px;padding:4px 6px}
  .st-v{font-size:16px}.hdr h1{font-size:16px;letter-spacing:2px}
  .em-grid{grid-template-columns:1fr}
  .layer-tab{padding:8px 4px;font-size:9px;letter-spacing:1px}
}
</style>
</head>
<body>
<div class="scan"></div>
<div class="ctn" id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
var h=React.createElement,useState=React.useState,useRef=React.useRef,useCallback=React.useCallback,useEffect=React.useEffect,useMemo=React.useMemo;

/* ═══════════════════════════════════════════════════════════ */
/*  SIGNAL PRESETS                                            */
/* ═══════════════════════════════════════════════════════════ */
var SIGNALS={
  chirp_mid:{id:'chirp_mid',name:'CHIRP MID',desc:'1.5→2.5kHz / 20ms — 標準チャープ。室内用途に最適。',type:'chirp',f1:1500,f2:2500,dur:0.020,color:'#00ffaa'},
  chirp_low:{id:'chirp_low',name:'CHIRP LOW',desc:'500→1.5kHz / 30ms — 低周波。壁や障害物を貫通しやすく、建物全体の探索に。',type:'chirp',f1:500,f2:1500,dur:0.030,color:'#ff8800'},
  chirp_high:{id:'chirp_high',name:'CHIRP HIGH',desc:'3→6kHz / 15ms — 高周波。指向性が強く小さな物体も検出。',type:'chirp',f1:3000,f2:6000,dur:0.015,color:'#00ddff'},
  chirp_wide:{id:'chirp_wide',name:'CHIRP WIDE',desc:'800→4kHz / 25ms — 広帯域スイープ。最大の情報量。素材判別にも。',type:'chirp',f1:800,f2:4000,dur:0.025,color:'#ffcc00'},
  pulse_2k:{id:'pulse_2k',name:'PULSE 2kHz',desc:'2kHz単一トーン / 15ms — シンプルなパルス。基準計測用。',type:'tone',freq:2000,dur:0.015,color:'#cc66ff'},
  click:{id:'click',name:'CLICK BURST',desc:'符号化バースト / 10ms — 短いが特徴的なパターン。高時間分解能。',type:'click',dur:0.010,color:'#ff4466'}
};
var SIG_ORDER=['chirp_mid','chirp_low','chirp_high','chirp_wide','pulse_2k','click'];

function genSignal(sig,sr){
  var N=Math.floor(sr*sig.dur),b=new Float32Array(N);
  if(sig.type==='chirp'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*(sig.f1*t+(sig.f2-sig.f1)*t*t/(2*sig.dur)))*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}
  else if(sig.type==='tone'){for(var i=0;i<N;i++){var t=i/sr;b[i]=Math.sin(2*Math.PI*sig.freq*t)*0.5*(1-Math.cos(2*Math.PI*i/(N-1)));}}
  else if(sig.type==='click'){var fc=2500;for(var i=0;i<N;i++){var t=i/sr;var env=Math.exp(-Math.pow((i-N/2)/(N/5),2));b[i]=Math.sin(2*Math.PI*fc*t*(1+0.5*t/sig.dur))*env;}}
  return b;
}

var CFG={sr:44100,listenMs:500,bufSize:256,blanking:8,maxThresh:0.45,minConf:0.04,histMax:64};

function xcorr(sig,ref,sr,blankMs){
  var rL=ref.length,sL=sig.length,bS=Math.floor(sr*blankMs/1000),mL=sL-rL;
  if(mL<=bS)return{corr:new Float32Array(0),peakLag:-1,peakVal:0,bS:bS};
  var rE=0;for(var i=0;i<rL;i++)rE+=ref[i]*ref[i];rE=Math.sqrt(rE);
  var cL=mL-bS,corr=new Float32Array(cL),pV=0,pI=0;
  for(var lag=bS;lag<mL;lag++){
    var sum=0,sE=0;for(var j=0;j<rL;j++){sum+=sig[lag+j]*ref[j];sE+=sig[lag+j]*sig[lag+j];}
    sE=Math.sqrt(sE);var ncc=(rE>0&&sE>0)?sum/(rE*sE):0;
    var idx=lag-bS;corr[idx]=ncc;if(ncc>pV){pV=ncc;pI=idx;}}
  return{corr:corr,peakLag:pI+bS,peakVal:pV,bS:bS};
}

function lagMs(l){return(l/CFG.sr)*1000;}
function calcTh(cn){return Math.max(CFG.minConf,Math.min(cn*2.5,CFG.maxThresh));}
function genId(){return Math.floor(Math.random()*0xFFFF).toString(16).padStart(4,'0').toUpperCase();}
function fMs(v){return v==null?'---':v<1?'<1ms':Math.round(v)+'ms';}
function fT(d){return d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function cls(ms){if(ms==null)return{l:'TIMEOUT',c:'#ff3333'};if(ms<5)return{l:'NEAR',c:'#00ffaa'};if(ms<20)return{l:'ROOM',c:'#00ddff'};if(ms<50)return{l:'HALL',c:'#ffcc00'};if(ms<150)return{l:'OPEN',c:'#ff8800'};return{l:'DISTANT',c:'#ff4444'};}
function eD(ms){return ms==null?null:((ms/1000)*343)/2;}
function cC(c){return c>=.5?'#00ffaa':c>=.3?'#00ddff':c>=.15?'#ffcc00':'#ff4444';}
function flat(b){var t=0;for(var i=0;i<b.length;i++)t+=b[i].length;var f=new Float32Array(t);var o=0;for(var i=0;i<b.length;i++){f.set(b[i],o);o+=b[i].length;}return f;}
function rmsV(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i]*a[i];return Math.sqrt(s/a.length);}

/* ═══════════════════════════════════════════════════════════ */
/*  iOS Detection & Sensor Permissions (same as v0.6)         */
/* ═══════════════════════════════════════════════════════════ */
var IS_IOS=(function(){var ua=navigator.userAgent||'';return /iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);})();
var NEEDS_ORIENT_PERM=IS_IOS&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';
var NEEDS_MOTION_PERM=IS_IOS&&typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';

var _sensorPermState={orient:'unknown',motion:'unknown',listeners:[]};
function notifyPerm(){_sensorPermState.listeners.forEach(function(fn){fn({orient:_sensorPermState.orient,motion:_sensorPermState.motion});});}

function useSensorPermissions(){
  var _s=useState({orient:_sensorPermState.orient,motion:_sensorPermState.motion});
  var perms=_s[0],setPerms=_s[1];
  useEffect(function(){
    var fn=function(v){setPerms({orient:v.orient,motion:v.motion});};
    _sensorPermState.listeners.push(fn);
    if(!NEEDS_ORIENT_PERM&&_sensorPermState.orient==='unknown'){_sensorPermState.orient='granted';notifyPerm();}
    if(!NEEDS_MOTION_PERM&&_sensorPermState.motion==='unknown'){_sensorPermState.motion='granted';notifyPerm();}
    return function(){_sensorPermState.listeners=_sensorPermState.listeners.filter(function(f){return f!==fn;});};
  },[]);
  var requestAll=useCallback(function(){
    var p1=NEEDS_ORIENT_PERM?DeviceOrientationEvent.requestPermission().then(function(r){_sensorPermState.orient=r;}).catch(function(){_sensorPermState.orient='denied';}):Promise.resolve();
    var p2=NEEDS_MOTION_PERM?DeviceMotionEvent.requestPermission().then(function(r){_sensorPermState.motion=r;}).catch(function(){_sensorPermState.motion='denied';}):Promise.resolve();
    return Promise.all([p1,p2]).then(function(){notifyPerm();});
  },[]);
  var needsRequest=perms.orient!=='granted'||perms.motion!=='granted';
  return{perms:perms,requestAll:requestAll,needsRequest:NEEDS_ORIENT_PERM||NEEDS_MOTION_PERM?needsRequest:false,isIOS:IS_IOS};
}

/* ═══════════════════════════════════════════════════════════ */
/*  SENSOR HOOKS (Magnetometer, Light, Motion, Geo)           */
/* ═══════════════════════════════════════════════════════════ */
function useMagnetometer(){
  var _s=useState({x:0,y:0,z:0,mag:0,available:false,heading:null,source:'none'});
  var data=_s[0],setData=_s[1];var ref=useRef(null);var perms=useSensorPermissions();
  useEffect(function(){
    if(ref.current){ref.current();ref.current=null;}
    if(window.Magnetometer){
      try{var sensor=new Magnetometer({frequency:10});
        sensor.addEventListener('reading',function(){var m=Math.sqrt(sensor.x*sensor.x+sensor.y*sensor.y+sensor.z*sensor.z);
          setData({x:sensor.x,y:sensor.y,z:sensor.z,mag:m,available:true,heading:null,source:'magnetometer'});});
        sensor.addEventListener('error',function(){tryOr();});sensor.start();
        ref.current=function(){try{sensor.stop();}catch(e){}};return function(){if(ref.current)ref.current();};
      }catch(e){tryOr();}}else{tryOr();}
    function tryOr(){
      if(NEEDS_ORIENT_PERM&&_sensorPermState.orient!=='granted'){setData(function(d){return Object.assign({},d,{available:false,source:'awaiting_permission'});});return;}
      var handler=function(ev){var heading=ev.alpha!=null?ev.alpha:null;var absH=ev.webkitCompassHeading!=null?ev.webkitCompassHeading:heading;
        var beta=ev.beta||0,gamma=ev.gamma||0;var pseudoMag=Math.sqrt(beta*beta+gamma*gamma);
        setData({x:gamma,y:beta,z:absH||0,mag:pseudoMag,available:absH!=null||beta!==0||gamma!==0,heading:absH,source:'orientation'});};
      window.addEventListener('deviceorientation',handler);ref.current=function(){window.removeEventListener('deviceorientation',handler);};}
    return function(){if(ref.current)ref.current();};
  },[perms.perms.orient]);return data;
}

function useAmbientLight(){

/* Simulated spectrum generator — produces realistic-looking noise floor + peaks */
function genSimSpectrum(band,bins){
  var data=new Float32Array(bins);
  var noiseFloor=-90; /* dBm */
  /* Base noise */
  for(var i=0;i<bins;i++){data[i]=noiseFloor+Math.random()*6-3;}
  /* Add characteristic peaks based on band */
  if(band.id==='wifi24'){
    /* Channels 1,6,11 peaks */
    var chPos=[0.08,0.375,0.67];
    for(var c=0;c<chPos.length;c++){
      var center=Math.floor(chPos[c]*bins);
      var width=Math.floor(bins*0.08);
      var strength=-40-Math.random()*20;
      for(var j=-width;j<=width;j++){
        var idx=center+j;if(idx>=0&&idx<bins){
          var env=Math.exp(-(j*j)/(2*(width/3)*(width/3)));
          data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));
        }
      }
    }
  }else if(band.id==='wifi5'){
    /* Multiple UNII band peaks */
    var peaks=[0.1,0.25,0.45,0.65,0.85];
    for(var c=0;c<peaks.length;c++){
      if(Math.random()>0.3){
        var center=Math.floor(peaks[c]*bins);var width=Math.floor(bins*0.04);
        var strength=-35-Math.random()*25;
        for(var j=-width;j<=width;j++){var idx=center+j;if(idx>=0&&idx<bins){
          var env=Math.exp(-(j*j)/(2*(width/3)*(width/3)));
          data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));}}
      }
    }
  }else if(band.id==='ble'){
    /* BLE advertising channels 37,38,39 + data channels */
    for(var c=0;c<12;c++){
      if(Math.random()>0.5){
        var center=Math.floor((c/12)*bins+bins*0.04);var width=Math.floor(bins*0.02);
        var strength=-50-Math.random()*20;
        for(var j=-width;j<=width;j++){var idx=center+j;if(idx>=0&&idx<bins){
          var env=Math.exp(-(j*j)/(2*(width/4)*(width/4)));
          data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));}}
      }
    }
  }else if(band.id==='fm'){
    /* FM stations — narrowband peaks */
    var stations=[0.12,0.28,0.42,0.55,0.68,0.82,0.91];
    for(var c=0;c<stations.length;c++){
      if(Math.random()>0.2){
        var center=Math.floor(stations[c]*bins);var width=Math.floor(bins*0.015);
        var strength=-25-Math.random()*30;
        for(var j=-width;j<=width;j++){var idx=center+j;if(idx>=0&&idx<bins){
          var env=Math.exp(-(j*j)/(2*(width/3)*(width/3)));
          data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));}}
      }
    }
  }else if(band.id==='lte'){
    /* LTE wide blocks */
    var blocks=[{p:0.05,w:0.06},{p:0.2,w:0.08},{p:0.45,w:0.1},{p:0.7,w:0.07},{p:0.9,w:0.05}];
    for(var c=0;c<blocks.length;c++){
      var center=Math.floor(blocks[c].p*bins);var width=Math.floor(blocks[c].w*bins);
      var strength=-45-Math.random()*15;
      for(var j=-width;j<=width;j++){var idx=center+j;if(idx>=0&&idx<bins){
        var env=1-Math.pow(Math.abs(j)/width,2);
        data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));}}
    }
  }else if(band.id==='ism'){
    /* ISM narrow channels */
    for(var c=0;c<6;c++){
      if(Math.random()>0.4){
        var center=Math.floor((c/6)*bins+bins*0.08);var width=Math.floor(bins*0.03);
        var strength=-55-Math.random()*20;
        for(var j=-width;j<=width;j++){var idx=center+j;if(idx>=0&&idx<bins){
          var env=Math.exp(-(j*j)/(2*(width/3)*(width/3)));
          data[idx]=Math.max(data[idx],strength*env+noiseFloor*(1-env));}}
      }
    }
  }
  return data;
}

/* RF spectrum density metric: ratio of bins above threshold */
function rfDensity(spectrum,threshDbm){
  if(!spectrum||!spectrum.length)return 0;
  var above=0;var th=threshDbm||-70;
  for(var i=0;i<spectrum.length;i++){if(spectrum[i]>th)above++;}
  return above/spectrum.length;
}

/* Peak detection in spectrum */
function rfPeaks(spectrum,band,topN){
  if(!spectrum||!spectrum.length)return[];
  var peaks=[];var n=topN||5;
  var copy=Array.from(spectrum);
  for(var p=0;p<n;p++){
    var maxVal=-999,maxIdx=0;
    for(var i=2;i<copy.length-2;i++){
      if(copy[i]>maxVal&&copy[i]>copy[i-1]&&copy[i]>copy[i+1]){maxVal=copy[i];maxIdx=i;}
    }
    if(maxVal>-85){
      var freq=band.fStart+(maxIdx/spectrum.length)*(band.fEnd-band.fStart);
      peaks.push({freq:freq,power:maxVal,bin:maxIdx});
      /* blank neighbors */
      for(var j=maxIdx-5;j<=maxIdx+5;j++){if(j>=0&&j<copy.length)copy[j]=-999;}
    }
  }
  return peaks;
}

  var readSDR=useCallback(function(device,band){

/* ═══════════════════════════════════════════════════════════ */
/*  MEDIATION COEFFICIENT — v0.8 expanded with 7 dimensions   */
/* ═══════════════════════════════════════════════════════════ */
function calcMediation(acoustic,mag,light,motion,rfData,nfcData,thermalData){
  var dims={};

  /* Acoustic Responsiveness */
  if(acoustic&&acoustic.rtt!=null){dims.acoustic=Math.min(1,acoustic.cf||0);}else{dims.acoustic=0;}

  /* EM Field Density (magnetometer) */
  if(mag.available){
    dims.emField=mag.source==='magnetometer'?Math.min(1,mag.mag/100):Math.min(1,mag.mag/90);
  }else{dims.emField=0.5;}

  /* Photonic Environment */
  if(light.available&&light.lux!=null){dims.photonic=Math.min(1,light.lux/1000);}else{dims.photonic=0.5;}

  /* Kinetic Stability */
  if(motion.available){
    var devFromGravity=Math.abs(motion.mag-9.81);dims.kinetic=Math.max(0,1-devFromGravity/5);
  }else{dims.kinetic=0.5;}

  /* v0.8: RF Density */
  if(rfData&&rfData.spectrum){
    dims.rfDensity=rfDensity(rfData.spectrum,-70);
  }else{dims.rfDensity=0;}

  /* v0.8: NFC Proximity */
  if(nfcData){
    dims.nfcField=nfcData.state.fieldStrength||0;
  }else{dims.nfcField=0;}

  /* v0.8: Thermal State (inverted — cooler is better for sensing) */
  if(thermalData&&thermalData.data.available){
    var temp=thermalData.data.estimatedTemp||22;
    dims.thermal=Math.max(0,Math.min(1,1-(temp-20)/40));
  }else{dims.thermal=0.5;}

  /* Composite: expanded weights */
  var weights={acoustic:0.25,emField:0.15,photonic:0.10,kinetic:0.15,rfDensity:0.15,nfcField:0.10,thermal:0.10};
  var total=0,wSum=0;
  for(var k in dims){if(weights[k]!=null){total+=dims[k]*weights[k];wSum+=weights[k];}}
  var composite=wSum>0?total/wSum:0;

  return{composite:composite,dims:dims};
}

/* ═══════════════════════════════════════════════════════════ */
/*  SPACE PROFILE v0.8                                        */
/* ═══════════════════════════════════════════════════════════ */
function classifySpace(med,acousticHist){
  var tags=[];var d=med.dims;

  if(acousticHist&&acousticHist.length>2){
    var avgRtt=0,cnt=0;
    for(var i=0;i<acousticHist.length;i++){if(acousticHist[i].rtt!=null){avgRtt+=acousticHist[i].rtt;cnt++;}}
    if(cnt>0){avgRtt/=cnt;
      if(avgRtt<5)tags.push({l:'ENCLOSED',c:'#00ffaa'});
      else if(avgRtt<20)tags.push({l:'INDOOR',c:'#00ddff'});
      else if(avgRtt<50)tags.push({l:'OPEN-INDOOR',c:'#ffcc00'});
      else tags.push({l:'OUTDOOR',c:'#ff8800'});}
  }
  if(d.emField>0.7)tags.push({l:'HIGH-EM',c:'#ff4466'});
  else if(d.emField>0.3)tags.push({l:'MODERATE-EM',c:'#cc66ff'});
  else tags.push({l:'LOW-EM',c:'#00ffaa'});

  if(d.photonic>0.8)tags.push({l:'BRIGHT',c:'#ffcc00'});
  else if(d.photonic>0.3)tags.push({l:'LIT',c:'#8899aa'});
  else tags.push({l:'DIM',c:'#556677'});

  if(d.kinetic>0.8)tags.push({l:'STABLE',c:'#00ffaa'});
  else if(d.kinetic>0.4)tags.push({l:'MOVING',c:'#ffcc00'});
  else tags.push({l:'UNSTABLE',c:'#ff3333'});

  /* v0.8 RF */
  if(d.rfDensity>0.4)tags.push({l:'RF-DENSE',c:'#ff4466'});
  else if(d.rfDensity>0.1)tags.push({l:'RF-PRESENT',c:'#ff8800'});
  else tags.push({l:'RF-QUIET',c:'#556677'});

  /* v0.8 NFC */
  if(d.nfcField>0.5)tags.push({l:'NFC-ACTIVE',c:'#cc66ff'});
  else if(d.nfcField>0.1)tags.push({l:'NFC-FAINT',c:'#667788'});

  /* v0.8 Thermal */
  if(d.thermal>0.7)tags.push({l:'COOL-ENV',c:'#00ddff'});
  else if(d.thermal<0.3)tags.push({l:'WARM-ENV',c:'#ff8800'});

  if(med.composite>0.7)tags.push({l:'HIGH-CONNECT',c:'#00ffaa'});
  else if(med.composite>0.4)tags.push({l:'MED-CONNECT',c:'#ffcc00'});
  else tags.push({l:'LOW-CONNECT',c:'#ff4444'});

  return tags;
}

/* ═══ RF Spectrum Canvas ═══ */
function SpectrumCanvas(p){
  var spectrum=p.spectrum,band=p.band;var ref=useRef(null);
  useEffect(function(){var cv=ref.current;if(!cv||!spectrum||!spectrum.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
    var W=cv.offsetWidth*dpr,H=140*dpr;cv.width=W;cv.height=H;cv.style.height='140px';

    var minDb=-100,maxDb=-20;var range=maxDb-minDb;
    /* Grid */
    ctx.strokeStyle='#1a253044';ctx.lineWidth=1;
    for(var db=minDb;db<=maxDb;db+=10){
      var y=H-(db-minDb)/range*H;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
      ctx.fillStyle='#33445544';ctx.font=(8*dpr)+'px IBM Plex Mono';ctx.fillText(db+'dBm',2*dpr,y-2*dpr);
    }
    /* Freq labels */
    for(var f=0;f<=4;f++){
      var freq=band.fStart+(band.fEnd-band.fStart)*(f/4);
      var x=(f/4)*W;ctx.fillStyle='#33445544';ctx.font=(8*dpr)+'px IBM Plex Mono';
      ctx.fillText(Math.round(freq)+'MHz',x+2*dpr,H-2*dpr);
    }
    /* Spectrum fill */
    var grad=ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,band.color+'cc');grad.addColorStop(0.5,band.color+'44');grad.addColorStop(1,band.color+'08');
    ctx.beginPath();ctx.moveTo(0,H);
    var xStep=W/spectrum.length;
    for(var i=0;i<spectrum.length;i++){
      var y=H-((spectrum[i]-minDb)/range)*H;y=Math.max(0,Math.min(H,y));
      ctx.lineTo(i*xStep,y);}
    ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
    /* Spectrum line */
    ctx.beginPath();
    for(var i=0;i<spectrum.length;i++){
      var y=H-((spectrum[i]-minDb)/range)*H;y=Math.max(0,Math.min(H,y));
      i===0?ctx.moveTo(i*xStep,y):ctx.lineTo(i*xStep,y);}

  return h('canvas',{ref:ref,className:'cv',style:{width:'100%',height:'140px'}});
}

/* ═══ Waterfall Canvas ═══ */
function WaterfallCanvas(p){
  var waterfall=p.waterfall,band=p.band;var ref=useRef(null);
  useEffect(function(){var cv=ref.current;if(!cv||!waterfall||!waterfall.length)return;
    var ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;

    var rows=waterfall.length;var rowH=H/Math.min(rows,64);
    var minDb=-100,maxDb=-20;var range=maxDb-minDb;
    for(var r=0;r<Math.min(rows,64);r++){
      var sp=waterfall[r];if(!sp)continue;
      var xStep=W/sp.length;
      for(var i=0;i<sp.length;i++){
        var norm=(sp[i]-minDb)/range;norm=Math.max(0,Math.min(1,norm));

        else if(norm<0.5){rr=0;gg=Math.floor(100+(norm-0.25)*4*155);bb=Math.floor(255-(norm-0.25)*4*255);}

        ctx.fillStyle='rgb('+rr+','+gg+','+bb+')';
        ctx.fillRect(i*xStep,r*rowH,Math.ceil(xStep)+1,Math.ceil(rowH)+1);

        h('div',{style:{fontSize:'10px',letterSpacing:'1px',color:rf.state.source==='simulation'?'#ff880088':'#00ffaa88'}},
          'SRC: '+(rf.state.source==='simulation'?'SIMULATION':'WEBUSB SDR')),
        !rf.state.connected?
          h('button',{className:'btn btn-sm',onClick:rf.connectSDR,style:{background:'transparent',border:'1px solid #ff446644',color:'#ff4466'}},'⚡ CONNECT SDR'):
          h('button',{className:'btn btn-sm',onClick:rf.disconnectSDR,style:{background:'transparent',border:'1px solid #ff333344',color:'#ff3333'}},'✕ DISCONNECT')
      ),
      rf.state.error?h('div',{style:{fontSize:'9px',color:'#ff666688',marginTop:'6px'}},rf.state.error):null,
      !navigator.usb?h('div',{style:{fontSize:'9px',color:'#ff666644',marginTop:'6px'}},'⚠ WebUSB not available — simulation mode only (requires Chrome/Edge + HTTPS)'):null
    ));

    /* Band selector */
    ch.push(h('div',{className:'sec',key:'rf-band'},
      h('div',{className:'sec-label'},'RF BAND'),
      h('div',{style:{display:'flex',flexWrap:'wrap',gap:'4px',marginBottom:'8px'}},
        RF_BAND_ORDER.map(function(id){var b=RF_BANDS[id];
          return h('span',{key:id,className:'rf-band-tag'+(rf.bandId===id?' active':''),
            onClick:function(){rf.setBandId(id);},
            style:{background:b.color+'15',border:'1px solid '+(rf.bandId===id?b.color+'88':b.color+'33'),color:b.color}},b.name);
        })),
      h('div',{style:{fontSize:'10px',color:'#556677'}},band.desc),
      h('div',{style:{fontSize:'9px',color:'#334455',marginTop:'4px'}},band.fStart+' → '+band.fEnd+' '+band.unit)
    ));

    /* Scan controls */
    ch.push(h('div',{className:'ctrl',key:'rf-ctrl'},
      !rf.state.scanning?
        h('button',{className:'btn',onClick:rf.startScan,style:{background:'linear-gradient(180deg,#ff446622,#ff446611)',border:'1px solid #ff446644',color:'#ff4466'}},'▶ START SCAN'):
        h('button',{className:'btn btn-stop',onClick:rf.stopScan},'■ STOP SCAN'),
      h('div',{style:{fontSize:'10px',color:'#445566',letterSpacing:'1px'}},'500ms sweep | 256 bins')
    ));

    /* Spectrum display */
    if(rf.spectrum){
      var peaks=rfPeaks(rf.spectrum,band,5);
      var density=rfDensity(rf.spectrum,-70);

      ch.push(h('div',{className:'rf-spectrum-wrap',key:'rf-sp'},
        h('div',{className:'cv-lbl'},h('span',null,'POWER SPECTRUM'),h('span',null,band.fStart+'—'+band.fEnd+' '+band.unit)),
        h(SpectrumCanvas,{spectrum:rf.spectrum,band:band})));

      /* Waterfall */
      if(rf.waterfall.length>1){
        ch.push(h('div',{className:'rf-waterfall-wrap',key:'rf-wf'},
          h('div',{className:'cv-lbl',style:{background:'rgba(0,0,0,.5)'}},h('span',null,'WATERFALL'),h('span',null,rf.waterfall.length+' sweeps')),
          h(WaterfallCanvas,{waterfall:rf.waterfall,band:band})));}

      /* Stats */
      ch.push(h('div',{className:'sts',key:'rf-sts'},
        [{l:'PEAKS',v:peaks.length,u:'',c:'#ff4466'},
         {l:'DENSITY',v:(density*100).toFixed(1),u:'%',c:density>0.3?'#ff4466':'#667788'},
         {l:'PEAK PWR',v:peaks.length?peaks[0].power.toFixed(1):'---',u:peaks.length?'dBm':'',c:'#ffcc00'},
         {l:'PEAK FREQ',v:peaks.length?peaks[0].freq.toFixed(0):'---',u:peaks.length?'MHz':'',c:'#00ddff'},
         {l:'FLOOR',v:'-90',u:'dBm',c:'#556677'},
         {l:'BAND',v:band.name,u:'',c:band.color}
        ].map(function(s,i){return h('div',{className:'st',key:i},h('div',{className:'st-l'},s.l),h('div',{className:'st-v',style:{color:s.c,fontSize:typeof s.v==='string'&&s.v.length>4?'14px':'18px'}},s.v,s.u?h('span',{className:'st-u'},s.u):null));})));

      /* Peak list */
      if(peaks.length>0){
        ch.push(h('div',{className:'sec',key:'rf-peaks'},
          h('div',{className:'sec-label'},'DETECTED PEAKS'),
          peaks.map(function(pk,i){
            return h('div',{key:i,style:{display:'flex',gap:'12px',padding:'3px 0',fontSize:'11px',borderBottom:'1px solid #1a253033'}},
              h('span',{style:{color:band.color,minWidth:'30px'}},'#'+(i+1)),
              h('span',{style:{color:'#c0d0e0',minWidth:'80px'}},pk.freq.toFixed(1)+' MHz'),
              h('span',{style:{color:pk.power>-50?'#ff4466':'#667788'}},pk.power.toFixed(1)+' dBm'),
              h('span',{style:{color:'#334455',fontSize:'9px'}},'bin:'+pk.bin));
          })));
      }
    }

    /* RF History */
    if(rf.rfHist.length>0){
      ch.push(h('div',{className:'sec',key:'rf-hist'},
        h('div',{className:'sec-label'},'RF SCAN LOG'),
        h('div',{style:{maxHeight:'160px',overflow:'auto'}},rf.rfHist.slice(0,12).map(function(snap,i){
          return h('div',{key:i,style:{padding:'3px 8px',fontSize:'10px',borderBottom:'1px solid #1a253044',color:'#667788',display:'flex',gap:'10px'}},
            h('span',{style:{color:'#556677',minWidth:'56px'}},fT(snap.time)),
            h('span',{style:{color:RF_BANDS[snap.band].color}},RF_BANDS[snap.band].name),
            h('span',{style:{color:'#ff4466'}},snap.peaks+' peaks'),
            h('span',{style:{color:'#ffcc00'}},snap.peakPower.toFixed(1)+'dBm'),
            h('span',{style:{color:snap.density>0.3?'#ff4466':'#556677'}},(snap.density*100).toFixed(0)+'% dense'));
        }))));
    }

    if(!rf.spectrum&&!rf.state.scanning){
      ch.push(h('div',{className:'empty',key:'rf-emp'},h('div',{className:'empty-i'},'〜'),h('div',{className:'empty-t'},'RF SPECTRUM ANALYZER'),
        h('div',{className:'empty-d'},'START SCANでスペクトラムスキャンを開始。WebUSB対応のRTL-SDRを接続するとリアルRFデータを取得できます。',h('br'),
          'SDR未接続時はバンド特性に基づくリアルタイムシミュレーションで動作します。')));
    }
  }


  /* ═══════════════════════════════════════════ */
  /*  v0.8: NFC + THERMAL LAYER                 */
  /* ═══════════════════════════════════════════ */
  if(layer==='nfc_thermal'){

    /* ── NFC Section ── */
    ch.push(h('div',{className:'sec',key:'nfc-sec'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#9966ff'}}),'NFC FIELD DETECTION'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'1.8',marginBottom:'10px'}},
        'Web NFC APIでNFCタグ・フィールドを検出。',NFC_SUPPORTED?'':'非対応ブラウザではシミュレーションモードで動作。',h('br'),
        'NFC (13.56MHz) の近接場を利用してタグの存在と内容を読み取り。')));

    /* NFC Status + Controls */
    ch.push(h('div',{className:'sec',key:'nfc-ctrl'},
      h('div',{style:{textAlign:'center',marginBottom:'12px'}},
        h('div',{className:'nfc-pulse',style:{
          color:nfc.state.fieldStrength>0.5?'#9966ff':nfc.state.fieldStrength>0?'#9966ff66':'#1a2530',
          background:nfc.state.fieldStrength>0.5?'radial-gradient(circle,#9966ff22,transparent)':'transparent',
          border:'2px solid '+(nfc.state.scanning?'#9966ff44':'#1a2530')
        }},
          h('span',{style:{fontSize:'24px',color:nfc.state.fieldStrength>0.5?'#9966ff':'#334455'}},
            nfc.state.fieldStrength>0.5?'◉':nfc.state.scanning?'◎':'○')),
        h('div',{style:{fontSize:'10px',color:nfc.state.scanning?'#9966ff':'#445566',letterSpacing:'2px',marginTop:'8px'}},
          nfc.state.scanning?(nfc.state.fieldStrength>0.5?'TAG DETECTED':'SCANNING...'):' IDLE'),
        h('div',{style:{fontSize:'9px',color:'#334455',marginTop:'4px'}},'src: '+nfc.state.source+(NFC_SUPPORTED?' (Web NFC)':' (sim)'))
      ),

      /* Field strength bar */
      h('div',{className:'em-bar-row',style:{marginBottom:'10px'}},
        h('span',{style:{fontSize:'9px',color:'#556677',letterSpacing:'1px',minWidth:'44px'}},'FIELD'),
        h('div',{className:'em-bar-bg',style:{height:'8px'}},
          h('div',{className:'em-bar-fill',style:{width:(nfc.state.fieldStrength*100)+'%',background:'linear-gradient(90deg,#9966ff44,#9966ff)',transition:'width .3s'}})),
        h('span',{style:{fontSize:'11px',color:'#9966ff',minWidth:'50px',textAlign:'right'}},(nfc.state.fieldStrength*100).toFixed(0)+'%')),

      h('div',{style:{display:'flex',gap:'8px'}},
        !nfc.state.scanning?
          h('button',{className:'btn',onClick:nfc.startScan,style:{background:'linear-gradient(180deg,#9966ff22,#9966ff11)',border:'1px solid #9966ff44',color:'#9966ff'}},'▶ START NFC SCAN'):
          h('button',{className:'btn btn-stop',onClick:nfc.stopScan},'■ STOP'))
    ));

    /* NFC Tag History */
    if(nfc.state.tagHistory.length>0){
      ch.push(h('div',{className:'sec',key:'nfc-tags'},
        h('div',{className:'sec-label'},'TAG HISTORY'),
        nfc.state.tagHistory.slice(0,8).map(function(tag,i){
          return h('div',{key:i,style:{padding:'8px',marginBottom:'4px',border:'1px solid #9966ff22',borderRadius:'2px',background:'rgba(153,102,255,.03)',animation:'fadeIn .25s ease'}},
            h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'4px'}},
              h('span',{style:{fontSize:'10px',color:'#9966ff',letterSpacing:'1px'}},'UID: '+tag.serialNumber),
              h('span',{style:{fontSize:'9px',color:'#556677'}},fT(tag.time))),
            tag.records.map(function(rec,j){
              return h('div',{key:j,style:{fontSize:'10px',color:'#667788',padding:'2px 0'}},
                h('span',{style:{color:'#445566'}},'['+rec.type+'] '),rec.payload);
            }));
        })));
    }

    if(nfc.state.error){ch.push(h('div',{className:'err',key:'nfc-err'},'⚠ '+nfc.state.error));}

    /* ── Divider ── */
    ch.push(h('div',{key:'div',style:{borderTop:'1px solid #1a2530',margin:'18px 0'}}));

    /* ── THERMAL Section ── */
    ch.push(h('div',{className:'sec',key:'therm-sec'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ff8800'}}),'THERMAL ESTIMATION'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'1.8',marginBottom:'10px'}},
        'ブラウザから直接温度センサーにアクセスするAPIは存在しないため、',h('br'),
        'CPU負荷 + Battery API + 熱モデルから推定温度を算出する。')));

    ch.push(h('div',{className:'sec',key:'therm-ctrl'},
      h('div',{style:{display:'flex',gap:'8px',marginBottom:'14px'}},
        !thermal.data.available?
          h('button',{className:'btn',onClick:thermal.startMonitoring,style:{background:'linear-gradient(180deg,#ff880022,#ff880011)',border:'1px solid #ff880044',color:'#ff8800'}},'▶ START MONITORING'):
          h('button',{className:'btn btn-stop',onClick:thermal.stopMonitoring},'■ STOP')),

      /* Temperature display */
      h('div',{className:'em-grid'},
        h('div',{className:'em-card'},
          h('div',{className:'em-card-h'},h('span',null,'EST. TEMPERATURE'),h('span',{style:{color:thermal.data.available?'#00ffaa':'#556677',fontSize:'8px'}},thermal.data.available?'● ACTIVE':'○ IDLE')),
          h('div',{className:'em-card-v',style:{color:'#ff8800'}},thermal.data.estimatedTemp!=null?thermal.data.estimatedTemp.toFixed(1):'---',h('span',{className:'em-card-u'},'°C')),
          h('div',{className:'em-card-sub'},'Model: CPU heat + battery + ambient'),
          thermal.data.estimatedTemp!=null?h('div',null,
            h('div',{className:'thermal-gradient',style:{marginTop:'8px'}},
              h('div',{className:'thermal-marker',style:{left:Math.min(100,Math.max(0,((thermal.data.estimatedTemp-15)/40)*100))+'%'}}))):null),

        h('div',{className:'em-card'},
          h('div',{className:'em-card-h'},h('span',null,'CPU LOAD'),h('span',{style:{fontSize:'8px',color:'#556677'}},thermal.data.cpuCores+' cores')),
          h('div',{className:'em-card-v',style:{color:'#00ddff'}},(thermal.data.cpuLoad*100).toFixed(1),h('span',{className:'em-card-u'},'%')),
          h('div',{className:'em-bar-row'},h('div',{className:'em-bar-bg',style:{height:'6px'}},h('div',{className:'em-bar-fill',style:{width:(thermal.data.cpuLoad*100)+'%',background:thermal.data.cpuLoad>0.7?'linear-gradient(90deg,#ff4444,#ff0000)':thermal.data.cpuLoad>0.3?'linear-gradient(90deg,#ffcc0044,#ffcc00)':'linear-gradient(90deg,#00ddff44,#00ddff)'}}))),
          h('div',{className:'em-card-sub'},'Measured via timestamp delta')),

        h('div',{className:'em-card'},
          h('div',{className:'em-card-h'},h('span',null,'BATTERY'),h('span',{style:{fontSize:'8px',color:thermal.data.batteryCharging?'#ffcc00':'#556677'}},thermal.data.batteryCharging?'⚡ CHARGING':'○')),
          h('div',{className:'em-card-v',style:{color:thermal.data.batteryLevel!=null?(thermal.data.batteryLevel>0.5?'#00ffaa':thermal.data.batteryLevel>0.2?'#ffcc00':'#ff3333'):'#556677'}},thermal.data.batteryLevel!=null?(thermal.data.batteryLevel*100).toFixed(0):'---',h('span',{className:'em-card-u'},'%')),
          h('div',{className:'em-card-sub'},thermal.data.batteryCharging?'Charging adds ~5°C heat':'Battery discharge nominal')),

        h('div',{className:'em-card'},
          h('div',{className:'em-card-h'},h('span',null,'THERMAL CLASS')),
          h('div',{className:'em-card-v',style:{color:thermal.data.estimatedTemp!=null?(thermal.data.estimatedTemp>40?'#ff3333':thermal.data.estimatedTemp>32?'#ffcc00':'#00ffaa'):'#556677',fontSize:'16px'}},
            thermal.data.estimatedTemp!=null?(thermal.data.estimatedTemp>40?'HOT':thermal.data.estimatedTemp>32?'WARM':thermal.data.estimatedTemp>25?'NORMAL':'COOL'):'---'),
          h('div',{className:'em-card-sub'},'Thermal zone classification'))
      ),

      /* Thermal history chart */
      thermal.data.history.length>2?h('div',{className:'cv-wrap',key:'therm-cv'},
        h('div',{className:'cv-lbl'},h('span',null,'THERMAL HISTORY'),h('span',null,'orange=temp / blue=cpu')),
        h(ThermalHistCanvas,{history:thermal.data.history})):null
    ));

    ch.push(h('div',{className:'nfo',key:'therm-nfo'},
      '▸ THERMAL MODEL: T_est = T_ambient(22°C) + CPU_heat(0-15°C) + Battery_heat(0-8°C) + noise',h('br'),
      '▸ CPU LOAD: Measured via busy-loop timestamp delta (3s interval)',h('br'),
      '▸ BATTERY: Navigator.getBattery() API — charging state affects thermal estimate',h('br'),
      '▸ LIMITATION: Browser sandbox prevents direct hardware temp sensor access',h('br'),
      '▸ ROADMAP: WebHID thermal probe, IR camera (WebRTC), environmental temp API'));
  }


  /* ═══════════════════════════════════════════ */
  /*  MEDIATION COEFFICIENT LAYER (v0.8 expanded)*/
  /* ═══════════════════════════════════════════ */
  if(layer==='mediation'){
    var mc=mediation.composite;var mcColor=mc>0.6?'#00ffaa':mc>0.3?'#ffcc00':'#ff4444';

    ch.push(h('div',{className:'med-coeff',key:'med'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#ffcc00'}}),'MEDIATION COEFFICIENT — μ(x,t) v0.8'),
      h('div',{style:{textAlign:'center',margin:'12px 0'}},
        h(MedRing,{value:mc,dims:mediation.dims}),
        h('div',{className:'med-center',style:{position:'relative',marginTop:'-80px',marginBottom:'40px'}},
          h('div',{className:'med-val',style:{color:mcColor}},mc.toFixed(3)),h('div',{className:'med-lbl'},'COMPOSITE'))),

      h('div',{className:'med-dims'},
        [{k:'acoustic',l:'ACOUSTIC',c:'#00ffaa',desc:'音響反射率'},
         {k:'emField',l:'EM FIELD',c:'#cc66ff',desc:'電磁場密度'},
         {k:'photonic',l:'PHOTONIC',c:'#ffcc00',desc:'光環境'},
         {k:'kinetic',l:'KINETIC',c:'#00ddff',desc:'運動安定性'},
         {k:'rfDensity',l:'RF DENSITY',c:'#ff4466',desc:'RF帯域占有率'},
         {k:'nfcField',l:'NFC FIELD',c:'#9966ff',desc:'NFC近接場'},
         {k:'thermal',l:'THERMAL',c:'#ff8800',desc:'熱環境安定性'}
        ].map(function(d){var v=mediation.dims[d.k]||0;
          return h('div',{className:'med-dim',key:d.k},h('div',{className:'med-dim-l'},d.l),
            h('div',{className:'med-dim-v',style:{color:d.c}},v.toFixed(3)),
            h('div',{style:{fontSize:'8px',color:'#334455',marginTop:'2px'}},d.desc),
            h('div',{className:'em-bar-row',style:{marginTop:'4px'}},h('div',{className:'em-bar-bg'},h('div',{className:'em-bar-fill',style:{width:(v*100)+'%',background:d.c+'88'}}))));
        }))
    ));

    ch.push(h('div',{className:'sec',key:'med-formula'},h('div',{className:'sec-label'},'FORMULA v0.8'),
      h('div',{style:{fontSize:'11px',color:'#667788',lineHeight:'2',fontFamily:'monospace'}},
        'μ(x,t) = Σ wᵢ · dᵢ(x,t)',h('br'),
        'where dᵢ ∈ {acoustic, emField, photonic, kinetic, rfDensity, nfcField, thermal}',h('br'),
        'weights: acoustic=0.25, emField=0.15, photonic=0.10, kinetic=0.15,',h('br'),
        '         rfDensity=0.15, nfcField=0.10, thermal=0.10',h('br'),h('br'),
        h('span',{style:{color:'#445566'}},'v0.8では7次元に拡張。RF帯域占有率、NFC近接場、熱安定性を追加し、'),h('br'),
        h('span',{style:{color:'#445566'}},'物理空間の情報接続性をより高精度に定量化する。'))));

    ch.push(h('div',{className:'radar-wrap',key:'radar'},h('div',{className:'sec-label',style:{marginBottom:'8px'}},'7-DIMENSIONAL RADAR'),h(RadarCanvas,{dims:mediation.dims})));
  }


  /* ═══════════════════════════════════════════ */
  /*  SPACE PROFILE LAYER (v0.8)                */
  /* ═══════════════════════════════════════════ */
  if(layer==='profile'){
    ch.push(h('div',{className:'sec',key:'sp'},
      h('div',{className:'sec-label'},h('span',{className:'dot',style:{background:'#00ddff'}}),'SPACE PROFILE v0.8'),
      h('div',{style:{margin:'10px 0'}},spaceTags.map(function(t,i){
        return h('span',{key:i,className:'sp-tag',style:{background:t.c+'15',border:'1px solid '+t.c+'44',color:t.c}},t.l);})),
      h('div',{style:{fontSize:'10px',color:'#445566',marginTop:'10px',lineHeight:'1.8'}},
        '空間プロファイルは全7センサーレイヤーの統合分類。',h('br'),
        '各タブでセンサーを有効化するとプロファイルが詳細化されます。')));

    ch.push(h('div',{className:'sec',key:'ipc-stack'},
      h('div',{className:'sec-label'},'IPC PROTOCOL STACK — pTCP v0.8'),
      h('div',{style:{fontSize:'10px',lineHeight:'2.2',color:'#556677'}},
        ['L5: SPACE PROFILE — 空間分類・行動推奨・環境適応',
         'L4: MEDIATION — μ(x,t) 7次元情報物理結合係数',
         'L3: SENSOR FUSION — 音響+EM+光+慣性+RF+NFC+熱 統合',
         'L2: ACOUSTIC SONAR — チャープ・相互相関',
         'L2: EM FIELD — 磁力計・環境光・加速度',
         'L2: RF SPECTRUM — WebUSB SDR・周波数解析',
         'L2: NFC FIELD — 近接場検出・タグ読取',
         'L2: THERMAL — CPU負荷・バッテリー・推定温度',
         'L1: DEVICE HARDWARE — マイク・スピーカー・センサー・USB・NFC'
        ].map(function(line,i){
          var colors=['#00ddff','#ffcc00','#cc66ff','#00ffaa','#cc66ff','#ff4466','#9966ff','#ff8800','#556677'];
          return h('div',{key:i,style:{padding:'4px 10px',borderLeft:'3px solid '+colors[i],marginBottom:'2px',background:colors[i]+'08'}},
            h('span',{style:{color:colors[i]}},line));
        }))));

    ch.push(h('div',{className:'sec',key:'roadmap'},h('div',{className:'sec-label'},'DEVELOPMENT ROADMAP'),
      h('div',{style:{fontSize:'10px',color:'#445566',lineHeight:'2'}},
        h('span',{style:{color:'#556677'}},'v0.6'),' — Acoustic Sonar + Magnetometer + AmbientLight + Accelerometer',h('br'),
        h('span',{style:{color:'#00ffaa'}},'v0.8 [CURRENT]'),' — RF Spectrum (WebUSB SDR) + NFC Field + Thermal Estimation + 7D Mediation',h('br'),
        h('span',{style:{color:'#ffcc00'}},'v0.9 [NEXT]'),' — Spatial Mapping (WebXR ARCore/ARKit), Point Cloud, BLE Mesh',h('br'),
        h('span',{style:{color:'#ff8800'}},'v1.0'),' — Full Phase-Law Architecture: pTCP/IP for physical space protocol')));
  }


  /* ── FOOTER ── */
  ch.push(h('div',{className:'leg',key:'leg'},
    [{l:'NEAR',c:'#00ffaa',r:'<5ms'},{l:'ROOM',c:'#00ddff',r:'5-20ms'},{l:'HALL',c:'#ffcc00',r:'20-50ms'},{l:'OPEN',c:'#ff8800',r:'50-150ms'},{l:'DISTANT',c:'#ff4444',r:'>150ms'}].map(function(x){
      return h('span',{className:'leg-i',key:x.l},h('span',{className:'leg-d',style:{background:x.c}}),x.l+' '+x.r);})));

  ch.push(h('div',{className:'ftr',key:'ft'},'pTCP v0.8 IPC | Information Physical Connector | xcorr + EM + RF Spectrum + NFC + Thermal | Phase-Law Architecture'));

  return h('div',null,ch);
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
